descriptions:
- table: shopping_cart_events
  column: event_type
  meaning: Value 1 represents a product view event.
- table: shopping_cart_events
  column: event_type
  meaning: Value 2 represents an 'add to cart' event.
- table: shopping_cart_events
  column: event_type
  meaning: Value 3 represents a purchase event, which flags a visit as a 'purchase
    visit'.
- table: shopping_cart_page_hierarchy
  column: page_id
  meaning: Page IDs 1, 2, 12, and 13 are considered non-product pages and are excluded
    from product-level analysis.
- table: shopping_cart_page_hierarchy
  column: product_id
  meaning: A non-null value indicates that the page is a product-specific page.
relations:
- table_1: shopping_cart_events
  column_1: visit_id
  table_2: shopping_cart_events
  column_2: visit_id
  condition: A JOIN condition where a visit_id is checked for the presence of an event
    with event_type = 3 to determine if the entire visit resulted in a purchase.
synonyms:
- nl_term: product view
  db_target: shopping_cart_events.event_type = 1
  type: condition
- nl_term: add to cart
  db_target: shopping_cart_events.event_type = 2
  type: condition
- nl_term: purchase
  db_target: shopping_cart_events.event_type = 3
  type: condition
- nl_term: product views
  db_target: product_views
  type: column
- nl_term: times added to cart
  db_target: times_added_to_cart
  type: column
- nl_term: actual purchases
  db_target: actual_purchases
  type: column
- nl_term: left in cart
  db_target: left_in_cart
  type: column
biz_logic:
- metric_name: Purchase Visits
  sql_logic: SELECT DISTINCT visit_id FROM shopping_cart_events WHERE event_type =
    3
- metric_name: Valid Product Page Filter
  sql_logic: page_id NOT IN (1, 2, 12, 13) AND product_id IS NOT NULL
- metric_name: Product Views
  sql_logic: SUM(CASE WHEN event_type = 1 THEN 1 ELSE 0 END)
- metric_name: Times Added To Cart
  sql_logic: SUM(CASE WHEN event_type = 2 THEN 1 ELSE 0 END)
- metric_name: Actual Purchases
  sql_logic: SUM(CASE WHEN event_type = 2 AND visit_id IN (SELECT DISTINCT visit_id
    FROM shopping_cart_events WHERE event_type = 3) THEN 1 ELSE 0 END)
- metric_name: Left In Cart
  sql_logic: SUM(CASE WHEN event_type = 2 AND visit_id NOT IN (SELECT DISTINCT visit_id
    FROM shopping_cart_events WHERE event_type = 3) THEN 1 ELSE 0 END)
