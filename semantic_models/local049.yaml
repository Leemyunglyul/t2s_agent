descriptions:
- table: companies_funding
  column: valuation
  meaning: A valuation of 1,000,000,000 or more indicates the company is a 'unicorn'.
relations: []
synonyms:
- nl_term: top industry
  db_target: SELECT T1.industry FROM companies_industries AS T1 INNER JOIN companies_dates
    AS T2 ON T1.company_id = T2.company_id GROUP BY T1.industry ORDER BY COUNT(DISTINCT
    T1.company_id) DESC LIMIT 1
  type: value
- nl_term: unicorn
  db_target: valuation >= 1000000000
  type: condition
- nl_term: joined year
  db_target: STRFTIME('%Y', companies_dates.date_joined)
  type: column
- nl_term: new unicorn count
  db_target: COUNT(DISTINCT company_id)
  type: column
biz_logic:
- metric_name: Top Industry by Company Count
  sql_logic: SELECT T1.industry FROM companies_industries AS T1 JOIN companies_dates
    AS T2 ON T1.company_id = T2.company_id GROUP BY T1.industry ORDER BY COUNT(DISTINCT
    T1.company_id) DESC LIMIT 1
