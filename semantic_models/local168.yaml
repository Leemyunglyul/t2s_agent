descriptions:
- table: job_postings_fact
  column: job_work_from_home
  meaning: A value of 1 indicates that the job can be done from home.
- table: job_postings_fact
  column: job_title_short
  meaning: A standardized short title for the job role, such as 'Data Analyst'.
relations: []
synonyms:
- nl_term: data analyst
  db_target: job_postings_fact.job_title_short = 'Data Analyst'
  type: condition
- nl_term: work from home
  db_target: job_postings_fact.job_work_from_home = 1
  type: condition
- nl_term: remote
  db_target: job_postings_fact.job_work_from_home = 1
  type: condition
- nl_term: salary
  db_target: job_postings_fact.salary_year_avg
  type: column
- nl_term: skills
  db_target: skills_dim
  type: table
biz_logic:
- metric_name: Skill Demand
  sql_logic: COUNT(DISTINCT job_id)
- metric_name: Top 3 Skills by Demand
  sql_logic: DENSE_RANK() OVER (ORDER BY COUNT(DISTINCT job_id) DESC) <= 3
- metric_name: Remote Data Analyst Jobs (Salaried)
  sql_logic: FROM job_postings_fact WHERE job_title_short = 'Data Analyst' AND job_work_from_home
    = 1 AND salary_year_avg IS NOT NULL
- metric_name: Average Salary for Remote Data Analyst Jobs with Top Skills
  sql_logic: AVG(salary_year_avg) for jobs where job_title_short = 'Data Analyst',
    job_work_from_home = 1, and the job requires one of the top 3 skills.
