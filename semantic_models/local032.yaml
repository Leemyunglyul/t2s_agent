descriptions:
- table: olist_orders
  column: order_status
  meaning: '''delivered'' status indicates a successfully completed order, often used
    as a filter for performance analysis.'
- table: olist_order_reviews
  column: review_score
  meaning: A value of 5 represents a '5-Star Rating'.
- table: olist_customers
  column: customer_unique_id
  meaning: A unique identifier for a customer across all their orders. Use this to
    count distinct customers. 'customer_id' is unique per order.
- table: olist_order_items
  column: freight_value
  meaning: The cost of shipping for an item, which is subtracted from the item's price
    to calculate seller profit.
relations: []
synonyms:
- nl_term: 5-star rating
  db_target: olist_order_reviews.review_score = 5
  type: condition
- nl_term: distinct customers
  db_target: olist_customers.customer_unique_id
  type: column
biz_logic:
- metric_name: total_profit
  sql_logic: SUM(olist_order_items.price - olist_order_items.freight_value) calculated
    for orders with status 'delivered'.
- metric_name: distinct_customers_count
  sql_logic: COUNT(DISTINCT olist_customers.customer_unique_id) calculated for orders
    with status 'delivered'.
- metric_name: distinct_orders_count
  sql_logic: COUNT(DISTINCT olist_orders.order_id) calculated for orders with status
    'delivered'.
- metric_name: five_star_ratings_count
  sql_logic: COUNT(DISTINCT olist_orders.order_id) for delivered orders that have
    a review_score of 5.
