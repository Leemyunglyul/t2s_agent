descriptions:
- table: olist_orders
  column: order_status
  meaning: '''delivered'' status indicates a successfully completed order, often used
    as a filter for performance analysis.'
- table: olist_order_reviews
  column: review_score
  meaning: A value of 5 represents a '5-Star Rating'.
- table: olist_customers
  column: customer_unique_id
  meaning: A unique identifier for a customer across all their orders. Use this to
    count distinct customers. 'customer_id' is unique per order.
relations: []
synonyms:
- nl_term: 5-star rating
  db_target: olist_order_reviews.review_score = 5
  type: condition
- nl_term: distinct customers
  db_target: olist_customers.customer_unique_id
  type: column
- nl_term: Highest Distinct Customers
  db_target: distinct_customers_count
  type: metric
- nl_term: Highest Profit
  db_target: total_profit
  type: metric
- nl_term: Highest Distinct Orders
  db_target: distinct_orders_count
  type: metric
- nl_term: Most 5-Star Ratings
  db_target: five_star_ratings_count
  type: metric
biz_logic:
- metric_name: total_profit
  sql_logic: SUM(olist_order_items.price - olist_order_items.freight_value) for orders
    where olist_orders.order_status = 'delivered'
- metric_name: distinct_customers_count
  sql_logic: COUNT(DISTINCT olist_customers.customer_unique_id) for orders where olist_orders.order_status
    = 'delivered'
- metric_name: distinct_orders_count
  sql_logic: COUNT(DISTINCT olist_orders.order_id) WHERE olist_orders.order_status
    = 'delivered'
- metric_name: five_star_ratings_count
  sql_logic: COUNT(DISTINCT olist_orders.order_id) WHERE olist_order_reviews.review_score
    = 5 AND olist_orders.order_status = 'delivered'
