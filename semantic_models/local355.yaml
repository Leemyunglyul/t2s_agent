descriptions: []
relations: []
synonyms:
- nl_term: changed constructor
  db_target: constructor_id <> LEAD(constructor_id, 1) OVER (PARTITION BY driver_id,
    year ORDER BY round)
  type: condition
- nl_term: driver appearances
  db_target: results
  type: table
- nl_term: fewer than three races missed
  db_target: (LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) -
    round - 1) < 3
  type: condition
- nl_term: hiatus
  db_target: (LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) -
    round - 1) > 0
  type: condition
- nl_term: missed races
  db_target: (LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) -
    round - 1) > 0
  type: condition
- nl_term: team switch
  db_target: constructor_id <> LEAD(constructor_id, 1) OVER (PARTITION BY driver_id,
    year ORDER BY round)
  type: condition
biz_logic:
- metric_name: Driver Hiatus with Team Change
  sql_logic: (LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) -
    round - 1) > 0 AND (LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY
    round) - round - 1) < 3 AND constructor_id <> LEAD(constructor_id, 1) OVER (PARTITION
    BY driver_id, year ORDER BY round)
- metric_name: First Missed Round
  sql_logic: round + 1
- metric_name: Last Missed Round
  sql_logic: LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) - 1
- metric_name: Number of Missed Races
  sql_logic: LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) - round
    - 1
