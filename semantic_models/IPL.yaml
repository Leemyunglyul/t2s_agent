```yaml
descriptions:
  - table: "ball_by_ball"
    column: "striker"
    meaning: |
      The ID of the player currently batting (facing the bowler) and credited for runs scored off the bat. Refers to player.player_id.
  - table: "ball_by_ball"
    column: "non_striker"
    meaning: |
      The ID of the player at the non-striking end. Refers to player.player_id.
  - table: "ball_by_ball"
    column: "striker, non_striker"
    meaning: |
      Represents the current batting partnership for a given ball.
  - table: "ball_by_ball"
    column: "bowler"
    meaning: |
      The ID of the player who is bowling. Refers to player.player_id.
  - table: "batsman_scored"
    column: "runs_scored"
    meaning: |
      Runs scored by the batsman off the bat for a single delivery. Must be combined with `extra_runs.extra_runs` for the total runs scored on that ball.
  - table: "extra_runs"
    column: "extra_runs"
    meaning: |
      Runs not scored off the bat (e.g., wides, no-balls). Must be combined with `batsman_scored.runs_scored` for the total runs scored on a ball.
  - table: "extra_runs"
    column: "extra_type"
    meaning: |
      The type of extra run. Only 'wides' and 'noballs' are counted as runs conceded by the bowler and are not counted as legal deliveries when calculating overs.
  - table: "wicket_taken"
    column: "kind_out"
    meaning: |
      The type of dismissal. Wickets are not credited to the bowler for types 'run out', 'retired hurt', 'obstructing the field', 'handled the ball', and 'hit wicket'.
  - table: "wicket_taken"
    column: "player_out"
    meaning: |
      The ID of the player who was dismissed.
  - table: "player_match"
    column: "player_id"
    meaning: |
      Indicates a player's participation in a specific match, identified by match_id.
  - table: "match"
    column: "season_id"
    meaning: |
      The ID of the tournament season, where the value corresponds to the season number (e.g., 5 means 'Season 5').
relations:
  - table_1: "ball_by_ball"
    column_1: ["match_id", "innings_no", "over_id", "ball_id"]
    table_2: "batsman_scored"
    column_2: ["match_id", "innings_no", "over_id", "ball_id"]
  - table_1: "ball_by_ball"
    column_1: ["match_id", "innings_no", "over_id", "ball_id"]
    table_2: "wicket_taken"
    column_2: ["match_id", "innings_no", "over_id", "ball_id"]
  - table_1: "ball_by_ball"
    column_1: ["match_id", "innings_no", "over_id", "ball_id"]
    table_2: "extra_runs"
    column_2: ["match_id", "innings_no", "over_id", "ball_id"]
  - table_1: "player"
    column_1: "player_id"
    table_2: "ball_by_ball"
    column_2: "bowler"
  - table_1: "ball_by_ball"
    column_1: ["match_id", "striker"]
    table_2: "player_match"
    column_2: ["match_id", "player_id"]
synonyms:
  - nl_term: "country"
    db_target: "player.country_name"
    type: "column"
  - nl_term: "runs"
    db_target: "batsman_scored.runs_scored"
    type: "column"
  - nl_term: "matches played"
    db_target: "player_match"
    type: "table"
  - nl_term: "top N, top 3, top 5, top 5 players"
    db_target: "DENSE_RANK() OVER (ORDER BY ... DESC) <= N"
    type: "condition"
  - nl_term: "player batting average, batting average"
    db_target: "Player Batting Average"
    type: "metric"
  - nl_term: "country average batting average"
    db_target: "Country Average Batting Average"
    type: "metric"
  - nl_term: "highest"
    db_target: "ORDER BY ... DESC"
    type: "condition"
  - nl_term: "best bowler"
    db_target: "ORDER BY bowling_average ASC LIMIT 1"
    type: "condition"
  - nl_term: "season 5"
    db_target: "match.season_id = 5"
    type: "condition"
  - nl_term: "total runs"
    db_target: "SUM(batsman_scored.runs_scored)"
    type: "column"
  - nl_term: "total dismissals"
    db_target: "COUNT(wicket_taken.player_out)"
    type: "column"
  - nl_term: "total matches played, matches played by player"
    db_target: "COUNT(DISTINCT player_match.match_id)"
    type: "column"
  - nl_term: "average runs per match"
    db_target: "Player Average Runs per Match"
    type: "metric"
  - nl_term: "qualifying striker"
    db_target: "A striker who has scored more than 50 runs in at least one match."
    type: "condition"
  - nl_term: "most expensive over, highest scoring over"
    db_target: "RANK() OVER (PARTITION BY match_id ORDER BY SUM(COALESCE(batsman_scored.runs_scored, 0) + COALESCE(extra_runs.extra_runs, 0)) DESC) = 1"
    type: "condition"
  - nl_term: "bowling average"
    db_target: "bowling_average"
    type: "column"
  - nl_term: "bowler"
    db_target: "ball_by_ball.bowler"
    type: "column"
  - nl_term: "runs conceded"
    db_target: "total_runs_conceded"
    type: "column"
  - nl_term: "wickets taken, wickets"
    db_target: "total_wickets_taken"
    type: "column"
  - nl_term: "century, centurion"
    db_target: "SUM(bs.runs_scored) >= 100"
    type: "condition"
  - nl_term: "players"
    db_target: "player.player_name"
    type: "column"
  - nl_term: "batsman, player who scored"
    db_target: "ball_by_ball.striker"
    type: "column"
  - nl_term: "their team lost the match, losing cause"
    db_target: "player_match.team_id != match.match_winner"
    type: "condition"
  - nl_term: "bowling stats"
    db_target: "player.player_name, total_wickets_taken, economy_rate, strike_rate, best_bowling_performance"
    type: "column"
  - nl_term: "economy"
    db_target: "economy_rate"
    type: "column"
  - nl_term: "strike rate"
    db_target: "strike_rate"
    type: "column"
  - nl_term: "best bowling"
    db_target: "best_bowling_performance"
    type: "column"
  - nl_term: "bowler's wicket"
    db_target: "wicket_taken.kind_out IS NOT NULL AND wicket_taken.kind_out NOT IN ('run out', 'retired hurt', 'obstructing the field', 'handled the ball', 'hit wicket')"
    type: "condition"
  - nl_term: "legal delivery"
    db_target: "extra_runs.extra_type NOT IN ('wides', 'noballs')"
    type: "condition"
  - nl_term: "highest scoring partnership"
    db_target: "The partnership with rank = 1, derived from DENSE_RANK() OVER (PARTITION BY match_id ORDER BY total_partnership_score DESC)"
    type: "condition"
  - nl_term: "partnership"
    db_target: "A pair of players identified by ball_by_ball.striker and ball_by_ball.non_striker, aggregated over an innings using a canonical key."
    type: "value"
  - nl_term: "total runs in an over"
    db_target: "SUM(COALESCE(batsman_scored.runs_scored, 0) + COALESCE(extra_runs.extra_runs, 0))"
    type: "column"
  - nl_term: "best bowling figures"
    db_target: "match_wickets || '-' || match_runs"
    type: "column"
  - nl_term: "best bowling performance"
    db_target: "ORDER BY match_wickets DESC, match_runs ASC"
    type: "condition"
biz_logic:
  - metric_name: "Player Total Career Runs"
    sql_logic: |
      SELECT bbb.striker AS player_id, SUM(bs.runs_scored) AS total_runs FROM ball_by_ball AS bbb INNER JOIN batsman_scored AS bs ON bbb.match_id = bs.