    db_target: "A pair of players identified by ball_by_ball.striker and ball_by_ball.non_striker, aggregated over an innings using a canonical key."
    type: "value"
  - nl_term: "total runs in an over"
    db_target: "SUM(COALESCE(batsman_scored.runs_scored, 0) + COALESCE(extra_runs.extra_runs, 0))"
    type: "column"
biz_logic:
  - metric_name: "Player Total Career Runs"
    sql_logic: |
      SELECT bbb.striker AS player_id, SUM(bs.runs_scored) AS total_runs FROM ball_by_ball AS bbb INNER JOIN batsman_scored AS bs ON bbb.match_id = bs.match_id AND bbb.over_id = bs.over_id AND bbb.ball_id = bs.ball_id AND bbb.innings_no = bs.innings_no GROUP BY bbb.striker
  - metric_name: "Player Total Matches Played"
    sql_logic: |
      SELECT player_id, COUNT(DISTINCT match_id) AS total_matches FROM player_match GROUP BY player_id
  - metric_name: "Total Dismissals of Player"
    sql_logic: |
      SELECT wt.player_out AS player_id, COUNT(wt.player_out) AS total_dismissals FROM wicket_taken AS wt WHERE wt.player_out IS NOT NULL GROUP BY wt.player_out
  - metric_name: "Player Batting Average"
    sql_logic: |
      CASE WHEN COALESCE([Total Dismissals of Player], 0) = 0 THEN NULL ELSE CAST(COALESCE([Player Total Career Runs], 0) AS REAL) / COALESCE([Total Dismissals of Player], 1) END
  - metric_name: "Player Average Runs per Match"
    sql_logic: |
      CAST(COALESCE([Player Total Career Runs], 0) AS REAL) / COALESCE([Player Total Matches Played], 1)
  - metric_name: "Country Average Batting Average"
    sql_logic: |
      AVG([Player Batting Average]) GROUP BY player.country_name
  - metric_name: "Total Runs per Ball"
    sql_logic: |
      COALESCE(batsman_scored.runs_scored, 0) + COALESCE(extra_runs.extra_runs, 0)
  - metric_name: "Total Runs Scored in an Over"
    sql_logic: |
      SUM(COALESCE(batsman_scored.runs_scored, 0) + COALESCE(extra_runs.extra_runs, 0))
  - metric_name: "Legal Ball Logic"
    sql_logic: |
      CASE WHEN extra_runs.extra_type IN ('wides', 'noballs') THEN 0 ELSE 1 END
  - metric_name: "Bowler Wicket Logic"
    sql_logic: |
      CASE WHEN wicket_taken.kind_out IS NOT NULL AND wicket_taken.kind_out NOT IN ('run out', 'retired hurt', 'obstructing the field', 'handled the ball', 'hit wicket') THEN 1 ELSE 0 END
  - metric_name: "Total Runs Conceded by Bowler"
    sql_logic: |
      SUM(COALESCE(bs.runs_scored, 0) + COALESCE(CASE WHEN er.extra_type IN ('wides', 'noballs') THEN er.extra_runs ELSE 0 END, 0))
  - metric_name: "Total Wickets Credited to Bowler"
    sql_logic: |
      SUM(CASE WHEN wt.kind_out IS NOT NULL AND wt.kind_out NOT IN ('run out', 'retired hurt', 'obstructing the field', 'handled the ball', 'hit wicket') THEN 1 ELSE 0 END)
  - metric_name: "Bowling Average"
    sql_logic: |
      CAST(SUM([Total Runs Conceded by Bowler]) AS REAL) / NULLIF(SUM([Total Wickets Credited to Bowler]), 0)
  - metric_name: "Career Bowling Economy Rate"
    sql_logic: |
      CASE WHEN SUM([Legal Ball Logic]) = 0 THEN 0.0 ELSE CAST(SUM([Total Runs Conceded by Bowler]) AS REAL) * 6 / SUM([Legal Ball Logic]) END
