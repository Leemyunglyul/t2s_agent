biz_logic:
  - metric_name: "Player Total Career Runs"
    sql_logic: |
      SELECT bb.striker AS player_id, SUM(bs.runs_scored) AS total_runs FROM ball_by_ball AS bb JOIN batsman_scored AS bs ON bb.match_id = bs.match_id AND bb.over_id = bs.over_id AND bb.ball_id = bs.ball_id AND bb.innings_no = bs.innings_no GROUP BY bb.striker
  - metric_name: "Player Runs in Match"
    sql_logic: |
      SELECT bb.match_id, bb.striker AS player_id, SUM(bs.runs_scored) AS total_runs FROM ball_by_ball AS bb JOIN batsman_scored AS bs ON bb.match_id = bs.match_id AND bb.over_id = bs.over_id AND bb.ball_id = bs.ball_id AND bb.innings_no = bs.innings_no GROUP BY bb.match_id, bb.striker
  - metric_name: "Player Runs per Season"
    sql_logic: |
      SELECT M.season_id, BB.striker AS player_id, SUM(BS.runs_scored) AS total_runs FROM match AS M JOIN ball_by_ball AS BB ON M.match_id = BB.match_id JOIN batsman_scored AS BS ON BB.match_id = BS.match_id AND BB.over_id = BS.over_id AND BB.ball_id = BS.ball_id AND BB.innings_no = BS.innings_no GROUP BY M.season_id, BB.striker
  - metric_name: "Matches Played by Player"
    sql_logic: |
      SELECT pm.player_id, COUNT(DISTINCT pm.match_id) AS matches_played FROM player_match AS pm GROUP BY pm.player_id
  - metric_name: "Total Dismissals of Player"
    sql_logic: |
      SELECT wt.player_out AS player_id, COUNT(wt.player_out) AS total_dismissals FROM wicket_taken AS wt WHERE wt.player_out IS NOT NULL GROUP BY wt.player_out
  - metric_name: "Batting Average"
    sql_logic: |
      CASE WHEN COALESCE(total_dismissals, 0) = 0 THEN NULL ELSE CAST(COALESCE(total_runs, 0) AS REAL) / COALESCE(total_dismissals, 1) END. Depends on 'Player Total Career Runs' and 'Total Dismissals of Player'.
  - metric_name: "Average Runs per Match"
    sql_logic: |
      CAST(COALESCE(total_runs, 0) AS REAL) / COALESCE(matches_played, 1). Depends on 'Player Total Career Runs' and 'Matches Played by Player'.
  - metric_name: "Total Wickets Credited to Bowler"
    sql_logic: |
      SUM(CASE WHEN kind_out IS NOT NULL AND kind_out NOT IN ('run out', 'retired hurt', 'obstructing the field', 'handled the ball', 'hit wicket') THEN 1 ELSE 0 END)
  - metric_name: "Total Runs Conceded by Bowler"
    sql_logic: |
      SUM(COALESCE(runs_scored, 0) + COALESCE(CASE WHEN extra_type IN ('wides', 'noballs') THEN extra_runs ELSE 0 END, 0))
  - metric_name: "Bowling Average"
    sql_logic: |
      CAST(total_runs_conceded AS REAL) / total_wickets. Depends on 'Total Runs Conceded by Bowler' and 'Total Wickets Credited to Bowler'.
  - metric_name: "Total Wickets by Player per Season"
    sql_logic: |
      SELECT M.season_id, BB.bowler AS player_id, COUNT(*) AS total_wickets FROM match AS M JOIN ball_by_ball AS BB ON M.match_id = BB.match_id JOIN wicket_taken AS WT ON BB.match_id = WT.match_id AND BB.over_id = WT.over_id AND BB.ball_id = WT.ball_id AND BB.innings_no = WT.innings_no WHERE WT.kind_out NOT IN ('run out', 'retired hurt', 'obstructing the field', 'handled the ball', 'hit wicket') GROUP BY M.season_id, BB.bowler
  - metric_name: "Canonical Partnership Identifier"
    sql_logic: |
      CASE WHEN striker < non_striker THEN striker ELSE non_striker END AS player_a_id, CASE WHEN striker > non_striker THEN striker ELSE non_striker END AS player_b_id
