```yaml
descriptions:
  - table: "ball_by_ball"
    column: "striker"
    meaning: |
      The ID of the player currently batting (facing the bowler) and credited for runs scored off the bat.
  - table: "ball_by_ball"
    column: "striker, non_striker"
    meaning: |
      Represents the current batting partnership for a given ball.
  - table: "batsman_scored"
    column: "runs_scored"
    meaning: |
      Runs scored by the batsman off the bat. Must be combined with `extra_runs.extra_runs` for the total runs scored on a ball.
  - table: "extra_runs"
    column: "extra_runs"
    meaning: |
      Runs not scored off the bat (e.g., wides, no-balls). Must be combined with `batsman_scored.runs_scored` for the total runs scored on a ball.
  - table: "extra_runs"
    column: "extra_type"
    meaning: |
      The type of extra run. Only 'wides' and 'noballs' are counted as runs conceded by the bowler and are not counted as legal deliveries when calculating overs.
  - table: "wicket_taken"
    column: "kind_out"
    meaning: |
      The type of dismissal. Wickets are not credited to the bowler for types 'run out', 'retired hurt', 'obstructing the field', 'handled the ball', and 'hit wicket'.
  - table: "wicket_taken"
    column: "player_out"
    meaning: |
      The ID of the player who was dismissed.
  - table: "player_match"
    column: "player_id"
    meaning: |
      Indicates a player's participation in a specific match.
  - table: "match"
    column: "season_id"
    meaning: |
      The ID of the tournament season, where the value corresponds to the season number (e.g., 5 means 'Season 5').
relations:
  - table_1: "ball_by_ball"
    column_1: ["match_id", "innings_no", "over_id", "ball_id"]
    table_2: "batsman_scored"
    column_2: ["match_id", "innings_no", "over_id", "ball_id"]
  - table_1: "ball_by_ball"
    column_1: ["match_id", "innings_no", "over_id", "ball_id"]
