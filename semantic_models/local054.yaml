descriptions: []
relations: []
synonyms:
- nl_term: spending
  db_target: SUM(invoice_items.UnitPrice * invoice_items.Quantity)
  type: column
- nl_term: best selling artist
  db_target: artists.ArtistId IN (SELECT T2.ArtistId FROM invoice_items AS T1 INNER
    JOIN tracks AS T3 ON T1.TrackId = T3.TrackId INNER JOIN albums AS T4 ON T3.AlbumId
    = T4.AlbumId INNER JOIN artists AS T2 ON T4.ArtistId = T2.ArtistId GROUP BY T2.ArtistId
    ORDER BY SUM(T1.UnitPrice * T1.Quantity) DESC LIMIT 1)
  type: condition
biz_logic:
- metric_name: Sales Amount
  sql_logic: SUM(invoice_items.UnitPrice * invoice_items.Quantity)
- metric_name: Artist Total Sales
  sql_logic: SELECT T2.ArtistId, SUM(T1.UnitPrice * T1.Quantity) AS TotalSales FROM
    invoice_items AS T1 INNER JOIN tracks AS T3 ON T1.TrackId = T3.TrackId INNER JOIN
    albums AS T4 ON T3.AlbumId = T4.AlbumId INNER JOIN artists AS T2 ON T4.ArtistId
    = T2.ArtistId GROUP BY T2.ArtistId
- metric_name: Best Selling Artist ID
  sql_logic: SELECT T2.ArtistId FROM invoice_items AS T1 INNER JOIN tracks AS T3 ON
    T1.TrackId = T3.TrackId INNER JOIN albums AS T4 ON T3.AlbumId = T4.AlbumId INNER
    JOIN artists AS T2 ON T4.ArtistId = T2.ArtistId GROUP BY T2.ArtistId ORDER BY
    SUM(T1.UnitPrice * T1.Quantity) DESC LIMIT 1
- metric_name: Customer Spending On Best Selling Artist
  sql_logic: SELECT T1.CustomerId, SUM(T4.UnitPrice * T4.Quantity) AS Spending FROM
    customers AS T1 INNER JOIN invoices AS T2 ON T1.CustomerId = T2.CustomerId INNER
    JOIN invoice_items AS T4 ON T2.InvoiceId = T4.InvoiceId INNER JOIN tracks AS T5
    ON T4.TrackId = T5.TrackId INNER JOIN albums AS T6 ON T5.AlbumId = T6.AlbumId
    WHERE T6.ArtistId IN (SELECT T2.ArtistId FROM invoice_items AS T1 INNER JOIN tracks
    AS T3 ON T1.TrackId = T3.TrackId INNER JOIN albums AS T4 ON T3.AlbumId = T4.AlbumId
    INNER JOIN artists AS T2 ON T4.ArtistId = T2.ArtistId GROUP BY T2.ArtistId ORDER
    BY SUM(T1.UnitPrice * T1.Quantity) DESC LIMIT 1) GROUP BY T1.CustomerId
