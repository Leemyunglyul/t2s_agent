descriptions:
  - table: "Bowler_Scores"
    column: "WonGame"
    meaning: |
      Indicates if the bowler won the game (1=won, 0=lost).
relations:
  - table_1: "Bowler_Scores"
    column_1: "MatchID"
    table_2: "Tourney_Matches"
    column_2: "MatchID"
synonyms: []
biz_logic:
  - metric_name: "Qualifying Win"
    sql_logic: |
      Bowler_Scores.WonGame = 1 AND Bowler_Scores.HandiCapScore <= 190 AND Tournaments.TourneyLocation IN ('Thunderbird Lanes', 'Totem Lanes', 'Bolero Lanes')
  - metric_name: "Eligible Bowler"
    sql_logic: |
      A condition applied to a bowler's set of 'Qualifying Wins'. An eligible bowler is one who has Qualifying Wins in all three specified tournament locations. The logic to check this is: COUNT(DISTINCT Tournaments.TourneyLocation) = 3.