descriptions: []
relations: []
synonyms:
- nl_term: region
  db_target: web_region
  type: table
- nl_term: sales representative
  db_target: web_sales_reps
  type: table
- nl_term: total region sales
  db_target: SUM(web_orders.total_amt_usd)
  type: column
- nl_term: total region orders
  db_target: COUNT(web_orders.id)
  type: column
- nl_term: top sales rep
  db_target: DENSE_RANK() OVER (PARTITION BY region_id ORDER BY total_rep_sales DESC)
    = 1
  type: condition
- nl_term: tied top sales reps
  db_target: GROUP_CONCAT(web_sales_reps.name)
  type: column
biz_logic:
- metric_name: Total Sales per Representative
  sql_logic: SUM(web_orders.total_amt_usd) GROUP BY web_sales_reps.id, web_sales_reps.name,
    web_sales_reps.region_id
- metric_name: Total Sales per Region
  sql_logic: SUM(web_orders.total_amt_usd) GROUP BY web_region.id, web_region.name
- metric_name: Total Orders per Region
  sql_logic: COUNT(web_orders.id) GROUP BY web_region.id, web_region.name
- metric_name: Sales Rep Regional Ranking
  sql_logic: DENSE_RANK() OVER (PARTITION BY region_id ORDER BY total_rep_sales DESC)
- metric_name: Handling Tied Top Sales Reps
  sql_logic: GROUP_CONCAT(web_sales_reps.name)
