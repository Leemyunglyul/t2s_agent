descriptions:
- table: pizza_clean_runner_orders
  column: cancellation
  meaning: A NULL value indicates a successful, non-cancelled (delivered) order.
- table: pizza_recipes
  column: toppings
  meaning: A comma-separated string of topping_ids that constitute the base recipe
    for a pizza.
- table: pizza_clean_customer_orders
  column: exclusions
  meaning: A comma-separated string of topping_ids to be removed from the base pizza
    recipe. The value 'None' or an empty string indicates no exclusions.
- table: pizza_clean_customer_orders
  column: extras
  meaning: A comma-separated string of topping_ids to be added to the pizza. The value
    'None' or an empty string indicates no extras.
relations:
- table_1: pizza_recipes
  column_1: toppings
  table_2: pizza_toppings
  column_2: topping_id
- table_1: pizza_clean_customer_orders
  column_1: exclusions
  table_2: pizza_toppings
  column_2: topping_id
- table_1: pizza_clean_customer_orders
  column_1: extras
  table_2: pizza_toppings
  column_2: topping_id
synonyms:
- nl_term: delivered order
  db_target: pizza_clean_runner_orders.cancellation IS NULL
  type: condition
- nl_term: base toppings
  db_target: pizza_recipes.toppings
  type: column
- nl_term: extra toppings
  db_target: pizza_clean_customer_orders.extras
  type: column
- nl_term: excluded toppings
  db_target: pizza_clean_customer_orders.exclusions
  type: column
biz_logic:
- metric_name: Delivered Order Definition
  sql_logic: An order is considered delivered if the 'cancellation' column in the
    'pizza_clean_runner_orders' table is NULL.
- metric_name: Cleaning Topping Modification Data
  sql_logic: 'To handle empty or ''None'' values in the ''extras'' and ''exclusions''
    columns, use the expression: NULLIF(NULLIF(TRIM(column_name), ''None''), '''').'
- metric_name: Unnesting Comma-Separated IDs (SQLite Recursive CTE)
  sql_logic: WITH RECURSIVE Unnested(order_id, topping_id, remaining_toppings) AS
    (SELECT order_id, CAST(TRIM(SUBSTR(column, 1, INSTR(column || ',', ',') - 1))
    AS INTEGER), SUBSTR(column || ',', INSTR(column || ',', ',') + 1) FROM source_table
    WHERE column IS NOT NULL AND column != '' UNION ALL SELECT order_id, CAST(TRIM(SUBSTR(remaining_toppings,
    1, INSTR(remaining_toppings, ',') - 1)) AS INTEGER), SUBSTR(remaining_toppings,
    INSTR(remaining_toppings, ',') + 1) FROM Unnested WHERE remaining_toppings !=
    '' AND TRIM(SUBSTR(remaining_toppings, 1, INSTR(remaining_toppings, ',') - 1))
    != '') SELECT order_id, topping_id FROM Unnested
- metric_name: Total Topping Usage Calculation
  sql_logic: 'To calculate the total usage of each topping across all delivered orders:
    1. Unnest base toppings, extras, and exclusions for each order. 2. Assign a quantity
    modifier: +1 for base/extra toppings, -1 for exclusions. 3. Sum these modifiers
    for each topping within an order to get a ''net_quantity''. 4. Filter for toppings
    where ''net_quantity'' > 0. 5. Sum the ''net_quantity'' for each topping across
    all orders.'
