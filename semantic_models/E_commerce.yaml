descriptions:
  - table: "customers"
    column: "customer_unique_id"
    meaning: |
      Unique identifier for a customer entity. A single customer can have multiple 'customer_id's, but they all map to one 'customer_unique_id'.
relations:
  - table_1: "products"
    column_1: "product_category_name"
    table_2: "product_category_name_translation"
    column_2: "product_category_name"
synonyms:
  - nl_term: "customer"
    db_target: "customers.customer_unique_id"
    type: "column"
  - nl_term: "number of orders"
    db_target: "COUNT(DISTINCT orders.order_id)"
    type: "condition"
  - nl_term: "toy sales"
    db_target: "product_category_name_translation.product_category_name_english = 'toys'"
    type: "condition"
  - nl_term: "customer lifespan in weeks"
    db_target: "CASE WHEN (JULIANDAY(MAX(orders.order_purchase_timestamp)) - JULIANDAY(MIN(orders.order_purchase_timestamp))) < 7 THEN 1.0 ELSE (JULIANDAY(MAX(orders.order_purchase_timestamp)) - JULIANDAY(MIN(orders.order_purchase_timestamp))) / 7.0 END"
    type: "condition"
  - nl_term: "total payment value"
    db_target: "SUM(order_payments.payment_value)"
    type: "condition"
  - nl_term: "average payment per order"
    db_target: "(SUM(order_payments.payment_value) * 1.0 / COUNT(DISTINCT orders.order_id))"
    type: "condition"
  - nl_term: "customer rank"
    db_target: "DENSE_RANK() OVER (ORDER BY (SUM(order_payments.payment_value) * 1.0 / COUNT(DISTINCT orders.order_id)) DESC)"
    type: "condition"
  - nl_term: "top 3 customers"
    db_target: "DENSE_RANK() OVER (ORDER BY (SUM(order_payments.payment_value) * 1.0 / COUNT(DISTINCT orders.order_id)) DESC) <= 3"
    type: "condition"
biz_logic:
  - metric_name: "avg_payment_per_order"
    sql_logic: |
      (SUM(order_payments.payment_value) * 1.0 / COUNT(DISTINCT orders.order_id))
  - metric_name: "customer_lifespan_weeks"
    sql_logic: |
      CASE WHEN (JULIANDAY(MAX(orders.order_purchase_timestamp)) - JULIANDAY(MIN(orders.order_purchase_timestamp))) < 7 THEN 1.0 ELSE (JULIANDAY(MAX(orders.order_purchase_timestamp)) - JULIANDAY(MIN(orders.order_purchase_timestamp))) / 7.0 END
  - metric_name: "customer_rank"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY (SUM(order_payments.payment_value) * 1.0 / COUNT(DISTINCT orders.order_id)) DESC)
  - metric_name: "daily_sales"
    sql_logic: |
      SUM(order_items.price) GROUP BY DATE(orders.order_purchase_timestamp)
  - metric_name: "daily_sales_for_category"
    sql_logic: |
      SUM(oi.price) FROM orders AS o JOIN order_items AS oi ON o.order_id = oi.order_id JOIN products AS p ON oi.product_id = p.product_id JOIN product_category_name_translation AS pcnt ON p.product_category_name = pcnt.product_category_name WHERE pcnt.product_category_name_english = '[category_name]' GROUP BY DATE(o.order_purchase_timestamp)
  - metric_name: "days_since_start_date"
    sql_logic: |
      JULIANDAY(date_column) - JULIANDAY('start_date')
  - metric_name: "five_day_simple_moving_average"
    sql_logic: |
      AVG(value_column) OVER (ORDER BY date_column ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING)
  - metric_name: "linear_regression_intercept"
    sql_logic: |
      (SUM(y) - ((CAST(COUNT(*) AS REAL) * SUM(x * y) - SUM(x) * SUM(y)) / NULLIF(CAST(COUNT(*) AS REAL) * SUM(x * x) - SUM(x) * SUM(x), 0)) * SUM(x)) / NULLIF(COUNT(*), 0)
  - metric_name: "linear_regression_prediction"
    sql_logic: |
      slope * (JULIANDAY(date_column) - JULIANDAY('start_date') + 1) + intercept
  - metric_name: "linear_regression_slope"
    sql_logic: |
      (CAST(COUNT(*) AS REAL) * SUM(x * y) - SUM(x) * SUM(y)) / NULLIF(CAST(COUNT(*) AS REAL) * SUM(x * x) - SUM(x) * SUM(x), 0)
  - metric_name: "number_of_orders"
    sql_logic: |
      COUNT(DISTINCT orders.order_id)
  - metric_name: "recursive_date_series_generation"
    sql_logic: |
      WITH RECURSIVE DateSeries(date_col) AS (SELECT 'start_date' UNION ALL SELECT DATE(date_col, '+1 day') FROM DateSeries WHERE date_col < 'end_date') SELECT date_col FROM DateSeries
  - metric_name: "time_series_index_from_start_date"
    sql_logic: |
      JULIANDAY(date_column) - JULIANDAY('start_date') + 1
  - metric_name: "total_payment_value"
    sql_logic: |
      SUM(order_payments.payment_value)