biz_logic:
- metric_name: Median of Highest Season Goals per Team
  sql_logic: "WITH TeamGoals AS (\n    SELECT\n        home_team_api_id AS team_id,\n\
    \        season,\n        home_team_goal AS goals\n    FROM Match\n    UNION ALL\n\
    \    SELECT\n        away_team_api_id AS team_id,\n        season,\n        away_team_goal\
    \ AS goals\n    FROM Match\n),\nTeamSeasonTotals AS (\n    SELECT\n        team_id,\n\
    \        season,\n        SUM(goals) AS total_season_goals\n    FROM TeamGoals\n\
    \    GROUP BY\n        team_id,\n        season\n),\nHighestSeasonGoals AS (\n\
    \    SELECT\n        team_id,\n        MAX(total_season_goals) AS max_goals\n\
    \    FROM TeamSeasonTotals\n    GROUP BY\n        team_id\n),\nRankedGoals AS\
    \ (\n    SELECT\n        max_goals,\n        ROW_NUMBER() OVER (ORDER BY max_goals)\
    \ AS rn,\n        COUNT(*) OVER () AS total_count\n    FROM HighestSeasonGoals\n\
    )\nSELECT\n    AVG(max_goals) AS median_highest_season_goals\nFROM RankedGoals\n\
    WHERE\n    rn IN ((total_count + 1) / 2, (total_count + 2) / 2)"
