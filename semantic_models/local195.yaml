descriptions: []
relations: []
synonyms:
- nl_term: top 5 actors
  db_target: DENSE_RANK() OVER (ORDER BY rental_count DESC) <= 5
  type: condition
biz_logic:
- metric_name: Actor Rank by Rental Count
  sql_logic: DENSE_RANK() OVER (ORDER BY rental_count DESC)
- metric_name: Actor Rental Count
  sql_logic: SELECT T2.actor_id, COUNT(T4.rental_id) AS rental_count FROM film_actor
    AS T2 INNER JOIN inventory AS T3 ON T2.film_id = T3.film_id INNER JOIN rental
    AS T4 ON T3.inventory_id = T4.inventory_id GROUP BY T2.actor_id
- metric_name: Total Customer Count
  sql_logic: SELECT COUNT(DISTINCT customer_id) FROM customer
- metric_name: Percentage of Customers Renting from Top 5 Actors
  sql_logic: SELECT CAST(COUNT(T1.customer_id) AS REAL) * 100 / T2.total_customers
    FROM CustomersRentingFromTopActors AS T1, TotalCustomerCount AS T2
