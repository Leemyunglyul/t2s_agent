descriptions: []
relations: []
synonyms:
- nl_term: countries with more than 4 customers
  db_target: customers.Country IN (SELECT Country FROM customers GROUP BY Country
    HAVING COUNT(DISTINCT CustomerId) > 4)
  type: condition
biz_logic:
- metric_name: Total Sales per Country
  sql_logic: SUM(invoices.Total)
- metric_name: Customer Count per Country
  sql_logic: COUNT(DISTINCT customers.CustomerId)
- metric_name: Median of Total Sales across Countries (with >4 customers)
  sql_logic: WITH CountrySales AS (SELECT SUM(T1.Total) AS CountryTotal FROM invoices
    AS T1 INNER JOIN customers AS T2 ON T1.CustomerId = T2.CustomerId GROUP BY T2.Country
    HAVING COUNT(DISTINCT T2.CustomerId) > 4), RankedSales AS (SELECT CountryTotal,
    ROW_NUMBER() OVER (ORDER BY CountryTotal) AS rn, COUNT(*) OVER () AS total_count
    FROM CountrySales) SELECT AVG(CountryTotal) FROM RankedSales WHERE rn IN ((total_count
    + 1) / 2, (total_count + 2) / 2)
