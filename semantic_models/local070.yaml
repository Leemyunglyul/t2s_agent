descriptions:
- table: cities
  column: country_code_2
  meaning: The value 'cn' in this column represents the country China.
- table: cities
  column: insert_date
  meaning: The date when the city record was inserted, used for time-based analysis.
relations: []
synonyms:
- nl_term: china
  db_target: country_code_2 = 'cn'
  type: condition
- nl_term: july 2021
  db_target: strftime('%Y-%m', insert_date) = '2021-07'
  type: condition
- nl_term: title case city name
  db_target: UPPER(SUBSTR(city_name, 1, 1)) || LOWER(SUBSTR(city_name, 2))
  type: column
- nl_term: one city per day
  db_target: ROW_NUMBER() OVER (PARTITION BY insert_date ORDER BY city_id) = 1
  type: condition
biz_logic:
- metric_name: Consecutive Day Streak Grouping
  sql_logic: DATE(insert_date, '-' || ROW_NUMBER() OVER (ORDER BY insert_date) ||
    ' days')
- metric_name: Consecutive Day Streak Length
  sql_logic: COUNT(*)
- metric_name: Overall Minimum Streak Length
  sql_logic: MIN(streak_length)
- metric_name: Overall Maximum Streak Length
  sql_logic: MAX(streak_length)
- metric_name: Title Case City Name
  sql_logic: UPPER(SUBSTR(city_name, 1, 1)) || LOWER(SUBSTR(city_name, 2))
- metric_name: Deduplicate by Date
  sql_logic: ROW_NUMBER() OVER (PARTITION BY insert_date ORDER BY city_id)
