descriptions:
- table: ball_by_ball
  column: striker
  meaning: The ID of the player who is currently batting and facing the bowler.
- table: player_match
  column: player_id
  meaning: Indicates that a player participated in a specific match, identified by
    match_id.
relations:
- table_1: ball_by_ball
  column_1: match_id, over_id, ball_id, innings_no
  table_2: batsman_scored
  column_2: match_id, over_id, ball_id, innings_no
synonyms:
- nl_term: country
  db_target: player.country_name
  type: column
- nl_term: player
  db_target: player
  type: table
- nl_term: runs
  db_target: batsman_scored.runs_scored
  type: column
- nl_term: matches played
  db_target: player_match
  type: table
- nl_term: top 5
  db_target: DENSE_RANK() OVER (ORDER BY ... DESC) AS rnk WHERE rnk <= 5
  type: condition
- nl_term: player batting average
  db_target: Player Batting Average
  type: metric
- nl_term: country average batting average
  db_target: Country Average Batting Average
  type: metric
- nl_term: highest
  db_target: ORDER BY ... DESC
  type: condition
biz_logic:
- metric_name: Player Total Runs
  sql_logic: SELECT bbb.striker AS player_id, SUM(bs.runs_scored) AS total_runs FROM
    ball_by_ball AS bbb INNER JOIN batsman_scored AS bs ON bbb.match_id = bs.match_id
    AND bbb.over_id = bs.over_id AND bbb.ball_id = bs.ball_id AND bbb.innings_no =
    bs.innings_no GROUP BY bbb.striker
- metric_name: Player Total Matches
  sql_logic: SELECT pm.player_id, COUNT(DISTINCT pm.match_id) AS total_matches FROM
    player_match AS pm GROUP BY pm.player_id
- metric_name: Player Batting Average
  sql_logic: CAST([Player Total Runs] AS REAL) / [Player Total Matches]
- metric_name: Country Average Batting Average
  sql_logic: AVG([Player Batting Average]) GROUP BY player.country_name
