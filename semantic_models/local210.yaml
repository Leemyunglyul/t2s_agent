descriptions:
- table: orders
  column: order_status
  meaning: A value of 'FINISHED' indicates a completed order suitable for analytical
    calculations.
- table: orders
  column: order_created_month
  meaning: A value of 2 represents the month of February.
- table: orders
  column: order_created_month
  meaning: A value of 3 represents the month of March.
relations: []
synonyms: []
biz_logic:
- metric_name: February_Orders_Count
  sql_logic: SUM(CASE WHEN o.order_created_month = 2 THEN 1 ELSE 0 END)
- metric_name: March_Orders_Count
  sql_logic: SUM(CASE WHEN o.order_created_month = 3 THEN 1 ELSE 0 END)
- metric_name: Percentage_Increase
  sql_logic: (CAST(March_Orders_Count AS DECIMAL) - February_Orders_Count) * 100.0
    / February_Orders_Count
