```yaml
descriptions:
  - table: "alien_data"
    column: "aggressive"
    meaning: |
      Defines the disposition of the alien; 0 indicates friendly, 1 indicates hostile.
  - table: "cities"
    column: "capital"
    meaning: |
      A value of 1 indicates that the city is a capital city.
  - table: "cities"
    column: "country_code_2"
    meaning: |
      The value 'cn' in this column represents the country China.
  - table: "cities"
    column: "insert_date"
    meaning: |
      The date when the city record was inserted, used for time-based analysis and identifying consecutive activity periods (streaks).
  - table: "job_postings_fact"
    column: "job_title_short"
    meaning: |
      A standardized short title for the job role, e.g., 'Data Analyst'.
  - table: "job_postings_fact"
    column: "job_work_from_home"
    meaning: |
      A boolean flag where 1 indicates the job allows working from home.
  - table: "legislators"
    column: "gender"
    meaning: |
      The gender of the legislator, where 'M' represents Male and 'F' represents Female.
  - table: "legislators_terms"
    column: "state"
    meaning: |
      The value 'LA' in this column represents the state of Louisiana.
  - table: "legislators_terms"
    column: "term_end"
    meaning: |
      The end date of a legislator's term in office. Used with term_start to determine if a legislator was active during a specific time period.
  - table: "legislators_terms"
    column: "term_start"
    meaning: |
      The start date of a legislator's term in office. The earliest term_start for a legislator is considered their first day in office.
relations:
  - table_1: "legislators"
    column_1: "id_bioguide"
    table_2: "legislators_terms"
    column_2: "id_bioguide"
synonyms:
  - nl_term: "active during year"
    db_target: "CAST(year AS TEXT) || '-12-31' >= term_start AND CAST(year AS TEXT) || '-12-31' <= term_end"
    type: "condition"
  - nl_term: "china"
    db_target: "country_code_2 = 'cn'"
    type: "condition"
  - nl_term: "city insertion"
    db_target: "cities"
    type: "table"
  - nl_term: "consecutive day streak"
    db_target: "DATE(insert_date, '-' || ROW_NUMBER() OVER (ORDER BY insert_date) || ' days')"
    type: "condition"
  - nl_term: "country"
    db_target: "cities.country_code_2"
    type: "column"
  - nl_term: "data analyst"
    db_target: "job_postings_fact.job_title_short = 'Data Analyst'"
    type: "condition"
  - nl_term: "female"
    db_target: "'''F'''"
    type: "value"
  - nl_term: "female legislator"
    db_target: "legislators.gender = 'F'"
    type: "condition"
  - nl_term: "first term"
    db_target: "ROW_NUMBER() OVER (PARTITION BY id_bioguide ORDER BY term_start ASC) = 1"
    type: "condition"
  - nl_term: "first term start date, first term date"
    db_target: "MIN(legislators_terms.term_start)"
    type: "column"
  - nl_term: "friendly aliens"
    db_target: "aggressive = 0"
    type: "condition"
  - nl_term: "hostile aliens"
    db_target: "aggressive = 1"
    type: "condition"
  - nl_term: "initial cohort"
    db_target: "legislators_terms.term_start BETWEEN '1917-01-01' AND '1999-12-31'"
    type: "condition"
  - nl_term: "july 2021"
    db_target: "strftime('%Y-%m', insert_date) = '2021-07'"
    type: "condition"
  - nl_term: "June 2022"
    db_target: "insert_date BETWEEN '2022-06-01' AND '2022-06-30'"
    type: "condition"
  - nl_term: "legislator"
    db_target: "legislators"
    type: "table"
  - nl_term: "legislator term"
    db_target: "legislators_terms"
    type: "table"
  - nl_term: "male"
    db_target: "'''M'''"
    type: "value"
  - nl_term: "male legislator"
    db_target: "legislators.gender = 'M'"
    type: "condition"
  - nl_term: "more friendly than hostile aliens"
    db_target: "SUM(CASE WHEN aggressive = 0 THEN 1 ELSE 0 END) > SUM(CASE WHEN aggressive = 1 THEN 1 ELSE 0 END)"
    type: "condition"
  - nl_term: "represented LA"
    db_target: "legislators_terms.state = 'LA'"
    type: "condition"
  - nl_term: "retained legislator"
    db_target: "A legislator is considered retained in a year if they have a term covering the end of that year."
    type: "value"
  - nl_term: "retention rate"
    db_target: "retained_count / cohort_size"
    type: "value"
  - nl_term: "salary"
    db_target: "job_postings_fact.salary_year_avg"
    type: "column"
  - nl_term: "served over a new year"
    db_target: "term_end >= DATE(strftime('%Y', term_start) || '-12-31') AND term_start <= DATE(strftime('%Y', term_end) || '-12-31')"
    type: "condition"
  - nl_term: "shortest and longest streaks"
    db_target: "streak_length = (SELECT MIN(streak_length) FROM streaks) OR streak_length = (SELECT MAX(streak_length) FROM streaks)"
    type: "condition"
  - nl_term: "skills"
    db_target: "skills_dim"
    type: "table"
  - nl_term: "tenure, years of service"
    db_target: "CAST(current_year AS INTEGER) - CAST(STRFTIME('%Y', first_term_date) AS INTEGER)"
    type: "column"
  - nl_term: "title case city name"
    db_target: "UPPER(SUBSTR(city_name, 1, 1)) || LOWER(SUBSTR(city_name, 2))"
    type: "column"
  - nl_term: "top 10 states by population"
    db_target: "DENSE_RANK() OVER (ORDER BY COUNT(id) DESC) <= 10"
    type: "condition"
  - nl_term: "work from home, remote"
    db_target: "job_postings_fact.job_work_from_home = 1"
    type: "condition"
biz_logic:
  - metric_name: "Average Salary for Jobs with Top Skills"
    sql_logic: |
      AVG(salary_year_avg) WHERE job_id IN (SELECT job_id FROM skills_job_dim WHERE skill_id IN (SELECT skill_id FROM TopSkills))
  - metric_name: "Consecutive Date Streak Grouping Key (Date Subtraction)"
    sql_logic: |
      DATE(insert_date, '-' || ROW_NUMBER() OVER (ORDER BY insert_date) || ' days')
  - metric_name: "Consecutive Date Streak Grouping Key (Julian)"
    sql_logic: |
      julianday(insert_date) - ROW_NUMBER() OVER (PARTITION BY country_code_2 ORDER BY insert_date)
  - metric_name: "Country Cohort with 9 Active Days in Jan 2022"
    sql_logic: |
      SELECT country_code_2 FROM cities WHERE STRFTIME('%Y-%m', insert_date) = '2022-01' GROUP BY country_code_2 HAVING COUNT(DISTINCT insert_date) = 9
  - metric_name: "Country with Longest Consecutive Insertion Streak"
    sql_logic: |
      WITH FilteredDates AS (
        SELECT DISTINCT
          country_code_2,
          insert_date
        FROM cities
        WHERE
          insert_date BETWEEN '2022-06-01' AND '2022-06-30'
      ), DateGroups AS (
        SELECT
          country_code_2,
          insert_date,
          julianday(insert_date) - ROW_NUMBER() OVER (PARTITION BY country_code_2 ORDER BY insert_date) AS grouping_key
        FROM FilteredDates
      ), StreakCounts AS (
        SELECT
          country_code_2,
          COUNT(insert_date) AS streak_length
        FROM DateGroups
        GROUP BY