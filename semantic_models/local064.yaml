descriptions:
- table: customer_transactions
  column: txn_type
  meaning: Defines the transaction direction. 'deposit' adds to a balance, while 'withdrawal'
    subtracts from it.
relations: []
synonyms: []
biz_logic:
- metric_name: net_transaction_amount
  sql_logic: CASE WHEN txn_type = 'deposit' THEN txn_amount WHEN txn_type = 'withdrawal'
    THEN -txn_amount ELSE 0 END
- metric_name: monthly_net_transactions_per_customer
  sql_logic: SUM(CASE WHEN txn_type = 'deposit' THEN txn_amount WHEN txn_type = 'withdrawal'
    THEN -txn_amount ELSE 0 END) GROUP BY customer_id, STRFTIME('%Y-%m', txn_date)
- metric_name: total_unique_customers
  sql_logic: COUNT(DISTINCT customer_id) FROM customer_transactions
- metric_name: recursive_month_series_generation
  sql_logic: A recursive CTE pattern to generate a complete time series, e.g., all
    months in a year. WITH RECURSIVE months(month_str) AS (SELECT 'START_YYYY-MM'
    UNION ALL SELECT STRFTIME('%Y-%m', DATE(month_str || '-01', '+1 month')) FROM
    months WHERE month_str < 'END_YYYY-MM')
- metric_name: time_series_scaffolding
  sql_logic: A technique to handle sparse time-series data. Create a complete grid
    of entities (e.g., customers) and time periods (e.g., months) using a CROSS JOIN.
    Then, LEFT JOIN the actual data onto this grid, using COALESCE to replace NULLs
    with a default value (e.g., 0) for periods with no activity. This ensures calculations
    are performed over the complete set of entities and time periods.
- metric_name: scaffolded_customer_monthly_balance
  sql_logic: COALESCE(monthly_net_transactions_per_customer, 0). Represents a customer's
    balance for a given month after joining transaction data to a complete customer-month
    scaffold, ensuring a value (even 0) exists for every month.
- metric_name: monthly_positive_customer_count
  sql_logic: COUNT(CASE WHEN scaffolded_customer_monthly_balance > 0 THEN 1 END)
- metric_name: total_monthly_balance
  sql_logic: SUM(scaffolded_customer_monthly_balance)
- metric_name: avg_balance_all_customers
  sql_logic: (SUM(scaffolded_customer_monthly_balance) * 1.0) / (SELECT COUNT(DISTINCT
    customer_id) FROM customer_transactions)
- metric_name: rank_month_by_highest_positive_customers
  sql_logic: ROW_NUMBER() OVER (ORDER BY positive_customer_count DESC, month_str ASC)
- metric_name: rank_month_by_lowest_positive_customers
  sql_logic: ROW_NUMBER() OVER (ORDER BY positive_customer_count ASC, month_str ASC)
- metric_name: difference_in_avg_balance
  sql_logic: ABS( (avg_balance_all_customers for highest ranked month) - (avg_balance_all_customers
    for lowest ranked month) )
