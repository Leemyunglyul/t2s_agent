descriptions:
  - table: "customergroupthreshold"
    column: "groupname"
    meaning: |
      A named segment or tier for customers based on their spending, such as 'Bronze', 'Silver', or 'Gold'.
  - table: "customergroupthreshold"
    column: "rangebottom"
    meaning: |
      The inclusive lower bound of total spending for a customer to be included in a specific group.
  - table: "customergroupthreshold"
    column: "rangetop"
    meaning: |
      The inclusive upper bound of total spending for a customer to be included in a specific group.
  - table: "orders"
    column: "shippeddate"
    meaning: |
      The date the order was shipped. An order is considered 'late' if this date is on or after its 'requireddate'.
relations:
  - table_1: "orders"
    column_1: "customerid"
    table_2: "customergroupthreshold"
    column_2: "groupname"
    meaning: |
      This is a conceptual, non-equi join. A customer's 'total spending' (calculated as SUM(od.unitprice * od.quantity) from order_details joined on orderid) is used to find the corresponding 'groupname' from customergroupthreshold where the total spending falls between 'rangebottom' and 'rangetop'.
synonyms:
  - nl_term: "total spending, customer spending"
    db_target: "SUM(order_details.unitprice * order_details.quantity)"
    type: "value"
  - nl_term: "spending group, customer tier"
    db_target: "customergroupthreshold.groupname"
    type: "column"
  - nl_term: "number of customers, customer count"
    db_target: "COUNT(DISTINCT customerid)"
    type: "value"
  - nl_term: "year 1998"
    db_target: "STRFTIME('%Y', orders.orderdate) = '1998'"
    type: "condition"
  - nl_term: "late order"
    db_target: "shippeddate >= requireddate"
    type: "condition"
  - nl_term: "high-volume employee"
    db_target: "COUNT(orderid) > 50"
    type: "condition"
biz_logic:
  - metric_name: "Total Customer Spending"
    sql_logic: |
      SUM(order_details.unitprice * order_details.quantity)
  - metric_name: "Number of Unique Customers"
    sql_logic: |
      COUNT(DISTINCT customerid)
  - metric_name: "Late Orders Count"
    sql_logic: |
      SUM(CASE WHEN shippeddate >= requireddate THEN 1 ELSE 0 END)
  - metric_name: "Late Order Percentage"
    sql_logic: |
      CAST(SUM(CASE WHEN shippeddate >= requireddate THEN 1 ELSE 0 END) AS REAL) * 100.0 / COUNT(orderid)
  - metric_name: "Percentage of Total Customers by Group"
    sql_logic: |
      (COUNT(customers in group) * 1.0 / COUNT(DISTINCT total customers in the same period)) * 100.0
  - metric_name: "Employee Rank by Late Order Percentage"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY CAST(SUM(CASE WHEN shippeddate >= requireddate THEN 1 ELSE 0 END) AS REAL) * 100.0 / COUNT(orderid) DESC)
  - metric_name: "Customer Group Percentage (1998 Spenders)"
    sql_logic: |
      CAST(COUNT(CustomerID) AS REAL) * 100 / (SELECT COUNT(DISTINCT CustomerID) FROM Orders WHERE STRFTIME('%Y', OrderDate) = '1998')