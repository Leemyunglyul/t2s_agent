descriptions:
- table: Bowler_Scores
  column: WonGame
  meaning: A value of 1 indicates that the bowler won the game.
relations: []
synonyms: []
biz_logic:
- metric_name: Qualifying Win
  sql_logic: Bowler_Scores.WonGame = 1 AND Bowler_Scores.HandiCapScore <= 190 AND
    Tournaments.TourneyLocation IN ('Thunderbird Lanes', 'Totem Lanes', 'Bolero Lanes')
- metric_name: Eligible Bowler
  sql_logic: 'A bowler who has Qualifying Wins in all three specified locations (''Thunderbird
    Lanes'', ''Totem Lanes'', ''Bolero Lanes''). The SQL logic applied to a bowler''s
    qualifying wins is: COUNT(DISTINCT TourneyLocation) = 3'
