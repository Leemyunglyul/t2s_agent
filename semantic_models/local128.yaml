descriptions:
- table: Bowler_Scores
  column: WonGame
  meaning: A value of 1 indicates that the bowler won the game.
relations:
- table_1: Bowler_Scores
  column_1: MatchID
  table_2: Tourney_Matches
  column_2: MatchID
synonyms: []
biz_logic:
- metric_name: Qualifying Win
  sql_logic: Bowler_Scores.WonGame = 1 AND Bowler_Scores.HandiCapScore <= 190 AND
    Tournaments.TourneyLocation IN ('Thunderbird Lanes', 'Totem Lanes', 'Bolero Lanes')
- metric_name: Eligible Bowler
  sql_logic: 'A bowler who has Qualifying Wins in all three specified locations. SQL
    logic applied to a bowler''s qualifying wins: COUNT(DISTINCT TourneyLocation)
    = 3'
