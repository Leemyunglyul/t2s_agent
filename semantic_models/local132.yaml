descriptions:
- table: Entertainer_Styles
  column: StyleStrength
  meaning: A ranking of an entertainer's proficiency in a musical style. A value of
    1 indicates the primary style, and 2 indicates the secondary style.
- table: Musical_Preferences
  column: PreferenceSeq
  meaning: A ranking of a customer's preference for a musical style. A value of 1
    indicates the primary preference, and 2 indicates the secondary preference.
relations: []
synonyms:
- nl_term: perfect match
  db_target: (ESP.Style1 = CPP.Pref1 AND ESP.Style2 = CPP.Pref2) OR (ESP.Style1 =
    CPP.Pref2 AND ESP.Style2 = CPP.Pref1)
  type: condition
- nl_term: matchable entertainer profile
  db_target: COUNT(StyleID) <= 3 AND MAX(CASE WHEN StyleStrength = 1 THEN StyleID
    END) IS NOT NULL AND MAX(CASE WHEN StyleStrength = 2 THEN StyleID END) IS NOT
    NULL
  type: condition
- nl_term: matchable customer profile
  db_target: COUNT(StyleID) <= 3 AND MAX(CASE WHEN PreferenceSeq = 1 THEN StyleID
    END) IS NOT NULL AND MAX(CASE WHEN PreferenceSeq = 2 THEN StyleID END) IS NOT
    NULL
  type: condition
biz_logic:
- metric_name: Pivoted Entertainer Styles for Matchable Profiles
  sql_logic: SELECT EntertainerID, COUNT(StyleID) AS StyleCount, MAX(CASE WHEN StyleStrength
    = 1 THEN StyleID END) AS Style1, MAX(CASE WHEN StyleStrength = 2 THEN StyleID
    END) AS Style2 FROM Entertainer_Styles GROUP BY EntertainerID HAVING COUNT(StyleID)
    <= 3 AND MAX(CASE WHEN StyleStrength = 1 THEN StyleID END) IS NOT NULL AND MAX(CASE
    WHEN StyleStrength = 2 THEN StyleID END) IS NOT NULL
- metric_name: Pivoted Customer Preferences for Matchable Profiles
  sql_logic: SELECT CustomerID, COUNT(StyleID) AS PrefCount, MAX(CASE WHEN PreferenceSeq
    = 1 THEN StyleID END) AS Pref1, MAX(CASE WHEN PreferenceSeq = 2 THEN StyleID END)
    AS Pref2 FROM Musical_Preferences GROUP BY CustomerID HAVING COUNT(StyleID) <=
    3 AND MAX(CASE WHEN PreferenceSeq = 1 THEN StyleID END) IS NOT NULL AND MAX(CASE
    WHEN PreferenceSeq = 2 THEN StyleID END) IS NOT NULL
- metric_name: Bidirectional Style Match
  sql_logic: (ESP.Style1 = CPP.Pref1 AND ESP.Style2 = CPP.Pref2) OR (ESP.Style1 =
    CPP.Pref2 AND ESP.Style2 = CPP.Pref1)
