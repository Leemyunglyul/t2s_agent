descriptions:
- table: Entertainer_Styles
  column: StyleStrength
  meaning: A ranking of an entertainer's proficiency in a musical style. A value of
    1 indicates the primary style, and 2 indicates the secondary style.
- table: Musical_Preferences
  column: PreferenceSeq
  meaning: A ranking of a customer's preference for a musical style. A value of 1
    indicates the primary preference, and 2 indicates the secondary preference.
relations: []
synonyms:
- nl_term: perfect match
  db_target: (T2.Style1 = T3.Pref1 AND T2.Style2 = T3.Pref2) OR (T2.Style1 = T3.Pref2
    AND T2.Style2 = T3.Pref1)
  type: condition
- nl_term: matchable entertainer profile
  db_target: COUNT(StyleID) <= 3 AND MAX(CASE WHEN StyleStrength = 1 THEN StyleID
    END) IS NOT NULL AND MAX(CASE WHEN StyleStrength = 2 THEN StyleID END) IS NOT
    NULL
  type: condition
- nl_term: matchable customer profile
  db_target: COUNT(StyleID) <= 3 AND MAX(CASE WHEN PreferenceSeq = 1 THEN StyleID
    END) IS NOT NULL AND MAX(CASE WHEN PreferenceSeq = 2 THEN StyleID END) IS NOT
    NULL
  type: condition
biz_logic:
- metric_name: Pivoted Entertainer Styles for Matchable Profiles
  sql_logic: SELECT EntertainerID, MAX(CASE WHEN StyleStrength = 1 THEN StyleID END)
    AS Style1, MAX(CASE WHEN StyleStrength = 2 THEN StyleID END) AS Style2 FROM Entertainer_Styles
    GROUP BY EntertainerID HAVING COUNT(StyleID) <= 3 AND MAX(CASE WHEN StyleStrength
    = 1 THEN StyleID END) IS NOT NULL AND MAX(CASE WHEN StyleStrength = 2 THEN StyleID
    END) IS NOT NULL
- metric_name: Pivoted Customer Preferences for Matchable Profiles
  sql_logic: SELECT CustomerID, MAX(CASE WHEN PreferenceSeq = 1 THEN StyleID END)
    AS Pref1, MAX(CASE WHEN PreferenceSeq = 2 THEN StyleID END) AS Pref2 FROM Musical_Preferences
    GROUP BY CustomerID HAVING COUNT(StyleID) <= 3 AND MAX(CASE WHEN PreferenceSeq
    = 1 THEN StyleID END) IS NOT NULL AND MAX(CASE WHEN PreferenceSeq = 2 THEN StyleID
    END) IS NOT NULL
- metric_name: Bidirectional Style Match
  sql_logic: (PivotedEntertainers.Style1 = PivotedCustomers.Pref1 AND PivotedEntertainers.Style2
    = PivotedCustomers.Pref2) OR (PivotedEntertainers.Style1 = PivotedCustomers.Pref2
    AND PivotedEntertainers.Style2 = PivotedCustomers.Pref1)
