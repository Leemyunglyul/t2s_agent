descriptions:
- table: customergroupthreshold
  column: groupname
  meaning: A named segment or tier for customers based on their spending.
- table: customergroupthreshold
  column: rangebottom
  meaning: The inclusive lower bound of total spending for a customer to be included
    in a specific group.
- table: customergroupthreshold
  column: rangetop
  meaning: The inclusive upper bound of total spending for a customer to be included
    in a specific group.
relations:
- table_1: order_details
  column_1: SUM(unitprice * quantity)
  table_2: customergroupthreshold
  column_2: '[rangebottom, rangetop]'
  description: A non-equi join where a customer's total spending (calculated from
    order_details) is checked to be within a spending range defined in the customergroupthreshold
    table.
synonyms:
- nl_term: total spending
  db_target: SUM(order_details.unitprice * order_details.quantity)
  type: value
- nl_term: spending group
  db_target: customergroupthreshold.groupname
  type: column
- nl_term: year 1998
  db_target: STRFTIME('%Y', orders.orderdate) = '1998'
  type: condition
biz_logic:
- metric_name: Total Spending per Customer
  sql_logic: SUM(order_details.unitprice * order_details.quantity)
- metric_name: Number of Customers in Group
  sql_logic: COUNT(DISTINCT customerid)
- metric_name: Total Customer Count
  sql_logic: COUNT(DISTINCT customerid)
- metric_name: Customer Group Percentage (1998 Spenders)
  sql_logic: CAST(COUNT(CustomerID) AS REAL) * 100 / (SELECT COUNT(DISTINCT CustomerID)
    FROM Orders WHERE STRFTIME('%Y', OrderDate) = '1998')
