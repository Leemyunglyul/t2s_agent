descriptions: []
relations:
- table_1: ball_by_ball
  column_1: match_id, over_id, ball_id, innings_no
  table_2: batsman_scored
  column_2: match_id, over_id, ball_id, innings_no
synonyms:
- nl_term: Qualifying Striker
  db_target: A player who has scored more than 50 runs in at least one match, defined
    in SQL as `runs_in_match > 50`
  type: condition
biz_logic:
- metric_name: Runs In Match by Striker
  sql_logic: SUM(batsman_scored.runs_scored)
- metric_name: Total Career Runs by Striker
  sql_logic: SUM(runs_in_match)
- metric_name: Average Career Runs of Qualifying Strikers
  sql_logic: AVG(total_career_runs)
