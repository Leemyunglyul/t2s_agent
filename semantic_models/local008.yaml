descriptions: []
relations: []
synonyms:
- nl_term: Games Played
  db_target: batting.g
  type: column
- nl_term: Runs
  db_target: batting.r
  type: column
- nl_term: Hits
  db_target: batting.h
  type: column
- nl_term: Home Runs
  db_target: batting.hr
  type: column
- nl_term: player name
  db_target: player.name_given
  type: column
- nl_term: leader
  db_target: JOIN (SELECT MAX(stat_column) AS max_stat FROM ...) AS T2 ON T1.stat_column
    = T2.max_stat
  type: condition
- nl_term: statistic type
  db_target: statistic_name
  type: column
- nl_term: score
  db_target: CASE WHEN T4.category_id = 1 THEN T1.total_g WHEN T4.category_id = 2
    THEN T1.total_r WHEN T4.category_id = 3 THEN T1.total_h WHEN T4.category_id =
    4 THEN T1.total_hr END
  type: value
biz_logic:
- metric_name: Player Career Batting Totals
  sql_logic: SELECT player_id, SUM(g) AS total_g, SUM(r) AS total_r, SUM(h) AS total_h,
    SUM(hr) AS total_hr FROM batting GROUP BY player_id
- metric_name: Maximum Career Batting Statistics
  sql_logic: WITH PlayerCareerTotals AS (SELECT player_id, SUM(g) AS total_g, SUM(r)
    AS total_r, SUM(h) AS total_h, SUM(hr) AS total_hr FROM batting GROUP BY player_id)
    SELECT MAX(total_g) AS max_g, MAX(total_r) AS max_r, MAX(total_h) AS max_h, MAX(total_hr)
    AS max_hr FROM PlayerCareerTotals
- metric_name: Score by Batting Category
  sql_logic: CASE WHEN category_id = 1 THEN total_g WHEN category_id = 2 THEN total_r
    WHEN category_id = 3 THEN total_h WHEN category_id = 4 THEN total_hr END
