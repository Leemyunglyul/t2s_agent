descriptions:
- table: legislators
  column: gender
  meaning: The gender of the legislator, where 'M' represents Male and 'F' represents
    Female.
relations: []
synonyms:
- nl_term: legislator
  db_target: legislators
  type: table
- nl_term: legislator term
  db_target: legislators_terms
  type: table
- nl_term: male
  db_target: '''M'''
  type: value
- nl_term: female
  db_target: '''F'''
  type: value
- nl_term: valid cohort
  db_target: COUNT(DISTINCT period_number) = 6
  type: condition
- nl_term: dual-gender cohorts
  db_target: COUNT(gender) = 2
  type: condition
biz_logic:
- metric_name: Legislator First Term Start Date
  sql_logic: SELECT MIN(term_start) FROM legislators_terms GROUP BY id_bioguide
- metric_name: State with Dual-Gender Valid Cohorts
  sql_logic: GROUP BY state HAVING COUNT(gender) = 2
- metric_name: Legislator Retention Check at N Years
  sql_logic: term_start <= DATE(STRFTIME('%Y', first_term_start, '+' || N || ' years')
    || '-12-31') AND term_end >= DATE(STRFTIME('%Y', first_term_start, '+' || N ||
    ' years') || '-12-31')
- metric_name: Valid State-Gender Cohort
  sql_logic: GROUP BY state, gender HAVING COUNT(DISTINCT period_number) = 6
