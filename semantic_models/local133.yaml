descriptions:
- table: Musical_Preferences
  column: PreferenceSeq
  meaning: Indicates the rank of a customer's preference for a musical style. A value
    of 1 is the highest preference, 2 is the second highest, and 3 is the third highest.
relations: []
synonyms: []
biz_logic:
- metric_name: Total Weighted Style Score
  sql_logic: SUM(CASE WHEN PreferenceSeq = 1 THEN 3 WHEN PreferenceSeq = 2 THEN 2
    WHEN PreferenceSeq = 3 THEN 1 ELSE 0 END)
- metric_name: Overall Average Weighted Score
  sql_logic: AVG(TotalWeightedScore) FROM (SELECT SUM(CASE WHEN PreferenceSeq = 1
    THEN 3 WHEN PreferenceSeq = 2 THEN 2 WHEN PreferenceSeq = 3 THEN 1 ELSE 0 END)
    AS TotalWeightedScore FROM Musical_Preferences GROUP BY StyleID)
- metric_name: Absolute Difference from Average Score
  sql_logic: ABS(TotalWeightedScore - AverageTotalWeightedScore)
