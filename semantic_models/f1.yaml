descriptions: []
relations: []
synonyms:
  - nl_term: "1950s"
    db_target: "year BETWEEN 1950 AND 1959"
    type: "condition"
  - nl_term: "changed constructor, team switch"
    db_target: "constructor_id <> LEAD(constructor_id, 1) OVER (PARTITION BY driver_id, year ORDER BY round)"
    type: "condition"
  - nl_term: "driver appearances"
    db_target: "results"
    type: "table"
  - nl_term: "fewest points"
    db_target: "score = MIN(score) OVER (PARTITION BY season)"
    type: "condition"
  - nl_term: "fewer than three races missed"
    db_target: "(LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) - round - 1) < 3"
    type: "condition"
  - nl_term: "hiatus, missed races"
    db_target: "(LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) - round - 1) > 0"
    type: "condition"
  - nl_term: "point-scoring driver"
    db_target: "SUM(points) > 0"
    type: "condition"
  - nl_term: "season"
    db_target: "races.year"
    type: "column"
  - nl_term: "team"
    db_target: "constructors"
    type: "table"
  - nl_term: "top 3 constructors"
    db_target: "DENSE_RANK() OVER (ORDER BY combined_points DESC) <= 3"
    type: "condition"
biz_logic:
  - metric_name: "Average First Missed Round"
    sql_logic: |
      AVG(first_missed_round)
  - metric_name: "Average Last Missed Round"
    sql_logic: |
      AVG(last_missed_round)
  - metric_name: "Combined Maximum Driver and Constructor Points per Year"
    sql_logic: |
      WITH DriverPointsPerYear AS (
        SELECT
          T1.year,
          T2.driver_id,
          SUM(T2.points) AS driver_total_points
        FROM races AS T1
        INNER JOIN results AS T2
          ON T1.race_id = T2.race_id
        GROUP BY
          T1.year,
          T2.driver_id
      ), MaxDriverPointsPerYear AS (
        SELECT
          year,
          MAX(driver_total_points) AS max_driver_points
        FROM DriverPointsPerYear
        GROUP BY
          year
      ), ConstructorPointsPerYear AS (
        SELECT
          T1.year,
          T2.constructor_id,
          SUM(T2.points) AS constructor_total_points
        FROM races AS T1
        INNER JOIN results AS T2
          ON T1.race_id = T2.race_id
        GROUP BY
          T1.year,
          T2.constructor_id
      ), MaxConstructorPointsPerYear AS (
        SELECT
          year,
          MAX(constructor_total_points) AS max_constructor_points
        FROM ConstructorPointsPerYear
        GROUP BY
          year
      )
      SELECT
        mdp.year,
        mdp.max_driver_points + mcp.max_constructor_points AS combined_max_points
      FROM MaxDriverPointsPerYear AS mdp
      INNER JOIN MaxConstructorPointsPerYear AS mcp
        ON mdp.year = mcp.year
  - metric_name: "Combined Race and Sprint Points"
    sql_logic: |
      SELECT race_id, driver_id, constructor_id, points FROM results UNION ALL SELECT race_id, driver_id, constructor_id, points FROM sprint_results
  - metric_name: "Constructor Combined Points"
    sql_logic: |
      The sum of a constructor's points from the `constructor_results` table and the total points of that constructor's highest-scoring driver for a given year. The driver's total points include points from both main races (`results`) and sprint races (`sprint_results`).
  - metric_name: "Constructor Points Per Season"
    sql_logic: |
      SELECT year, constructor_id, SUM(points) AS season_points FROM constructor_results GROUP BY year, constructor_id
  - metric_name: "Driver Mid-Season Hiatus with Team Change"
    sql_logic: |
      (LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) - round - 1) BETWEEN 1 AND 2 AND constructor_id <> LEAD(constructor_id, 1) OVER (PARTITION BY driver_id, year ORDER BY round)
  - metric_name: "Driver Total Season Points"
    sql_logic: |
      SELECT r.year, T.driver_id, SUM(T.points) AS total_season_points FROM (SELECT race_id, driver_id, points FROM results UNION ALL SELECT race_id, driver_id, points FROM sprint_results) AS T JOIN races AS r ON T.race_id = r.race_id GROUP BY r.year, T.driver_id
  - metric_name: "Eligible Driver Season"
    sql_logic: |
      A driver's season is eligible if they raced for the same constructor in their first and last race of the season and participated in at least two distinct rounds. The condition is `first_race_constructor_id = last_race_constructor_id AND distinct_rounds_count >= 2`, where these values are derived per driver per season.
  - metric_name: "First Missed Round"
    sql_logic: |
      round + 1
  - metric_name: "First Race Constructor of a Season"
    sql_logic: |
      MAX(CASE WHEN ROW_NUMBER() OVER (PARTITION BY driver_id, year ORDER BY round ASC) = 1 THEN constructor_id END)
  - metric_name: "Last Missed Round"
    sql_logic: |
      LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) - 1
  - metric_name: "Last Race Constructor of a Season"
    sql_logic: |
      MAX(CASE WHEN ROW_NUMBER() OVER (PARTITION BY driver_id, year ORDER BY round DESC) = 1 THEN constructor_id END)
  - metric_name: "Maximum Constructor Points per Year"
    sql_logic: |
      SELECT year, MAX(total_constructor_points) AS max_constructor_points FROM (SELECT T1.year, T2.constructor_id, SUM(T2.points) AS total_constructor_points FROM races AS T1 JOIN results AS T2 ON T1.race_id = T2.race_id GROUP BY T1.year, T2.constructor_id) GROUP BY year
  - metric_name: "Maximum Driver Points per Year"
    sql_logic: |
      SELECT year, MAX(total_driver_points) AS max_driver_points FROM (SELECT T1.year, T2.driver_id, SUM(T2.points) AS total_driver_points FROM races AS T1 JOIN results AS T2 ON T1.race_id = T2.race_id GROUP BY T1.year, T2.driver_id) GROUP BY year
  - metric_name: "Minimum Season Points (non-zero)"
    sql_logic: |
      SELECT year, MIN(season_points) AS min_season_points FROM (SELECT r.year, T.driver_id, SUM(T.points) AS season_points FROM (SELECT race_id, driver_id, points FROM results UNION ALL SELECT race_id, driver_id, points FROM sprint_results) AS T JOIN races AS r ON T.race_id = r.race_id GROUP BY r.year, T.driver_id) AS DriverSeasonPoints WHERE season_points > 0 GROUP BY year
  - metric_name: "Number of Missed Races"
    sql_logic: |
      LEAD(round, 1) OVER (PARTITION BY driver_id, year ORDER BY round) - round - 1
  - metric_name: "Number of Races per Driver per Season"
    sql_logic: |
      COUNT(DISTINCT round)
  - metric_name: "Total Constructor Points per Year"
    sql_logic: |
      SELECT T1.year, T2.constructor_id, SUM(T2.points) AS total_constructor_points FROM races AS T1 JOIN results AS T2 ON T1.race_id = T2.race_id GROUP BY T1.year, T2.constructor_id
  - metric_name: "Total Driver Points per Year"
    sql_logic: |
      SELECT T1.year, T2.driver_id, SUM(T2.points) AS total_driver_points FROM races AS T1 JOIN results AS T2 ON T1.race_id = T2.race_id GROUP BY T1.year, T2.driver_id