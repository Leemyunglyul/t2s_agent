descriptions:
  - table: "Match"
    column: "home_player_1, ..., home_player_11"
    meaning: |
      The player_api_id for each of the 11 players on the home team.
  - table: "Match"
    column: "away_player_1, ..., away_player_11"
    meaning: |
      The player_api_id for each of the 11 players on the away team.
  - table: "Match"
    column: "home_team_goal, away_team_goal"
    meaning: |
      Defines match outcome. A draw is `home_team_goal = away_team_goal`. Logic like `home_team_goal != away_team_goal` is used to exclude draws when calculating wins/losses.
relations: []
synonyms:
  - nl_term: "team"
    db_target: "Team"
    type: "table"
  - nl_term: "team name"
    db_target: "Team.team_long_name"
    type: "column"
  - nl_term: "league name"
    db_target: "League.name"
    type: "column"
  - nl_term: "wins"
    db_target: "number_of_wins"
    type: "column"
  - nl_term: "win count"
    db_target: "wins_count"
    type: "column"
  - nl_term: "loss count"
    db_target: "losses_count"
    type: "column"
  - nl_term: "top 10"
    db_target: "DENSE_RANK() OVER (ORDER BY ... DESC) ... WHERE rank_num <= 10"
    type: "value"
  - nl_term: "team with the fewest wins"
    db_target: "ROW_NUMBER() OVER (PARTITION BY league_id ORDER BY total_wins ASC) = 1"
    type: "condition"
  - nl_term: "player with most wins"
    db_target: "DENSE_RANK() OVER (ORDER BY wins_count DESC) AS win_rank WHERE win_rank = 1"
    type: "condition"
  - nl_term: "player with most losses"
    db_target: "DENSE_RANK() OVER (ORDER BY losses_count DESC) AS loss_rank WHERE loss_rank = 1"
    type: "condition"
  - nl_term: "champion"
    db_target: "ROW_NUMBER() OVER (PARTITION BY season, league_id ORDER BY total_points DESC) = 1"
    type: "condition"
biz_logic:
  - metric_name: "Unpivoted Team Match Results"
    sql_logic: |
      SELECT league_id, home_team_api_id AS team_id, CASE WHEN home_team_goal > away_team_goal THEN 1 ELSE 0 END AS is_win FROM Match UNION ALL SELECT league_id, away_team_api_id AS team_id, CASE WHEN away_team_goal > home_team_goal THEN 1 ELSE 0 END AS is_win FROM Match
  - metric_name: "Team Total Wins per League"
    sql_logic: |
      SELECT league_id, team_id, SUM(is_win) AS total_wins FROM UnpivotedTeamMatchResults GROUP BY league_id, team_id
  - metric_name: "Team Total Wins (Overall)"
    sql_logic: |
      WITH wins AS (SELECT home_team_api_id AS team_id FROM Match WHERE home_team_goal > away_team_goal UNION ALL SELECT away_team_api_id AS team_id FROM Match WHERE away_team_goal > home_team_goal), win_counts AS (SELECT team_id, COUNT(*) AS number_of_wins FROM wins GROUP BY team_id)
  - metric_name: "Player Win Count"
    sql_logic: |
      SUM(CASE WHEN (team_type = 'home' AND home_team_goal > away_team_goal) THEN 1 WHEN (team_type = 'away' AND away_team_goal > home_team_goal) THEN 1 ELSE 0 END)
  - metric_name: "Player Loss Count"
    sql_logic: |
      SUM(CASE WHEN (team_type = 'home' AND home_team_goal < away_team_goal) THEN 1 WHEN (team_type = 'away' AND away_team_goal < home_team_goal) THEN 1 ELSE 0 END)
  - metric_name: "Unpivot Player Data from Match Table"
    sql_logic: |
      The PlayerGames CTE unpivots the 22 player columns (home_player_1-11, away_player_1-11) from the Match table into a single row per player per match, creating a normalized view for aggregation.
  - metric_name: "Rank Teams by Wins"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY number_of_wins DESC)
  - metric_name: "Rank Teams by Fewest Wins"
    sql_logic: |
      SELECT league_id, team_id, total_wins, ROW_NUMBER() OVER (PARTITION BY league_id ORDER BY total_wins ASC) AS rank_num FROM TeamTotalWinsPerLeague
  - metric_name: "Rank Players by Wins"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY wins_count DESC)
  - metric_name: "Rank Players by Losses"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY losses_count DESC)
  - metric_name: "Median of Highest Season Goals per Team"
    sql_logic: |
      WITH TeamGoals AS (
          SELECT
              home_team_api_id AS team_id,
              season,
              home_team_goal AS goals
          FROM Match
          UNION ALL
          SELECT
              away_team_api_id AS team_id,
              season,
              away_team_goal AS goals
          FROM Match
      ),
      TeamSeasonTotals AS (
          SELECT
              team_id,
              season,
              SUM(goals) AS total_season_goals
          FROM TeamGoals
          GROUP BY
              team_id,
              season
      ),
      HighestSeasonGoals AS (
          SELECT
              team_id,
              MAX(total_season_goals) AS max_goals
          FROM TeamSeasonTotals
          GROUP BY
              team_id
      ),
      RankedGoals AS (
          SELECT
              max_goals,
              ROW_NUMBER() OVER (ORDER BY max_goals) AS rn,
              COUNT(*) OVER () AS total_count
          FROM HighestSeasonGoals
      )
      SELECT
          AVG(max_goals) AS median_highest_season_goals
      FROM RankedGoals
      WHERE
          rn IN ((total_count + 1) / 2, (total_count + 2) / 2)
  - metric_name: "Match Points Calculation"
    sql_logic: |
      CASE WHEN home_team_goal > away_team_goal THEN 3 WHEN home_team_goal = away_team_goal THEN 1 ELSE 0 END
  - metric_name: "Team Rank by Season"
    sql_logic: |
      ROW_NUMBER() OVER (PARTITION BY season, league_id ORDER BY total_points DESC)
  - metric_name: "Exclude Draw Matches"
    sql_logic: |
      WHERE home_team_goal != away_team_goal