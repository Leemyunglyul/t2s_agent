```yaml
descriptions:
  - table: "payment"
    column: "payment_date"
    meaning: |
      The earliest payment_date for a customer identifies their 'first rental' or 'first purchase' date, which is the basis for Lifetime Value (LTV) calculations.
  - table: "film"
    column: "rating"
    meaning: |
      A film's content rating (e.g., G, PG-13, R), used as a business category to analyze customer preferences, especially based on their first rental.
relations:
  - table_1: "payment"
    column_1: "customer_id"
    table_2: "rental"
    column_2: "customer_id"
synonyms:
  - nl_term: "total rentals"
    db_target: "COUNT(rental.rental_id)"
    type: "value"
  - nl_term: "total spent"
    db_target: "SUM(payment.amount)"
    type: "value"
  - nl_term: "store"
    db_target: "staff.store_id"
    type: "column"
  - nl_term: "rating category, rating_category"
    db_target: "film.rating"
    type: "column"
  - nl_term: "first rental"
    db_target: "ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY payment_date ASC) = 1"
    type: "condition"
  - nl_term: "top 5 actors"
    db_target: "DENSE_RANK() OVER (ORDER BY rental_count DESC) <= 5"
    type: "condition"
  - nl_term: "top 10 customers"
    db_target: "DENSE_RANK() OVER (ORDER BY SUM(amount) DESC) <= 10"
    type: "condition"
  - nl_term: "best performing month"
    db_target: "DENSE_RANK() OVER (PARTITION BY store_id ORDER BY COUNT(rental.rental_id) DESC) = 1"
    type: "condition"
  - nl_term: "payment volatility"
    db_target: "average_monthly_payment_volatility"
    type: "column"
  - nl_term: "month"
    db_target: "STRFTIME('%m', rental.rental_date)"
    type: "column"
  - nl_term: "year"
    db_target: "STRFTIME('%Y', rental.rental_date)"
    type: "column"
  - nl_term: "largest change"
    db_target: "MAX(ABS(total_monthly_payment - LAG(total_monthly_payment, 1, 0) OVER (PARTITION BY customer_id ORDER BY payment_month)))"
    type: "condition"
  - nl_term: "month of change"
    db_target: "month_of_change"
    type: "column"
  - nl_term: "month-over-month difference"
    db_target: "month_over_month_diff"
    type: "column"
  - nl_term: "total payment amount"
    db_target: "total_payment_amount"
    type: "column"
  - nl_term: "subsequent rentals"
    db_target: "COUNT(rental.rental_id) - 1"
    type: "value"
  - nl_term: "highest paying customer"
    db_target: "ORDER BY SUM(payment.amount) DESC"
    type: "condition"
  - nl_term: "largest change amount"
    db_target: "largest_change_amount"
    type: "column"
  - nl_term: "had the largest change"
    db_target: "ORDER BY month_over_month_diff DESC LIMIT 1"
    type: "condition"
  - nl_term: "most volatile customer"
    db_target: "ORDER BY average_monthly_payment_volatility DESC LIMIT 1"
    type: "condition"
biz_logic:
  - metric_name: "first_purchase_date"
    sql_logic: |
      The first payment_date for a customer, typically found using MIN(payment_date) or ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY payment_date ASC) and selecting the first one.
  - metric_name: "total_ltv"
    sql_logic: |
      SUM(amount) per customer
  - metric_name: "ltv_7_days"
    sql_logic: |
      SUM(CASE WHEN payment_date <= DATETIME(first_purchase_date, '+7 day') THEN amount ELSE 0 END)
  - metric_name: "ltv_30_days"
    sql_logic: |
      SUM(CASE WHEN payment_date <= DATETIME(first_purchase_date, '+30 day') THEN amount ELSE 0 END)
  - metric_name: "pct_ltv_7_days"
    sql_logic: |
      (ltv_7_days * 100.0 / total_ltv)
  - metric_name: "pct_ltv_30_days"
    sql_logic: |
      (ltv_30_days * 100.0 / total_ltv)
  - metric_name: "average_total_ltv"
    sql_logic: |
      AVG(total_ltv)
  - metric_name: "average_pct_ltv_7_days"
    sql_logic: |
      AVG(pct_ltv_7_days)
  - metric_name: "average_pct_ltv_30_days"
    sql_logic: |
      AVG(pct_ltv_30_days)
  - metric_name: "average_monthly_payment_volatility"
    sql_logic: |
      The average of the absolute differences between a customer's monthly payment amounts. Calculated via AVG(ABS(monthly_amount - LAG(monthly_amount) OVER (PARTITION BY customer_id ORDER BY payment_month))).
  - metric_name: "customer_rank_by_payment_volatility"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY average_monthly_payment_volatility DESC)
  - metric_name: "Best Rental Month per Store"
    sql_logic: |
      WITH MonthlyStoreRentals AS (SELECT T2.store_id, STRFTIME('%Y', T1.rental_date) AS rental_year, STRFTIME('%m', T1.rental_date) AS rental_month, COUNT(T1.rental_id) AS total_rentals FROM rental AS T1 INNER JOIN staff AS T2 ON T1.staff_id = T2.staff_id GROUP BY T2.store_id, rental_year, rental_month), RankedRentals AS (SELECT store_id, rental_year, rental_month, total_rentals, DENSE_RANK() OVER (PARTITION BY store_id ORDER BY total_rentals DESC) AS rank_num FROM MonthlyStoreRentals) SELECT store_id, rental_year, rental_month, total_rentals FROM RankedRentals WHERE rank_num = 1
  - metric_name: "Actor Rental Count"
    sql_logic: |
      SELECT T1.actor_id, COUNT(T4.rental_id) FROM actor AS T1 JOIN film_actor AS T2 ON T1.actor_id = T2.actor_id JOIN inventory AS T3 ON T2.film_id = T3.film_id JOIN rental AS T4 ON T3.inventory_id = T4.inventory_id GROUP BY T1.actor_id
  - metric_name: "Actor Rank by Rental Count"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY rental_count DESC)
  - metric_name: "Percentage of Customers Renting from Top 5 Actors"
    sql_logic: |
      WITH ActorRentalCounts AS (SELECT T1.actor_id, T1.first_name, T1.last_name, COUNT(T4.rental_id) AS rental_count FROM actor AS T1 INNER JOIN film_actor AS T2 ON T1.actor_id = T2.actor_id INNER JOIN inventory AS T3 ON T2.film_id = T3.film_id INNER JOIN rental AS T4 ON T3.inventory_id = T4.inventory_id GROUP BY T1.actor_id, T1.first_name, T1.last_name), Top5Actors AS (SELECT actor_id FROM (SELECT actor_id, DENSE_RANK() OVER (ORDER BY rental_count DESC) AS actor_rank FROM ActorRentalCounts) WHERE actor_rank <= 5), CustomersRentingFromTopActors AS (SELECT DISTINCT T4.customer_id FROM Top5Actors AS T1 INNER JOIN film_actor AS T2 ON T1.actor_id = T2.actor_id INNER JOIN inventory AS T3 ON T2.film_id = T3.film_id INNER JOIN rental AS T4 ON T3.inventory_id = T4.inventory_id), TotalCustomerCount AS (SELECT COUNT(DISTINCT customer_id) AS total_customers FROM customer) SELECT CAST(COUNT(T1.customer_id) AS REAL) * 100 / T2.total_customers FROM CustomersRentingFromTopActors AS T1, TotalCustomerCount AS T2
  - metric_name: "subsequent_rentals_per_customer"
    sql_logic: |
      COUNT(rental.rental_id) - 1, calculated per customer after their first rental.
  - metric_name: "average_number_of_subsequent_rentals"
    sql_logic: |
      AVG(COUNT(rental.rental_id) - 1)
  - metric_name: "customer_rank_by_total_payment"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY SUM(amount) DESC)
  - metric_name: "payment_month"
    sql_logic: |
      STRFTIME('%Y-%m-01', payment_date)
  - metric_name: "format_month_yyyy_mm"
    sql_logic: |
      STRFTIME('%Y-%m', payment_month)
  - metric_name: "monthly_customer_payment"
    sql_logic: |
      SELECT customer_id, STRFTIME('%Y-%m', payment_date) AS payment_month, SUM(amount) AS total_monthly_payment FROM payment GROUP BY customer_id, payment_month
  - metric_name: "Monthly Store Rentals"
    sql_logic: |
      SELECT T2.store_id, STRFTIME('%Y', T1.rental_date) AS rental_year, STRFTIME('%m', T1.rental_date) AS rental_month, COUNT(T1.rental_id) AS total_rentals FROM rental AS T1 INNER JOIN staff AS T2 ON T1.staff_id = T2.staff_id GROUP BY T2.store_id, rental_year, rental_month
  - metric_name: "month_over_month_payment_difference"
    sql_logic: |
      ABS(total_monthly_payment - LAG(total_monthly_payment, 1, 0) OVER (PARTITION BY customer_id ORDER BY payment_month))
  - metric_name: "Total Customer Count"
    sql_logic: |
      SELECT COUNT(DISTINCT customer_id) FROM customer
  - metric_name: "Customer Total Rentals"
    sql_logic: |
      COUNT(rental.rental_id)
  - metric_name: "max_month_over_month_difference"
    sql_logic: |
      MAX(ABS(monthly_total_payment - LAG(monthly_total_payment, 1, 0) OVER (PARTITION BY customer_id ORDER BY payment_month)))
  - metric_name: "monthly_total_payment"