```yaml
descriptions:
  - table: "cleaned_weekly_sales"
    column: "week_date"
    meaning: |
      The primary date for sales analysis. Sales are often analyzed in distinct periods around a key date (e.g., June 15th), such as a 4-week or 84-day 'before'/'after' window.
  - table: "cleaned_weekly_sales"
    column: "(derived) period"
    meaning: |
      A derived categorical column to label sales weeks relative to an event, such as the week of June 15th. 'Before' represents the 4-week period leading up to the event week (`week_number BETWEEN mid_june_week - 4 AND mid_june_week - 1`), and 'After' represents the 4-week period following it (`week_number BETWEEN mid_june_week + 1 AND mid_june_week + 4`).
  - table: "customer_transactions"
    column: "txn_type"
    meaning: |
      Defines the transaction's effect on balance. 'deposit' is a credit (adds to balance). 'withdrawal' and 'purchase' are debits (subtract from balance). Depending on the analysis, other transaction types may be treated as neutral (0 change) or grouped with debits.
  - table: "shopping_cart_events"
    column: "event_type"
    meaning: |
      Defines the user action: 1 for a product view, 2 for an 'add to cart' event, and 3 for a purchase event. A visit with an event_type of 3 is considered a 'purchase visit'.
  - table: "shopping_cart_page_hierarchy"
    column: "page_id"
    meaning: |
      Page IDs 1, 2, 12, and 13 are excluded from product analysis as they represent non-product pages.
  - table: "shopping_cart_page_hierarchy"
    column: "product_id"
    meaning: |
      A non-null value indicates the page is a product-specific page.
  - table: "interest_metrics"
    column: "month_year"
    meaning: |
      Date stored as a 'MM/YYYY' text string. Convert to a standard date using `DATE(SUBSTR(month_year, 4, 4) || '-' || SUBSTR(month_year, 1, 2) || '-01')`.
  - table: "interest_metrics"
    column: "_year, _month"
    meaning: |
      These columns can be combined to form a standard month date using the logic: `DATE(CAST(_year AS INTEGER) || '-' || printf('%02d', CAST(_month AS INTEGER)) || '-01')`.
  - table: "bitcoin_prices"
    column: "market_date"
    meaning: |
      Date of market data stored as a string in 'DD-MM-YYYY' format. Corresponds to `txn_date` in `bitcoin_transactions`.
  - table: "bitcoin_prices"
    column: "volume"
    meaning: |
      A string representing trade volume. A value of '-' means 0. A 'K' suffix denotes thousands (x1000), and an 'M' suffix denotes millions (x1000000).
  - table: "bitcoin_transactions"
    column: "txn_type"
    meaning: |
      A value of 'BUY' indicates a purchase transaction.
  - table: "bitcoin_transactions"
    column: "ticker"
    meaning: |
      A value of 'BTC' represents the Bitcoin cryptocurrency.
  - table: "bitcoin_transactions"
    column: "txn_date"
    meaning: |
      The date of the transaction, stored as a string in 'DD-MM-YYYY' format. The year can be extracted using `CAST(SUBSTR(txn_date, 7, 4) AS INTEGER)`.
relations:
  - table_1: "cleaned_weekly_sales"
    column_1: "calendar_year"
    table_2: "cleaned_weekly_sales"
    column_2: "calendar_year"
    meaning: |
      Implicit self-join via CTEs to align weekly sales data with a calculated event date (e.g., June 15th) for the same year.
  - table_1: "interest_metrics"
    column_1: "interest_id"
    table_2: "interest_map"
    column_2: "id"
  - table_1: "bitcoin_transactions"
    column_1: "member_id"
    table_2: "bitcoin_members"
    column_2: "member_id"
  - table_1: "bitcoin_transactions"
    column_1: '["ticker", "txn_date"]'
    table_2: "bitcoin_prices"
    column_2: '["ticker", "market_date"]'
    meaning: |
      A transaction's value is determined by joining on both the asset ticker and the specific date of the transaction to find the corresponding daily price. This represents a composite key relationship.
  - table_1: "shopping_cart_events"
    column_1: "visit_id"
    table_2: "shopping_cart_events"
    column_2: "visit_id"
    meaning: |
      A self-join on visit_id is used to check for the presence of an event with event_type = 3 to determine if the entire visit resulted in a purchase.
synonyms:
  - nl_term: "sales attribute"
    db_target: "region, platform, age_band, demographic, customer_type"
    type: "column"
