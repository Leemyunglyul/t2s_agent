    type: "condition"
  - nl_term: "highest negative impact"
    db_target: "ORDER BY avg_percentage_change_for_type ASC LIMIT 1"
    type: "condition"
biz_logic:
  - metric_name: "Net Transaction Amount (Row-level)"
    sql_logic: |
      CASE WHEN txn_type = 'deposit' THEN txn_amount WHEN txn_type IN ('withdrawal', 'purchase') THEN -txn_amount ELSE 0 END
  - metric_name: "Daily Net Transaction Amount"
    sql_logic: |
      SUM(CASE WHEN txn_type = 'deposit' THEN txn_amount WHEN txn_type IN ('withdrawal', 'purchase') THEN -txn_amount ELSE 0 END)
  - metric_name: "Monthly Net Change"
    sql_logic: |
      SUM(CASE WHEN txn_type = 'deposit' THEN txn_amount WHEN txn_type IN ('withdrawal', 'purchase') THEN -txn_amount ELSE 0 END)
  - metric_name: "Daily Cumulative Balance"
    sql_logic: |
      SUM(daily_net_change) OVER (PARTITION BY customer_id ORDER BY date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - metric_name: "Monthly Cumulative Bank Balance"
    sql_logic: |
      SUM(monthly_net_change) OVER (PARTITION BY customer_id ORDER BY month)
  - metric_name: "Customer Balance at Start of Month"
    sql_logic: |
      COALESCE(SUM(monthly_net_change) OVER (PARTITION BY customer_id ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0)
  - metric_name: "Total Positive Balance at Start of Month"
    sql_logic: |
      SUM(MAX(0, balance_at_month_start))
  - metric_name: "Time Series Scaffolding Pattern"
    sql_logic: |
      A technique to handle sparse time-series data. Create a complete grid of entities (e.g., customers) and time periods (e.g., months) using a CROSS JOIN between distinct entities and a generated time series. Then, LEFT JOIN the actual data onto this grid, using COALESCE(value, 0) to fill gaps. This ensures calculations like averages and running totals are performed over the complete set of entities and time periods, preventing gaps in the data.
  - metric_name: "Time Series Generation (Recursive)"
    sql_logic: |
      WITH RECURSIVE all_months AS (SELECT STRFTIME('%Y-%m-01', MIN(txn_date)) AS month FROM customer_transactions UNION ALL SELECT STRFTIME('%Y-%m-01', DATE(month, '+1 month')) FROM all_months WHERE month < (SELECT STRFTIME('%Y-%m-01', MAX(txn_date)) FROM customer_transactions)) SELECT month FROM all_months
  - metric_name: "Per-Customer Date Series Generation (Recursive)"
    sql_logic: |
      WITH RECURSIVE DateSeriesPerCustomer(customer_id, date, max_txn_date) AS (SELECT customer_id, MIN(txn_date), MAX(txn_date) FROM customer_transactions GROUP BY customer_id UNION ALL SELECT customer_id, DATE(date, '+1 day'), max_txn_date FROM DateSeriesPerCustomer WHERE date < max_txn_date)
  - metric_name: "Daily Activity with Zero-Filled Gaps"
    sql_logic: |
      SELECT dsc.customer_id, dsc.date, COALESCE(dnt.net_change, 0) AS daily_net_change FROM DateSeriesPerCustomer AS dsc LEFT JOIN DailyNetTransactions AS dnt ON dsc.customer_id = dnt.customer_id AND dsc.date = dnt.txn_date
