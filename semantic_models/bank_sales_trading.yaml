```yaml
descriptions:
  - table: "cleaned_weekly_sales"
    column: "week_date"
    meaning: |
      The primary date for sales analysis. Sales are often analyzed in distinct periods around a key date (e.g., June 15th), such as an 84-day or a 4-week 'before'/'after' window.
  - table: "cleaned_weekly_sales"
    column: "(derived) period"
    meaning: |
      A derived categorical column to label sales weeks relative to an event. 'Before' represents the 4-week period leading up to the event week, and 'After' represents the 4-week period following it.
  - table: "customer_transactions"
    column: "txn_type"
    meaning: |
      Defines the transaction's effect on balance. 'deposit' is a credit (adds to balance). 'withdrawal' and 'purchase' are debits (subtract from balance). Other types may be treated as neutral (0 change) or as debits depending on the specific analysis.
  - table: "shopping_cart_events"
    column: "event_type"
    meaning: |
      Defines the user action: 1 for a product view, 2 for an 'add to cart' event, and 3 for a purchase event.
  - table: "shopping_cart_page_hierarchy"
    column: "page_id"
    meaning: |
      Page IDs 1, 2, 12, and 13 are excluded from product analysis as they represent non-product pages.
  - table: "shopping_cart_page_hierarchy"
    column: "product_id"
    meaning: |
      A non-null value indicates the page is a product-specific page.
  - table: "interest_metrics"
    column: "month_year"
    meaning: |
      Date stored as a 'MM/YYYY' text string. Convert to a standard date using `DATE(SUBSTR(month_year, 4, 4) || '-' || SUBSTR(month_year, 1, 2) || '-01')`.
  - table: "bitcoin_prices"
    column: "market_date"
    meaning: |
      Date of market data stored as a string in 'DD-MM-YYYY' format. Corresponds to `txn_date` in `bitcoin_transactions`.
  - table: "bitcoin_prices"
    column: "volume"
    meaning: |
      A string representing trade volume. A value of '-' means 0. A 'K' suffix denotes thousands (x1000), and an 'M' suffix denotes millions (x1000000).
  - table: "bitcoin_transactions"
    column: "txn_type"
    meaning: |
      A value of 'BUY' indicates a purchase transaction.
  - table: "bitcoin_transactions"
    column: "ticker"
    meaning: |
      A value of 'BTC' represents the Bitcoin cryptocurrency.
  - table: "bitcoin_transactions"
    column: "txn_date"
    meaning: |
      The date of the transaction, stored as a string in 'DD-MM-YYYY' format. The year can be extracted using `CAST(SUBSTR(txn_date, 7, 4) AS INTEGER)`.
relations:
  - table_1: "cleaned_weekly_sales"
    column_1: "calendar_year"
    table_2: "cleaned_weekly_sales"
    column_2: "calendar_year"
    meaning: |
      Implicit self-join via CTEs to align weekly sales data with a calculated event date (e.g., June 15th) for the same year.
  - table_1: "interest_metrics"
    column_1: "interest_id"
    table_2: "interest_map"
    column_2: "id"
  - table_1: "bitcoin_transactions"
    column_1: "member_id"
    table_2: "bitcoin_members"
    column_2: "member_id"
  - table_1: "bitcoin_transactions"
    column_1: '["ticker", "txn_date"]'
    table_2: "bitcoin_prices"
    column_2: '["ticker", "market_date"]'
    meaning: |
      A transaction's value is determined by joining on both the asset ticker and the specific date of the transaction to find the corresponding daily price. This represents a composite key relationship.
synonyms:
  - nl_term: "sales attribute"
    db_target: "region, platform, age_band, demographic, customer_type"
    type: "column"
  - nl_term: "before period"
    db_target: "week_date >= DATE('2020-06-15', '-84 days') AND week_date < '2020-06-15'"
    type: "condition"
  - nl_term: "after period"
    db_target: "week_date >= '2020-06-15' AND week_date < DATE('2020-06-15', '+84 days')"
    type: "condition"
  - nl_term: "4 weeks before"
    db_target: "period = 'Before'"
    type: "condition"
  - nl_term: "4 weeks after"
    db_target: "period = 'After'"
    type: "condition"
  - nl_term: "mid-June week"
    db_target: "(calendar_year || '-06-15') BETWEEN week_date AND date(week_date, '+6 days')"
    type: "condition"
  - nl_term: "highest negative impact"
    db_target: "ORDER BY avg_percentage_change ASC LIMIT 1"
    type: "condition"
  - nl_term: "product view"
    db_target: "shopping_cart_events.event_type = 1"
    type: "condition"
  - nl_term: "cart add"
    db_target: "shopping_cart_events.event_type = 2"
    type: "condition"
  - nl_term: "purchase event"
    db_target: "shopping_cart_events.event_type = 3"
    type: "condition"
  - nl_term: "top 10"
    db_target: "DENSE_RANK() OVER (ORDER BY composition DESC) <= 10"
    type: "condition"
  - nl_term: "bottom 10"
    db_target: "DENSE_RANK() OVER (ORDER BY composition ASC) <= 10"
    type: "condition"
  - nl_term: "peak"
    db_target: "ROW_NUMBER() OVER (PARTITION BY interest_id ORDER BY composition DESC) = 1"
    type: "condition"
  - nl_term: "top monthly interest"
    db_target: "DENSE_RANK() OVER (PARTITION BY SUBSTR(month_year, 4, 4) || '-' || SUBSTR(month_year, 1, 2) || '-01' ORDER BY composition * 1.0 / NULLIF(index_value, 0) DESC) = 1"
    type: "condition"
  - nl_term: "buy transaction"
    db_target: "bitcoin_transactions.txn_type = 'BUY'"
    type: "condition"
  - nl_term: "month"
    db_target: "strftime('%Y-%m-01', txn_date)"
    type: "column"
  - nl_term: "percentage change"
    db_target: "percentage_change"
    type: "column"
  - nl_term: "before sales"
    db_target: "before_sales"
    type: "column"
  - nl_term: "after sales"
    db_target: "after_sales"
    type: "column"
  - nl_term: "closing balance, monthly cumulative bank balance, running total"
    db_target: "monthly_closing_balance"
    type: "column"
  - nl_term: "monthly change, net monthly amount"
    db_target: "monthly_net_change"
    type: "column"
  - nl_term: "previous month total balance"
    db_target: "Total Positive Balance at Start of Month"
    type: "biz_logic"
  - nl_term: "product views"
    db_target: "product_views"
    type: "column"
  - nl_term: "times added to cart"
    db_target: "times_added_to_cart"
    type: "column"
  - nl_term: "actual purchases"
    db_target: "actual_purchases"
    type: "column"
  - nl_term: "left in cart"
    db_target: "left_in_cart"
    type: "column"
biz_logic:
  - metric_name: "Time Series Scaffolding"
    sql_logic: |
      A technique to handle sparse time-series data. It involves creating a complete grid of entities (e.g., customers) and time periods (e.g., months), often via a CROSS JOIN or a recursive CTE for dates. Actual data is then LEFT JOINed onto this grid, and COALESCE is used to replace NULLs with a default value (e.g., 0). This ensures calculations like averages and running totals are accurate over the complete set of entities.
  - metric_name: "Unpivot Sales Attributes"
    sql_logic: |
      A technique to transform columns (e.g., region, platform, age_band) into rows with an 'attribute_type' and 'attribute_value', typically using UNION ALL.
  - metric_name: "Net Transaction Amount"
    sql_logic: |
      CASE WHEN txn_type = 'deposit' THEN txn_amount WHEN txn_type IN ('withdrawal', 'purchase') THEN -txn_amount ELSE 0 END
  - metric_name: "Monthly Net Change"
    sql_logic: |
      SUM(CASE WHEN txn_type = 'deposit' THEN txn_amount WHEN txn_type IN ('withdrawal', 'purchase') THEN -txn_amount ELSE 0 END)
  - metric_name: "Monthly Closing Balance"
    sql_logic: |
      SUM(monthly_net_change) OVER (PARTITION BY customer_id ORDER BY month)
  - metric_name: "Adjusted Daily Balance (non-negative)"
    sql_logic: |
      MAX(0, daily_balance)
  - metric_name: "Customer Balance at Start of Month"
    sql_logic: |
      COALESCE(SUM(monthly_net_change) OVER (PARTITION BY customer_id ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0)
  - metric_name: "avg_monthly_balance_all_customers"
    sql_logic: |
      AVG(monthly_balance) -- This metric is accurate only when calculated on scaffolded data where all customers are represented for every month, with non-transacting months having a balance of 0.
  - metric_name: "Sales Before Period (84 days)"
    sql_logic: |
      SUM(CASE WHEN week_date >= DATE('2020-06-15', '-84 days') AND week_date < '2020-06-15' THEN sales ELSE 0 END)
  - metric_name: "Sales After Period (84 days)"
    sql_logic: |
      SUM(CASE WHEN week_date >= '2020-06-15' AND week_date < DATE('2020-06-15', '+84 days') THEN sales ELSE 0 END)
  - metric_name: "before_sales_total (4 weeks)"
    sql_logic: |
      SUM(CASE WHEN period = 'Before' THEN sales ELSE 0 END)
  - metric_name: "after_sales_total (4 weeks)"
    sql_logic: |
      SUM(CASE WHEN period = 'After' THEN sales ELSE 0 END)
  - metric_name: "percentage_change_after_vs_before"
    sql_logic: |
      (CAST(after_sales AS REAL) - before_sales) * 100.0 / NULLIF(before_sales, 0)
  - metric_name: "Valid Product Event Filter"
    sql_logic: |
      page_id NOT IN (1, 2, 12, 13) AND product_id IS NOT NULL
  - metric_name: "Times Added To Cart"
    sql_logic: |
      COUNT(CASE WHEN event_type = 2 THEN 1 END)
  - metric_name: "Actual Purchases"
    sql_logic: |
      The count of 'add to cart' events (event_type = 2) for products within visits that also contained a purchase event (event_type = 3).
  - metric_name: "Left In Cart"
    sql_logic: |
      times_added_to_cart - COALESCE(actual_purchases, 0)
  - metric_name: "Loss Rate Category"
    sql_logic: |
      CASE WHEN "loss_rate_%" < (avg_loss_rate - std_dev_loss_rate) THEN 'Below 1 Std Dev' WHEN "loss_rate_%" > (avg_loss_rate + std_dev_loss_rate) THEN 'Above 1 Std Dev' ELSE 'Within 1 Std Dev' END
  - metric_name: "Sample Standard Deviation of Loss Rate"
    sql_logic: |
      CASE WHEN COUNT("loss_rate_%") <= 1 THEN 0.0 ELSE SQRT(SUM(("loss_rate_%" - avg_loss_rate) * ("loss_rate_%" - avg_loss_rate)) / (COUNT("loss_rate_%") - 1.0)) END
  - metric_name: "Parsed Volume"
    sql_logic: |
      CASE WHEN volume = '-' THEN 0.0 WHEN SUBSTR(volume, -1, 1) = 'K' THEN CAST(REPLACE(volume, 'K', '') AS REAL) * 1000.0 WHEN SUBSTR(volume, -1, 1) = 'M' THEN CAST(REPLACE(volume, 'M', '') AS REAL) * 1000000.0 ELSE CAST(volume AS REAL) END
  - metric_name: "Previous Day Non-Zero Volume"
    sql_logic: |
      (SELECT prev_fd.numeric_volume FROM FormattedData AS prev_fd WHERE prev_fd.ticker = fd.ticker AND prev_fd.formatted_date < fd.formatted_date AND prev_fd.numeric_volume > 0 ORDER BY prev_fd.formatted_date DESC LIMIT 1)
  - metric_name: "Average Purchase Price"
    sql_logic: |
      SUM(bt.quantity * bp.price) * 1.0 / NULLIF(SUM(bt.quantity), 0)
  - metric_name: "Previous Year's Average Price"
    sql_logic: |
      LAG(avg_purchase_price) OVER (PARTITION BY region ORDER BY txn_year)
  - metric_name: "Annual Percentage Change in Average Purchase Price"