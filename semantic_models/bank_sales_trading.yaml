    type: "condition"
  - nl_term: "after period"
    db_target: "week_date >= '2020-06-15' AND week_date < DATE('2020-06-15', '+84 days')"
    type: "condition"
  - nl_term: "4 weeks before"
    db_target: "period = 'Before'"
    type: "condition"
  - nl_term: "4 weeks after"
    db_target: "period = 'After'"
    type: "condition"
  - nl_term: "mid-June week"
    db_target: "(calendar_year || '-06-15') BETWEEN week_date AND date(week_date, '+6 days')"
    type: "condition"
  - nl_term: "percentage change"
    db_target: "percentage_change"
    type: "column"
  - nl_term: "before sales"
    db_target: "before_sales"
    type: "column"
  - nl_term: "after sales"
    db_target: "after_sales"
    type: "column"
  - nl_term: "top 10"
    db_target: "DENSE_RANK() OVER (ORDER BY composition DESC) <= 10"
    type: "condition"
  - nl_term: "bottom 10"
    db_target: "DENSE_RANK() OVER (ORDER BY composition ASC) <= 10"
    type: "condition"
  - nl_term: "peak"
    db_target: "ROW_NUMBER() OVER (PARTITION BY interest_id ORDER BY composition DESC, month_year ASC) = 1"
