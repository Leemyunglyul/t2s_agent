descriptions:
  - table: "ratings"
    column: "avg_rating"
    meaning: |
      A value greater than 8 indicates a 'High-Rated Movie'.
relations: []
synonyms:
  - nl_term: "high-rated movies"
    db_target: "ratings.avg_rating > 8"
    type: "condition"
biz_logic:
  - metric_name: "High-Rated Movie Count by Director"
    sql_logic: |
      SELECT T3.name, COUNT(DISTINCT T1.movie_id) FROM ratings AS T1 JOIN director_mapping AS T2 ON T1.movie_id = T2.movie_id JOIN names AS T3 ON T2.name_id = T3.id WHERE T1.avg_rating > 8 GROUP BY T3.name
  - metric_name: "High-Rated Movie Count by Genre"
    sql_logic: |
      SELECT T2.genre, COUNT(DISTINCT T1.movie_id) FROM ratings AS T1 JOIN genre AS T2 ON T1.movie_id = T2.movie_id WHERE T1.avg_rating > 8 GROUP BY T2.genre
  - metric_name: "Top Directors of High-Rated Movies in Top Genres"
    sql_logic: |
      WITH CTE_HighRatedMovies AS (
        SELECT
          movie_id
        FROM ratings
        WHERE
          avg_rating > 8
      ), CTE_GenreMovieCounts AS (
        SELECT
          T2.genre,
          COUNT(DISTINCT T1.movie_id) AS movie_count
        FROM CTE_HighRatedMovies AS T1
        INNER JOIN genre AS T2
          ON T1.movie_id = T2.movie_id
        GROUP BY
          T2.genre
      ), CTE_Top3Genres AS (
        SELECT
          genre
        FROM CTE_GenreMovieCounts
        ORDER BY
          movie_count DESC
        LIMIT 3
      ), CTE_HighRatedMoviesInTopGenres AS (
        SELECT
          T1.movie_id,
          T2.genre
        FROM CTE_HighRatedMovies AS T1
        INNER JOIN genre AS T2
          ON T1.movie_id = T2.movie_id
        WHERE
          T2.genre IN (
            SELECT
              genre
            FROM CTE_Top3Genres
          )
      ), CTE_DirectorMovieCounts AS (
        SELECT
          T3.name,
          COUNT(DISTINCT T1.movie_id) AS movie_count
        FROM CTE_HighRatedMoviesInTopGenres AS T1
        INNER JOIN director_mapping AS T2
          ON T1.movie_id = T2.movie_id
        INNER JOIN names AS T3
          ON T2.name_id = T3.id
        GROUP BY
          T3.name
      )
      SELECT
        name,
        movie_count
      FROM CTE_DirectorMovieCounts
      ORDER BY
        movie_count DESC
      LIMIT 4;