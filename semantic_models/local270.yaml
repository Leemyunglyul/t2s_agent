descriptions:
- table: packaging
  column: null
  meaning: Represents items that can be part of a packaging hierarchy, acting as either
    containers or contents.
- table: packaging_relations
  column: packaging_id
  meaning: The ID of the packaging item that acts as a container.
- table: packaging_relations
  column: contains_id
  meaning: The ID of the packaging item that is contained within another.
relations: []
synonyms:
- nl_term: container name
  db_target: packaging.name
  type: column
- nl_term: item name
  db_target: packaging.name
  type: column
- nl_term: container
  db_target: packaging
  type: table
- nl_term: item
  db_target: packaging
  type: table
- nl_term: top-level container
  db_target: SELECT id FROM packaging WHERE id NOT IN (SELECT contains_id FROM packaging_relations)
  type: condition
- nl_term: base item
  db_target: SELECT id FROM packaging WHERE id NOT IN (SELECT packaging_id FROM packaging_relations)
  type: condition
biz_logic:
- metric_name: Total Accumulated Item Quantity in Packaging Hierarchy
  sql_logic: "WITH RECURSIVE TopLevelContainers AS (\n  SELECT id\n  FROM packaging\n\
    \  WHERE id NOT IN (SELECT contains_id FROM packaging_relations)\n),\nPackagingHierarchy\
    \ AS (\n  SELECT\n    T.id AS top_level_id,\n    T.id AS current_item_id,\n  \
    \  1 AS accumulated_qty\n  FROM TopLevelContainers AS T\n  UNION ALL\n  SELECT\n\
    \    ph.top_level_id,\n    pr.contains_id AS current_item_id,\n    ph.accumulated_qty\
    \ * pr.qty AS accumulated_qty\n  FROM PackagingHierarchy AS ph\n  JOIN packaging_relations\
    \ AS pr\n    ON ph.current_item_id = pr.packaging_id\n),\nTotalQuantities AS (\n\
    \  SELECT\n    top_level_id,\n    current_item_id,\n    SUM(accumulated_qty) AS\
    \ total_accumulated_qty\n  FROM PackagingHierarchy\n  GROUP BY\n    top_level_id,\n\
    \    current_item_id\n)"
