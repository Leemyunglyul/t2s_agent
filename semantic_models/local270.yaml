descriptions:
- table: packaging
  column: null
  meaning: Represents items that can be part of a packaging hierarchy, acting as either
    containers or contents.
- table: packaging_relations
  column: packaging_id
  meaning: The ID of the packaging item that acts as a container.
- table: packaging_relations
  column: contains_id
  meaning: The ID of the packaging item that is contained within another.
- table: packaging
  column: id
  meaning: An item is a 'top-level container' if its ID does not appear in the 'packaging_relations.contains_id'
    column.
- table: packaging
  column: id
  meaning: An item is a 'base item' (i.e., not a container) if its ID does not appear
    in the 'packaging_relations.packaging_id' column.
relations: []
synonyms:
- nl_term: container name
  db_target: packaging.name
  type: column
- nl_term: item name
  db_target: packaging.name
  type: column
- nl_term: container
  db_target: packaging
  type: table
- nl_term: item
  db_target: packaging
  type: table
- nl_term: top-level container
  db_target: p.id FROM packaging AS p LEFT JOIN packaging_relations AS pr ON p.id
    = pr.contains_id WHERE pr.contains_id IS NULL
  type: condition
- nl_term: base item
  db_target: p.id FROM packaging AS p LEFT JOIN packaging_relations AS pr ON p.id
    = pr.packaging_id WHERE pr.packaging_id IS NULL
  type: condition
biz_logic:
- metric_name: Total Accumulated Base Item Quantity per Top-Level Container
  sql_logic: "WITH RECURSIVE TopLevelContainers AS (\n    SELECT p.id\n    FROM packaging\
    \ AS p\n    LEFT JOIN packaging_relations AS pr ON p.id = pr.contains_id\n   \
    \ WHERE pr.contains_id IS NULL\n),\nBaseItems AS (\n    SELECT p.id\n    FROM\
    \ packaging AS p\n    LEFT JOIN packaging_relations AS pr ON p.id = pr.packaging_id\n\
    \    WHERE pr.packaging_id IS NULL\n),\nPackagingHierarchy AS (\n    SELECT\n\
    \        tlc.id AS top_level_id,\n        tlc.id AS current_item_id,\n       \
    \ 1 AS accumulated_qty\n    FROM TopLevelContainers AS tlc\n\n    UNION ALL\n\n\
    \    SELECT\n        ph.top_level_id,\n        pr.contains_id AS current_item_id,\n\
    \        ph.accumulated_qty * pr.qty AS accumulated_qty\n    FROM PackagingHierarchy\
    \ AS ph\n    INNER JOIN packaging_relations AS pr ON ph.current_item_id = pr.packaging_id\n\
    ),\nAccumulatedBaseItemQuantities AS (\n    SELECT\n        ph.top_level_id,\n\
    \        ph.current_item_id AS base_item_id,\n        SUM(ph.accumulated_qty)\
    \ AS total_accumulated_qty\n    FROM PackagingHierarchy AS ph\n    INNER JOIN\
    \ BaseItems AS bi ON ph.current_item_id = bi.id\n    GROUP BY ph.top_level_id,\
    \ ph.current_item_id\n)"
