descriptions:
- table: pizza_clean_runner_orders
  column: cancellation
  meaning: A NULL value in this column indicates that the order was successful and
    not cancelled.
- table: pizza_names
  column: pizza_name
  meaning: The price for a 'Meatlovers' pizza is 12.
- table: pizza_names
  column: pizza_name
  meaning: The price for a 'Vegetarian' pizza is 10.
- table: pizza_get_extras
  column: extras_count
  meaning: This column represents the total revenue from extras for an order, implying
    each extra costs $1.
relations: []
synonyms:
- nl_term: total earnings
  db_target: total_earnings
  type: column
- nl_term: successful orders
  db_target: pizza_clean_runner_orders WHERE cancellation IS NULL
  type: condition
biz_logic:
- metric_name: Base Pizza Revenue
  sql_logic: SUM(CASE WHEN pn.pizza_name = 'Meatlovers' THEN 12 WHEN pn.pizza_name
    = 'Vegetarian' THEN 10 ELSE 0 END)
- metric_name: Extras Revenue
  sql_logic: SUM(extras_count)
- metric_name: Total Earnings
  sql_logic: The sum of revenue for all successful orders. An order's revenue is the
    sum of its base pizza revenue and its extras revenue. Successful orders are those
    where pizza_clean_runner_orders.cancellation IS NULL.
