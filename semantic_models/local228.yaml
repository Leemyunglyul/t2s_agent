descriptions:
- table: wicket_taken
  column: kind_out
  meaning: Dismissals of type 'run out', 'hit wicket', or 'retired hurt' are not credited
    to the bowler.
relations:
- table_1: ball_by_ball
  column_1: match_id, over_id, ball_id, innings_no
  table_2: batsman_scored
  column_2: match_id, over_id, ball_id, innings_no
- table_1: ball_by_ball
  column_1: match_id, over_id, ball_id, innings_no
  table_2: wicket_taken
  column_2: match_id, over_id, ball_id, innings_no
synonyms:
- nl_term: batsman
  db_target: ball_by_ball.striker
  type: column
- nl_term: bowler
  db_target: ball_by_ball.bowler
  type: column
- nl_term: top 3
  db_target: ROW_NUMBER() OVER (...) <= 3
  type: condition
biz_logic:
- metric_name: Total Runs by Player per Season
  sql_logic: SELECT m.season_id, bbb.striker AS player_id, SUM(bs.runs_scored) AS
    total_runs FROM match AS m INNER JOIN ball_by_ball AS bbb ON m.match_id = bbb.match_id
    INNER JOIN batsman_scored AS bs ON bbb.match_id = bs.match_id AND bbb.over_id
    = bs.over_id AND bbb.ball_id = bs.ball_id AND bbb.innings_no = bs.innings_no GROUP
    BY m.season_id, bbb.striker
- metric_name: Total Wickets by Player per Season
  sql_logic: SELECT m.season_id, bbb.bowler AS player_id, COUNT(wt.player_out) AS
    total_wickets FROM match AS m INNER JOIN ball_by_ball AS bbb ON m.match_id = bbb.match_id
    INNER JOIN wicket_taken AS wt ON bbb.match_id = wt.match_id AND bbb.over_id =
    wt.over_id AND bbb.ball_id = wt.ball_id AND bbb.innings_no = wt.innings_no WHERE
    wt.kind_out NOT IN ('run out', 'hit wicket', 'retired hurt') GROUP BY m.season_id,
    bbb.bowler
- metric_name: Batsman Rank by Season
  sql_logic: ROW_NUMBER() OVER (PARTITION BY season_id ORDER BY total_runs DESC, player_id
    ASC)
- metric_name: Bowler Rank by Season
  sql_logic: ROW_NUMBER() OVER (PARTITION BY season_id ORDER BY total_wickets DESC,
    player_id ASC)
