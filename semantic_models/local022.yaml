synonyms:
- nl_term: century
  db_target: SUM(bs.runs_scored) >= 100
  type: condition
- nl_term: players
  db_target: player.player_name
  type: column
- nl_term: player who scored
  db_target: ball_by_ball.striker
  type: column
- nl_term: their team lost the match
  db_target: player_match.team_id = (CASE WHEN match.match_winner = match.team_1 THEN
    match.team_2 ELSE match.team_1 END)
  type: condition
biz_logic:
- metric_name: Losing Team Identification
  sql_logic: SELECT match_id, CASE WHEN match_winner = team_1 THEN team_2 ELSE team_1
    END AS losing_team_id FROM match WHERE match_winner IS NOT NULL
- metric_name: Player Total Runs in Match
  sql_logic: SELECT bb.match_id, bb.striker AS player_id, SUM(bs.runs_scored) AS total_runs
    FROM ball_by_ball AS bb JOIN batsman_scored AS bs ON bb.match_id = bs.match_id
    AND bb.over_id = bs.over_id AND bb.ball_id = bs.ball_id AND bb.innings_no = bs.innings_no
    GROUP BY bb.match_id, bb.striker
