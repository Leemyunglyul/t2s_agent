descriptions: []
relations:
- table_1: ball_by_ball
  column_1:
  - match_id
  - over_id
  - ball_id
  - innings_no
  table_2: batsman_scored
  column_2:
  - match_id
  - over_id
  - ball_id
  - innings_no
- table_1: ball_by_ball
  column_1:
  - match_id
  - striker
  table_2: player_match
  column_2:
  - match_id
  - player_id
synonyms:
- nl_term: players
  db_target: player.player_name
  type: column
- nl_term: player who scored
  db_target: ball_by_ball.striker
  type: column
- nl_term: centurion
  db_target: SUM(batsman_scored.runs_scored) >= 100
  type: condition
- nl_term: losing cause
  db_target: player_match.team_id != match.match_winner
  type: condition
biz_logic:
- metric_name: Losing Team Identification
  sql_logic: SELECT match_id, CASE WHEN match_winner = team_1 THEN team_2 ELSE team_1
    END AS losing_team_id FROM match WHERE match_winner IS NOT NULL
- metric_name: Player Total Runs in Match
  sql_logic: SELECT T1.match_id, T1.striker AS player_id, SUM(T2.runs_scored) AS total_runs
    FROM ball_by_ball AS T1 JOIN batsman_scored AS T2 ON T1.match_id = T2.match_id
    AND T1.over_id = T2.over_id AND T1.ball_id = T2.ball_id AND T1.innings_no = T2.innings_no
    GROUP BY T1.match_id, T1.striker
