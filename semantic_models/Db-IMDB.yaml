descriptions:
  - table: "M_Cast"
    column: "PID"
    meaning: |
      Foreign key to the Person table, identifying the person as an actor in the movie (MID).
  - table: "M_Director"
    column: "PID"
    meaning: |
      Foreign key to the Person table, identifying the person as a director of the movie (MID).
relations:
  - table_1: "M_Cast"
    column_1: "MID"
    table_2: "M_Director"
    column_2: "MID"
  - table_1: "M_Cast"
    column_1: "PID"
    table_2: "Person"
    column_2: "PID"
  - table_1: "M_Director"
    column_1: "PID"
    table_2: "Person"
    column_2: "PID"
synonyms:
  - nl_term: "actor"
    db_target: "M_Cast"
    type: "table"
  - nl_term: "director"
    db_target: "M_Director"
    type: "table"
  - nl_term: "Yash Chopra"
    db_target: "Person.Name = 'Yash Chopra'"
    type: "value"
  - nl_term: "worked with, collaborated with"
    db_target: "M_Cast.MID = M_Director.MID"
    type: "condition"
  - nl_term: "worked with a director more than any other single director"
    db_target: "YC.FilmCount > OM.MaxOtherFilmCount OR OM.MaxOtherFilmCount IS NULL"
    type: "condition"
biz_logic:
  - metric_name: "Actor-Director Film Count"
    sql_logic: |
      SELECT MC.PID AS ActorPID, MD.PID AS DirectorPID, COUNT(DISTINCT MC.MID) AS FilmCount FROM M_Cast AS MC JOIN M_Director AS MD ON MC.MID = MD.MID GROUP BY MC.PID, MD.PID
  - metric_name: "Actor's Max Film Count with Other Directors"
    sql_logic: |
      SELECT T.ActorPID, MAX(T.FilmCount) AS MaxOtherFilmCount FROM (SELECT MC.PID AS ActorPID, MD.PID AS DirectorPID, COUNT(DISTINCT MC.MID) AS FilmCount FROM M_Cast AS MC JOIN M_Director AS MD ON MC.MID = MD.MID WHERE MD.PID <> [Primary Director PID] GROUP BY MC.PID, MD.PID) AS T GROUP BY T.ActorPID