descriptions:
- table: bitcoin_transactions
  column: txn_type
  meaning: A value of 'BUY' indicates a purchase transaction.
- table: bitcoin_transactions
  column: ticker
  meaning: A value of 'BTC' represents the Bitcoin cryptocurrency.
- table: bitcoin_transactions
  column: txn_date
  meaning: The date of the transaction, stored as a string in 'DD-MM-YYYY' format.
    The year can be extracted using CAST(SUBSTR(txn_date, 7, 4) AS INTEGER).
- table: bitcoin_prices
  column: market_date
  meaning: The market date, stored as a string in 'DD-MM-YYYY' format. It corresponds
    to the txn_date in the bitcoin_transactions table.
relations:
- table_1: bitcoin_transactions
  column_1: member_id
  table_2: bitcoin_members
  column_2: member_id
- table_1: bitcoin_transactions
  column_1: '["ticker", "txn_date"]'
  table_2: bitcoin_prices
  column_2: '["ticker", "market_date"]'
synonyms:
- nl_term: buy transaction
  db_target: bitcoin_transactions.txn_type = 'BUY'
  type: condition
biz_logic:
- metric_name: Transaction Year
  sql_logic: CAST(SUBSTR(T1.txn_date, 7, 4) AS INTEGER)
- metric_name: Average Purchase Price
  sql_logic: SUM(T1.quantity * T3.price) * 1.0 / SUM(T1.quantity)
- metric_name: Previous Year's Average Price
  sql_logic: LAG(avg_purchase_price, 1) OVER (PARTITION BY region ORDER BY txn_year)
- metric_name: Region Rank by Average Purchase Price
  sql_logic: DENSE_RANK() OVER (PARTITION BY txn_year ORDER BY avg_purchase_price
    DESC)
- metric_name: Annual Percentage Change in Average Purchase Price
  sql_logic: CASE WHEN prev_year_avg_price IS NULL OR prev_year_avg_price = 0 THEN
    NULL ELSE (avg_purchase_price - prev_year_avg_price) * 100.0 / prev_year_avg_price
    END
- metric_name: Year Rank for Region
  sql_logic: DENSE_RANK() OVER (PARTITION BY region ORDER BY txn_year ASC)
