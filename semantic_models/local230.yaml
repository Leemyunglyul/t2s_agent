descriptions:
- table: ratings
  column: avg_rating
  meaning: A value greater than 8 indicates a 'High-Rated Movie'.
relations: []
synonyms:
- nl_term: high-rated movies
  db_target: ratings.avg_rating > 8
  type: condition
- nl_term: top genres
  db_target: genre IN (SELECT T2.genre FROM ratings AS T1 JOIN genre AS T2 ON T1.movie_id
    = T2.movie_id WHERE T1.avg_rating > 8 GROUP BY T2.genre ORDER BY COUNT(T1.movie_id)
    DESC LIMIT 3)
  type: condition
- nl_term: movie count
  db_target: COUNT(DISTINCT movie_id)
  type: column
biz_logic:
- metric_name: High-Rated Movie Count by Director
  sql_logic: SELECT T3.name, COUNT(DISTINCT T1.movie_id) FROM ratings AS T1 JOIN director_mapping
    AS T2 ON T1.movie_id = T2.movie_id JOIN names AS T3 ON T2.name_id = T3.id WHERE
    T1.avg_rating > 8 GROUP BY T3.name
- metric_name: High-Rated Movie Count by Genre
  sql_logic: SELECT T2.genre, COUNT(DISTINCT T1.movie_id) FROM ratings AS T1 JOIN
    genre AS T2 ON T1.movie_id = T2.movie_id WHERE T1.avg_rating > 8 GROUP BY T2.genre
- metric_name: Top Directors of High-Rated Movies in Top Genres
  sql_logic: WITH HighRatedMovies AS ( SELECT movie_id FROM ratings WHERE avg_rating
    > 8), TopGenres AS ( SELECT T2.genre FROM HighRatedMovies AS T1 INNER JOIN genre
    AS T2 ON T1.movie_id = T2.movie_id GROUP BY T2.genre ORDER BY COUNT(T1.movie_id)
    DESC LIMIT 3) SELECT T4.name, COUNT(DISTINCT T1.movie_id) AS movie_count FROM
    director_mapping AS T1 INNER JOIN HighRatedMovies AS T2 ON T1.movie_id = T2.movie_id
    INNER JOIN genre AS T3 ON T1.movie_id = T3.movie_id INNER JOIN names AS T4 ON
    T1.name_id = T4.id WHERE T3.genre IN ( SELECT genre FROM TopGenres ) GROUP BY
    T4.name ORDER BY movie_count DESC LIMIT 4;
- metric_name: Top 3 Genres by High-Rated Movies
  sql_logic: WITH HighRatedMovies AS ( SELECT movie_id FROM ratings WHERE avg_rating
    > 8 ) SELECT T2.genre FROM HighRatedMovies AS T1 INNER JOIN genre AS T2 ON T1.movie_id
    = T2.movie_id GROUP BY T2.genre ORDER BY COUNT(T1.movie_id) DESC LIMIT 3
