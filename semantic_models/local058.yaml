biz_logic:
- metric_name: percentage_increase
  sql_logic: (CAST(unique_products_2021 AS REAL) - unique_products_2020) * 100.0 /
    NULLIF(unique_products_2020, 0)
- metric_name: unique_products_2020
  sql_logic: COUNT(DISTINCT CASE WHEN hardware_fact_sales_monthly.fiscal_year = 2020
    THEN hardware_fact_sales_monthly.product_code END)
- metric_name: unique_products_2021
  sql_logic: COUNT(DISTINCT CASE WHEN hardware_fact_sales_monthly.fiscal_year = 2021
    THEN hardware_fact_sales_monthly.product_code END)
