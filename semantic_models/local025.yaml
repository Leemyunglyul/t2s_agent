descriptions:
- table: batsman_scored
  column: runs_scored
  meaning: Represents runs scored by the batsman off the bat for a single ball. To
    calculate the total runs for a ball, this must be combined with `extra_runs.extra_runs`.
- table: extra_runs
  column: extra_runs
  meaning: Represents runs not scored by the batsman off the bat (e.g., wides, no-balls)
    for a single ball. To calculate the total runs for a ball, this must be combined
    with `batsman_scored.runs_scored`.
relations: []
synonyms:
- nl_term: highest scoring over
  db_target: ROW_NUMBER() OVER (PARTITION BY match_id ORDER BY total_runs_in_over
    DESC) = 1
  type: condition
biz_logic:
- metric_name: Highest Scoring Over (Ranking Logic)
  sql_logic: ROW_NUMBER() OVER (PARTITION BY match_id ORDER BY total_runs_in_over
    DESC)
- metric_name: Total Runs per Over
  sql_logic: SUM(COALESCE(batsman_scored.runs_scored, 0) + COALESCE(extra_runs.extra_runs,
    0))
- metric_name: Average of Highest Scoring Overs per Match
  sql_logic: AVG(total_runs_in_over) FROM (SELECT total_runs_in_over, ROW_NUMBER()
    OVER (PARTITION BY match_id ORDER BY total_runs_in_over DESC) AS rn FROM RunsPerOver)
    AS RankedOvers WHERE rn = 1
