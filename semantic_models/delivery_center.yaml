descriptions:
  - table: "orders"
    column: "order_status"
    meaning: |
      A value of 'FINISHED' indicates a completed order suitable for analytical calculations.
  - table: "deliveries"
    column: "driver_id"
    meaning: |
      A NULL value indicates that no driver has been assigned to the delivery.
relations:
  - table_1: "deliveries"
    column_1: "delivery_order_id"
    table_2: "orders"
    column_2: "order_id"
synonyms: []
biz_logic:
  - metric_name: "Average Daily Deliveries per Driver"
    sql_logic: |
      WITH CTE_DailyDeliveries AS (SELECT del.driver_id, o.order_created_year,
      o.order_created_month, o.order_created_day, COUNT(DISTINCT del.delivery_id)
      AS daily_delivery_count FROM deliveries AS del JOIN orders AS o ON del.delivery_order_id
      = o.order_id WHERE del.driver_id IS NOT NULL GROUP BY del.driver_id, o.order_created_year,
      o.order_created_month, o.order_created_day) SELECT driver_id, AVG(daily_delivery_count)
      AS average_daily_deliveries FROM CTE_DailyDeliveries GROUP BY driver_id
  - metric_name: "Percentage Increase in Monthly Orders"
    sql_logic: |
      (CAST(Current_Month_Orders AS DECIMAL) - Previous_Month_Orders) * 100.0 / Previous_Month_Orders