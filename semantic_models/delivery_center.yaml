descriptions:
  - table: "orders"
    column: "order_status"
    meaning: |
      Indicates the current state of an order. A value of 'FINISHED' signifies a completed order that is valid for analytical calculations.
  - table: "deliveries"
    column: "driver_id"
    meaning: |
      The unique identifier for the driver assigned to the delivery. A NULL value indicates that no driver has been assigned yet.
  - table: "orders"
    column: "order_created_month"
    meaning: |
      The month when the order was created, represented as a number (e.g., 2 for February, 3 for March).
relations:
  - table_1: "deliveries"
    column_1: "delivery_order_id"
    table_2: "orders"
    column_2: "order_id"
synonyms: []
biz_logic:
  - metric_name: "Average Daily Deliveries per Driver"
    sql_logic: |
      WITH CTE_DailyDeliveries AS (SELECT del.driver_id, o.order_created_year, o.order_created_month, o.order_created_day, COUNT(DISTINCT del.delivery_id) AS daily_delivery_count FROM deliveries AS del JOIN orders AS o ON del.delivery_order_id = o.order_id WHERE del.driver_id IS NOT NULL GROUP BY del.driver_id, o.order_created_year, o.order_created_month, o.order_created_day) SELECT driver_id, AVG(daily_delivery_count) AS average_daily_deliveries FROM CTE_DailyDeliveries GROUP BY driver_id
  - metric_name: "Percentage Increase in Monthly Orders"
    sql_logic: |
      (CAST(Current_Month_Orders AS DECIMAL) - Previous_Month_Orders) * 100.0 / Previous_Month_Orders
  - metric_name: "Driver Rank by Average Daily Deliveries"
    sql_logic: |
      DENSE_RANK() OVER (ORDER BY average_daily_deliveries DESC)
  - metric_name: "February_Orders_Count"
    sql_logic: |
      SUM(CASE WHEN o.order_created_month = 2 THEN 1 ELSE 0 END)
  - metric_name: "March_Orders_Count"
    sql_logic: |
      SUM(CASE WHEN o.order_created_month = 3 THEN 1 ELSE 0 END)
  - metric_name: "Top 5 Drivers by Average Daily Deliveries"
    sql_logic: |
      WITH CTE_DailyDeliveries AS (SELECT T1.driver_id, T2.order_created_year, T2.order_created_month, T2.order_created_day, COUNT(DISTINCT T1.delivery_id) AS daily_delivery_count FROM deliveries AS T1 JOIN orders AS T2 ON T1.delivery_order_id = T2.order_id WHERE T1.driver_id IS NOT NULL GROUP BY T1.driver_id, T2.order_created_year, T2.order_created_month, T2.order_created_day), CTE_DriverAverages AS (SELECT driver_id, AVG(daily_delivery_count) AS average_daily_deliveries FROM CTE_DailyDeliveries GROUP BY driver_id), CTE_RankedDrivers AS (SELECT driver_id, average_daily_deliveries, DENSE_RANK() OVER (ORDER BY average_daily_deliveries DESC) AS driver_rank FROM CTE_DriverAverages) SELECT driver_id, average_daily_deliveries FROM CTE_RankedDrivers WHERE driver_rank <= 5