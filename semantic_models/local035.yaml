biz_logic:
- metric_name: Find Furthest Pair of Cities (Heuristic)
  sql_logic: 'An algorithmic approach to find a pair of distant cities. It involves:
    1. Sorting all unique geolocations. 2. Using the LAG() window function to access
    the preceding location in the sorted list. 3. Calculating the squared Euclidean
    distance `(current_lat - prev_lat)^2 + (current_lng - prev_lng)^2` as a heuristic.
    4. Finding the maximum distance among pairs that are in different cities.'
