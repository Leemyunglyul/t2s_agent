descriptions:
- table: model_score
  column: model
  meaning: A value of 'Stack' refers to a stacked or ensemble model, which is compared
    against other individual models.
- table: model
  column: step
  meaning: A value of 1 indicates the first step of the model building process, used
    to uniquely identify the L1_model type for a given model version.
- table: model
  column: L1_model
  meaning: The type of the Level 1 (base) model, which can be 'regression' or 'tree'.
relations: []
synonyms:
- nl_term: status
  db_target: final_status
  type: column
- nl_term: strong model
  db_target: final_status = 'strong'
  type: condition
- nl_term: soft model
  db_target: final_status = 'soft'
  type: condition
- nl_term: top L1 model
  db_target: DENSE_RANK() OVER (PARTITION BY final_status ORDER BY occurrence_count
    DESC) = 1
  type: condition
biz_logic:
- metric_name: stack_score
  sql_logic: MAX(CASE WHEN MS.model = 'Stack' THEN MS.test_score ELSE NULL END)
- metric_name: max_non_stack_score
  sql_logic: MAX(CASE WHEN MS.model != 'Stack' THEN MS.test_score ELSE NULL END)
- metric_name: step_status
  sql_logic: CASE WHEN max_non_stack_score < stack_score THEN 'strong' WHEN max_non_stack_score
    = stack_score THEN 'soft' ELSE NULL END
- metric_name: final_status
  sql_logic: MAX(step_status)
- metric_name: Top L1 Model by Status Rank
  sql_logic: DENSE_RANK() OVER (PARTITION BY final_status ORDER BY occurrence_count
    DESC)
