synonyms:
- nl_term: entertainer’s stage name
  db_target: Entertainers.EntStageName
  type: column
- nl_term: customer’s last name
  db_target: Customers.CustLastName
  type: column
- nl_term: style strengths
  db_target: Entertainer_Styles.StyleStrength
  type: column
- nl_term: style preferences
  db_target: Musical_Preferences.PreferenceSeq
  type: column
- nl_term: first style strength
  db_target: Entertainer_Styles.StyleStrength = 1
  type: condition
- nl_term: second style strength
  db_target: Entertainer_Styles.StyleStrength = 2
  type: condition
- nl_term: first style preference
  db_target: Musical_Preferences.PreferenceSeq = 1
  type: condition
- nl_term: second style preference
  db_target: Musical_Preferences.PreferenceSeq = 2
  type: condition
- nl_term: up to three style strengths
  db_target: COUNT(Entertainer_Styles.StyleID) <= 3
  type: condition
- nl_term: up to three style preferences
  db_target: COUNT(Musical_Preferences.StyleID) <= 3
  type: condition
biz_logic:
- metric_name: Entertainer Top 2 Styles
  sql_logic: |-
    WITH EntertainerStylesPivoted AS
      (SELECT EntertainerID, COUNT(StyleID) AS StyleCount,
              MAX(CASE WHEN StyleStrength = 1 THEN StyleID
                  END) AS Style1, MAX(CASE WHEN StyleStrength = 2 THEN StyleID
                                      END) AS Style2
       FROM Entertainer_Styles
       GROUP BY EntertainerID
       HAVING COUNT(StyleID) <= 3
       AND MAX(CASE WHEN StyleStrength = 1 THEN StyleID
               END) IS NOT NULL
       AND MAX(CASE WHEN StyleStrength = 2 THEN StyleID
               END) IS NOT NULL)
- metric_name: Customer Top 2 Preferences
  sql_logic: |-
    WITH CustomerPreferencesPivoted AS
      (SELECT CustomerID, COUNT(StyleID) AS PrefCount,
              MAX(CASE WHEN PreferenceSeq = 1 THEN StyleID
                  END) AS Pref1, MAX(CASE WHEN PreferenceSeq = 2 THEN StyleID
                                     END) AS Pref2
       FROM Musical_Preferences
       GROUP BY CustomerID
       HAVING COUNT(StyleID) <= 3
       AND MAX(CASE WHEN PreferenceSeq = 1 THEN StyleID
               END) IS NOT NULL
       AND MAX(CASE WHEN PreferenceSeq = 2 THEN StyleID
               END) IS NOT NULL)
- metric_name: Matching Entertainer Customer Pairs by Top 2 Styles
  sql_logic: |-
    SELECT E.EntStageName, C.CustLastName
    FROM Entertainers AS E
    INNER JOIN EntertainerStylesPivoted AS ESP ON E.EntertainerID = ESP.EntertainerID
    INNER JOIN Customers AS C ON 1 = 1
    INNER JOIN CustomerPreferencesPivoted AS CPP ON C.CustomerID = CPP.CustomerID
    WHERE (ESP.Style1 = CPP.Pref1
           AND ESP.Style2 = CPP.Pref2)
      OR (ESP.Style1 = CPP.Pref2
          AND ESP.Style2 = CPP.Pref1)
