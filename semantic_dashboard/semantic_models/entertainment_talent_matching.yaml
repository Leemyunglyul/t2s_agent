    Unique identifier for an agent who manages entertainers or engagements.
- table: Agents
  column: AgtFirstName
  meaning: First name of the agent.
- table: Agents
  column: AgtLastName
  meaning: Last name of the agent.
- table: Agents
  column: Salary
  meaning: Annual salary of the agent.
- table: Agents
  column: CommissionRate
  meaning: Commission rate earned by the agent on engagements.
- table: Customers
  column: CustomerID
  meaning: Unique identifier for a customer who books entertainers.
- table: Customers
  column: CustFirstName
  meaning: First name of the customer.
- table: Customers
  column: CustLastName
  meaning: Last name of the customer.
- table: Engagements
  column: EngagementNumber
  meaning: |-
    Unique identifier for an entertainment booking or engagement.
- table: Engagements
  column: StartDate
  meaning: The start date of the engagement.
- table: Engagements
  column: EndDate
  meaning: The end date of the engagement.
- table: Engagements
  column: ContractPrice
  meaning: The agreed-upon price for the engagement contract.
- table: Engagements
  column: CustomerID
  meaning: |-
    Foreign key linking to the customer who booked the engagement.
- table: Engagements
  column: AgentID
  meaning: Foreign key linking to the agent managing the engagement.
- table: Engagements
  column: EntertainerID
  meaning: |-
    Foreign key linking to the entertainer performing in the engagement.
- table: Entertainer_Members
  column: EntertainerID
  meaning: Foreign key linking to the entertainer group.
- table: Entertainer_Members
  column: MemberID
  meaning: |-
    Foreign key linking to an individual member of the entertainer group.
- table: Entertainer_Styles
  column: EntertainerID
  meaning: Foreign key linking to the entertainer.
- table: Entertainer_Styles
  column: StyleID
  meaning: |-
    Foreign key linking to a musical style the entertainer performs.
- table: Entertainer_Styles
  column: StyleStrength
  meaning: |-
    A numerical ranking indicating the entertainer's proficiency or primary focus for a given musical style (e.g., 1 for primary, 2 for secondary).
- table: Entertainers
  column: EntertainerID
  meaning: Unique identifier for an entertainer or entertainment group.
- table: Entertainers
  column: EntStageName
  meaning: The stage name of the entertainer or entertainment group.
- table: Members
  column: MemberID
  meaning: |-
    Unique identifier for an individual member of an entertainer group.
- table: Members
  column: MbrFirstName
  meaning: First name of the member.
- table: Members
  column: MbrLastName
  meaning: Last name of the member.
- table: Musical_Preferences
  column: CustomerID
  meaning: Foreign key linking to the customer.
- table: Musical_Preferences
  column: StyleID
  meaning: Foreign key linking to a musical style the customer prefers.
- table: Musical_Preferences
  column: PreferenceSeq
  meaning: |-
    A numerical ranking indicating the customer's preference order for a given musical style (e.g., 1 for most preferred, 2 for second most preferred).
- table: Musical_Styles
  column: StyleID
  meaning: Unique identifier for a musical style.
- table: Musical_Styles
  column: StyleName
  meaning: The name of the musical style (e.g., 'Jazz', 'Rock').
