biz_logic:
- metric_name: HighRatedMovies
  sql_logic: |-
    SELECT movie_id
    FROM ratings
    WHERE avg_rating > 8
- metric_name: GenreMovieCounts
  sql_logic: |-
    SELECT T2.genre, COUNT(DISTINCT T1.movie_id) AS movie_count
    FROM CTE_HighRatedMovies AS T1
    INNER JOIN genre AS T2 ON T1.movie_id = T2.movie_id
    GROUP BY T2.genre
- metric_name: Top3Genres
  sql_logic: |-
    SELECT genre
    FROM CTE_GenreMovieCounts
    ORDER BY movie_count DESC
    LIMIT 3
- metric_name: HighRatedMoviesInTopGenres
  sql_logic: |-
    SELECT T1.movie_id, T2.genre
    FROM CTE_HighRatedMovies AS T1
    INNER JOIN genre AS T2 ON T1.movie_id = T2.movie_id
    WHERE T2.genre IN
        (SELECT genre
         FROM CTE_Top3Genres)
- metric_name: DirectorMovieCounts
  sql_logic: |-
    SELECT T3.name, COUNT(DISTINCT T1.movie_id) AS movie_count
    FROM CTE_HighRatedMoviesInTopGenres AS T1
    INNER JOIN director_mapping AS T2 ON T1.movie_id = T2.movie_id
    INNER JOIN NAMES AS T3 ON T2.name_id = T3.id
    GROUP BY T3.name
- metric_name: Top4Directors
  sql_logic: |-
    SELECT name, movie_count
    FROM CTE_DirectorMovieCounts
    ORDER BY movie_count DESC
    LIMIT 4
- metric_name: MonthlyStoreRentals
  sql_logic: |-
    WITH MonthlyStoreRentals AS
      (SELECT T2.store_id, STRFTIME('%Y', T1.rental_date) AS rental_year,
              STRFTIME('%m', T1.rental_date) AS rental_month, COUNT(T1.rental_id) AS total_rentals
       FROM rental AS T1
       INNER JOIN staff AS T2 ON T1.staff_id = T2.staff_id
       GROUP BY T2.store_id, rental_year, rental_month)
- metric_name: RankedRentals
  sql_logic: |-
    WITH RankedRentals AS
      (SELECT store_id, rental_year, rental_month, total_rentals,
              DENSE_RANK() OVER (PARTITION BY store_id
                                 ORDER BY total_rentals DESC) AS rank_num
       FROM MonthlyStoreRentals)
- metric_name: HighestRentalMonthPerStore
  sql_logic: |-
    SELECT store_id, rental_year, rental_month, total_rentals
    FROM RankedRentals
    WHERE rank_num = 1
- metric_name: film_category_highest_rental_hours_in_filtered_cities
  sql_logic: |-
    WITH FilteredCities AS
      (SELECT city_id
       FROM city
       WHERE city LIKE 'A%'
         OR city LIKE '%-%'),
         RentalDetails AS
      (SELECT r.customer_id, f.rental_duration, fc.category_id
       FROM rental AS r
       JOIN inventory AS i ON r.inventory_id = i.inventory_id
       JOIN film AS f ON i.film_id = f.film_id
       JOIN film_category AS fc ON f.film_id = fc.film_id),
         CustomerAddressCity AS
      (SELECT c.customer_id, a.city_id
       FROM customer AS c
       JOIN address AS a ON c.address_id = a.address_id)
    SELECT cat.name
    FROM RentalDetails AS rd
    JOIN CustomerAddressCity AS cac ON rd.customer_id = cac.customer_id
    JOIN FilteredCities AS fc ON cac.city_id = fc.city_id
    JOIN category AS cat ON rd.category_id = cat.category_id
    GROUP BY cat.name
    ORDER BY SUM(rd.rental_duration * 24) DESC
    LIMIT 1
