biz_logic:
- metric_name: median_highest_season_goals
  sql_logic: |-
    WITH TeamGoals AS
      (SELECT home_team_api_id AS team_id, season, home_team_goal AS goals
       FROM MATCH
       UNION ALL SELECT away_team_api_id AS team_id, season, away_team_goal AS goals
       FROM MATCH),
         TeamSeasonTotals AS
      (SELECT team_id, season, SUM(goals) AS total_season_goals
       FROM TeamGoals
       GROUP BY team_id, season),
         HighestSeasonGoals AS
      (SELECT team_id, MAX(total_season_goals) AS max_goals
       FROM TeamSeasonTotals
       GROUP BY team_id),
         RankedGoals AS
      (SELECT max_goals,
              ROW_NUMBER() OVER (
                                 ORDER BY max_goals) AS rn, COUNT(*) OVER () AS total_count
       FROM HighestSeasonGoals)
    SELECT AVG(max_goals) AS median_highest_season_goals
    FROM RankedGoals
    WHERE rn IN ((total_count + 1) / 2, (total_count + 2) / 2)
- metric_name: top_10_teams_by_wins
  sql_logic: |-
    WITH home_wins AS
      (SELECT home_team_api_id AS team_id
       FROM MATCH
       WHERE home_team_goal > away_team_goal),
         away_wins AS
      (SELECT away_team_api_id AS team_id
       FROM MATCH
       WHERE away_team_goal > home_team_goal),
         all_wins AS
      (SELECT team_id
       FROM home_wins
       UNION ALL SELECT team_id
       FROM away_wins),
         team_win_counts AS
      (SELECT team_id, COUNT(*) AS number_of_wins
       FROM all_wins
       GROUP BY team_id),
         ranked_teams AS
      (SELECT team_id, number_of_wins,
              DENSE_RANK() OVER (
                                 ORDER BY number_of_wins DESC) AS rank_num
       FROM team_win_counts)
    SELECT T.team_long_name, RT.number_of_wins
    FROM ranked_teams AS RT
    JOIN Team AS T ON RT.team_id = T.team_api_id
    WHERE RT.rank_num <= 10
    ORDER BY RT.number_of_wins DESC, T.team_long_name ASC
- metric_name: Champion Team and Points per Season and League
  sql_logic: |-
    WITH CTE_TeamMatchPoints AS
      (-- Points for home teams
     SELECT M.season, M.league_id, M.home_team_api_id AS team_id,
            CASE WHEN M.home_team_goal > M.away_team_goal THEN 3 WHEN M.home_team_goal = M.away_team_goal THEN 1 ELSE 0
            END AS points_earned
       FROM MATCH AS M
       UNION ALL -- Points for away teams
     SELECT M.season, M.league_id, M.away_team_api_id AS team_id,
            CASE WHEN M.away_team_goal > M.home_team_goal THEN 3 WHEN M.away_team_goal = M.home_team_goal THEN 1 ELSE 0
            END AS points_earned
       FROM MATCH AS M),
         CTE_SeasonLeagueTeamPoints AS
      (-- Aggregate total points for each team per season and league
     SELECT TMP.season, TMP.league_id, TMP.team_id, SUM(TMP.points_earned) AS total_points
       FROM CTE_TeamMatchPoints AS TMP
       GROUP BY TMP.season, TMP.league_id, TMP.team_id),
         CTE_RankedTeams AS
      (-- Rank teams within each season and league by total points
     SELECT SLTP.season, SLTP.league_id, SLTP.team_id, SLTP.total_points,
            ROW_NUMBER() OVER (PARTITION BY SLTP.season, SLTP.league_id
                               ORDER BY SLTP.total_points DESC) AS rank_num
       FROM CTE_SeasonLeagueTeamPoints AS SLTP)
    SELECT C.name AS country_name, L.name AS league_name, RT.season, T.team_long_name AS champion_team_name,
           RT.total_points AS champion_points
    FROM CTE_RankedTeams AS RT
    INNER JOIN League AS L ON RT.league_id = L.id
    INNER JOIN Country AS C ON L.country_id = C.id
    INNER JOIN Team AS T ON RT.team_id = T.team_api_id
    WHERE RT.rank_num = 1
    ORDER BY C.name, L.name, RT.season;
