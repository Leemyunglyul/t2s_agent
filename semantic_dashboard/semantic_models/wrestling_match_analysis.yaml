biz_logic:
- metric_name: match_duration_in_seconds
  sql_logic: |-
    CAST(SUBSTR(M.duration, 1, INSTR(M.duration, ':') - 1) AS INTEGER) * 60 + CAST(SUBSTR(M.duration,

                                                                                     INSTR(M.duration,

                                                                                       ':') + 1) AS INTEGER)
- metric_name: shortest_match_wrestlers_for_nxt_title_no_change
  sql_logic: |-
    WITH NXTMatchesWithDuration AS
      (SELECT M.id, M.winner_id, M.loser_id, M.title_id,
              CAST(SUBSTR(M.duration, 1, INSTR(M.duration,
                                           ':') - 1) AS INTEGER) * 60 + CAST(SUBSTR(M.duration,

                                                                               INSTR(M.duration,
                                                                                 ':') + 1) AS INTEGER) AS duration_in_seconds
       FROM Matches AS M
       INNER JOIN Belts AS B ON M.title_id = B.id
       WHERE B.name LIKE '%NXT%'
         AND M.title_change = 0
         AND M.duration IS NOT NULL
         AND M.duration != ''
         AND INSTR(M.duration, ':') > 0),
         ShortestNXTMatch AS
      (SELECT id, winner_id, loser_id, duration_in_seconds
       FROM NXTMatchesWithDuration
       ORDER BY duration_in_seconds ASC
       LIMIT 1)
    SELECT W_Winner.name AS "Winner Name", W_Loser.name AS "Loser Name"
    FROM ShortestNXTMatch AS SNM
    INNER JOIN Wrestlers AS W_Winner ON SNM.winner_id = W_Winner.id
    INNER JOIN Wrestlers AS W_Loser ON SNM.loser_id = W_Loser.id;
