biz_logic:
- metric_name: average_total_career_runs_for_high_scoring_strikers
  sql_logic: |-
    WITH striker_runs_per_match AS
      (SELECT bb.striker, bb.match_id, SUM(bs.runs_scored) AS runs_in_match
       FROM ball_by_ball AS bb
       INNER JOIN batsman_scored AS bs ON bb.match_id = bs.match_id
       AND bb.over_id = bs.over_id
       AND bb.ball_id = bs.ball_id
       AND bb.innings_no = bs.innings_no
       GROUP BY bb.striker, bb.match_id),
         qualifying_strikers AS
      (SELECT DISTINCT striker
       FROM striker_runs_per_match
       WHERE runs_in_match > 50),
         all_strikers_career_runs AS
      (SELECT striker, SUM(runs_in_match) AS total_career_runs
       FROM striker_runs_per_match
       GROUP BY striker)
    SELECT AVG(ascr.total_career_runs)
    FROM all_strikers_career_runs AS ascr
    INNER JOIN qualifying_strikers AS qs ON ascr.striker = qs.striker;
- metric_name: Players Scoring 100+ Runs in a Losing Match
  sql_logic: |-
    WITH PlayerMatchRuns AS
      (SELECT bb.match_id, bb.striker AS player_id, SUM(bs.runs_scored) AS total_runs
       FROM ball_by_ball AS bb
       INNER JOIN batsman_scored AS bs ON bb.match_id = bs.match_id
       AND bb.over_id = bs.over_id
       AND bb.ball_id = bs.ball_id
       AND bb.innings_no = bs.innings_no
       GROUP BY bb.match_id, bb.striker),
         LosingTeams AS
      (SELECT match_id,
              CASE WHEN match_winner = team_1 THEN team_2 ELSE team_1
              END AS losing_team_id
       FROM MATCH
       WHERE match_winner IS NOT NULL),
         CenturionsInLosingMatches AS
      (SELECT pmr.player_id
       FROM PlayerMatchRuns AS pmr
       INNER JOIN LosingTeams AS lt ON pmr.match_id = lt.match_id
       INNER JOIN player_match AS pm ON pmr.match_id = pm.match_id
       AND pmr.player_id = pm.player_id
       WHERE pmr.total_runs >= 100
         AND pm.team_id = lt.losing_team_id)
    SELECT DISTINCT p.player_name
    FROM CenturionsInLosingMatches AS clm
    INNER JOIN player AS p ON clm.player_id = p.player_id;
- metric_name: Total Runs Scored by Player in Season
  sql_logic: |-
    SUM(bs.runs_scored) AS total_runs
    FROM ball_by_ball AS bb
    INNER JOIN batsman_scored AS bs ON bb.match_id = bs.match_id
    AND bb.over_id = bs.over_id
    AND bb.ball_id = bs.ball_id
    AND bb.innings_no = bs.innings_no
    WHERE bb.striker = [player_id]
      AND bb.match_id IN
        (SELECT match_id
         FROM MATCH
         WHERE season_id = [season_id])
- metric_name: Matches Played by Player in Season
  sql_logic: |-
    COUNT(DISTINCT pm.match_id) AS matches_played
    FROM player_match AS pm
    WHERE pm.player_id = [player_id]
      AND pm.match_id IN
        (SELECT match_id
         FROM MATCH
         WHERE season_id = [season_id])
- metric_name: Total Dismissals for Player in Season
  sql_logic: |-
    COUNT(wt.player_out) AS total_dismissals
    FROM wicket_taken AS wt
    WHERE wt.player_out = [player_id]
      AND wt.match_id IN
        (SELECT match_id
         FROM MATCH
         WHERE season_id = [season_id])
- metric_name: Average Runs Per Match
  sql_logic: |-
    CAST(COALESCE(total_runs, 0) AS REAL) / COALESCE(matches_played,
                                              1)
- metric_name: Batting Average
  sql_logic: |-
    CASE WHEN COALESCE(total_dismissals, 0) = 0 THEN NULL ELSE CAST(COALESCE(total_runs,
                                                                      0) AS REAL) / COALESCE(total_dismissals,

                                                                                      1)
    END
- metric_name: Average Highest Over Runs
  sql_logic: |-
    WITH CTE_BallRuns AS
      (SELECT match_id, innings_no, over_id, ball_id, runs_scored AS runs
       FROM batsman_scored
       UNION ALL SELECT match_id, innings_no, over_id, ball_id, extra_runs AS runs
       FROM extra_runs),
         CTE_OverRunsWithBowler AS
      (SELECT br.match_id, br.innings_no, br.over_id, SUM(br.runs) AS total_runs_in_over,
              MIN(bb.bowler) AS bowler_id
       FROM CTE_BallRuns AS br
       INNER JOIN ball_by_ball AS bb ON br.match_id = bb.match_id
       AND br.innings_no = bb.innings_no
       AND br.over_id = bb.over_id
       AND br.ball_id = bb.ball_id
       GROUP BY br.match_id, br.innings_no, br.over_id),
         CTE_RankedOvers AS
      (SELECT match_id, innings_no, over_id, total_runs_in_over, bowler_id,
              ROW_NUMBER() OVER (PARTITION BY match_id
                                 ORDER BY total_runs_in_over DESC) AS rn
       FROM CTE_OverRunsWithBowler),
         CTE_HighestOversPerMatch AS
      (SELECT match_id, innings_no, over_id, total_runs_in_over, bowler_id
       FROM CTE_RankedOvers
       WHERE rn = 1)
    SELECT AVG(total_runs_in_over) AS average_highest_over_runs
    FROM CTE_HighestOversPerMatch;
- metric_name: total_wickets_taken
  sql_logic: |-
    SUM(CASE
            WHEN wt.kind_out IS NOT NULL
                 AND wt.kind_out NOT IN ('run out',
                                       'retired hurt', 'obstructing the field') THEN 1 ELSE 0
        END)
    GROUP BY bb.bowler
- metric_name: total_runs_conceded
  sql_logic: |-
    SUM(COALESCE(bs.runs_scored, 0))
    GROUP BY bb.bowler
- metric_name: total_legal_balls_bowled
  sql_logic: |-
    SUM(CASE WHEN er.extra_type IN ('wides', 'noballs') THEN 0 ELSE 1
        END)
    GROUP BY bb.bowler
- metric_name: economy_rate
  sql_logic: |-
    CASE WHEN total_legal_balls_bowled = 0 THEN 0.0 ELSE CAST(total_runs_conceded AS REAL) / (total_legal_balls_bowled / 6.0)
    END
- metric_name: strike_rate
  sql_logic: |-
    CASE WHEN total_wickets_taken = 0 THEN NULL ELSE CAST(total_legal_balls_bowled AS REAL) / total_wickets_taken
    END
- metric_name: best_bowling_performance
  sql_logic: |-
    SELECT bowler_id, match_id, wickets_taken_match, runs_conceded_match
    FROM
      (SELECT bowler_id, match_id, wickets_taken_match, runs_conceded_match,
              ROW_NUMBER() OVER (PARTITION BY bowler_id
                                 ORDER BY wickets_taken_match DESC, runs_conceded_match ASC) AS rn
       FROM BowlerMatchPerformance) AS ranked_performances
    WHERE rn = 1
