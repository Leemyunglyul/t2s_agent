biz_logic:
- metric_name: Distinct Customers Count
  sql_logic: |-
    WITH delivered_orders AS
      (SELECT o.order_id, o.customer_id, oi.seller_id
       FROM olist_orders AS o
       JOIN olist_order_items AS oi ON o.order_id = oi.order_id
       WHERE o.order_status = 'delivered')
    SELECT T1.seller_id, COUNT(DISTINCT T2.customer_unique_id) AS distinct_customers_count
    FROM delivered_orders AS T1
    JOIN olist_customers AS T2 ON T1.customer_id = T2.customer_id
    GROUP BY T1.seller_id
- metric_name: Total Profit
  sql_logic: |-
    WITH delivered_orders AS
      (SELECT o.order_id, oi.seller_id, oi.price, oi.freight_value
       FROM olist_orders AS o
       JOIN olist_order_items AS oi ON o.order_id = oi.order_id
       WHERE o.order_status = 'delivered')
    SELECT seller_id, SUM(price - freight_value) AS total_profit
    FROM delivered_orders
    GROUP BY seller_id
- metric_name: Distinct Orders Count
  sql_logic: |-
    WITH delivered_orders AS
      (SELECT o.order_id, oi.seller_id
       FROM olist_orders AS o
       JOIN olist_order_items AS oi ON o.order_id = oi.order_id
       WHERE o.order_status = 'delivered')
    SELECT seller_id, COUNT(DISTINCT order_id) AS distinct_orders_count
    FROM delivered_orders
    GROUP BY seller_id
- metric_name: Five Star Ratings Count
  sql_logic: |-
    WITH delivered_orders AS
      (SELECT o.order_id, oi.seller_id
       FROM olist_orders AS o
       JOIN olist_order_items AS oi ON o.order_id = oi.order_id
       WHERE o.order_status = 'delivered')
    SELECT T1.seller_id, COUNT(DISTINCT T1.order_id) AS five_star_ratings_count
    FROM delivered_orders AS T1
    JOIN olist_order_reviews AS T2 ON T1.order_id = T2.order_id
    WHERE T2.review_score = 5
    GROUP BY T1.seller_id
- metric_name: ArtistTotalSales
  sql_logic: |-
    WITH ArtistTotalSales AS
      (SELECT A.ArtistId, A.Name AS ArtistName, SUM(II.UnitPrice * II.Quantity) AS TotalSales
       FROM artists AS A
       INNER JOIN albums AS AL ON A.ArtistId = AL.ArtistId
       INNER JOIN tracks AS T ON AL.AlbumId = T.AlbumId
       INNER JOIN invoice_items AS II ON T.TrackId = II.TrackId
       GROUP BY A.ArtistId, A.Name)
- metric_name: RankedArtists
  sql_logic: |-
    WITH RankedArtists AS
      (SELECT ArtistId, ArtistName, TotalSales,
              DENSE_RANK() OVER (
                                 ORDER BY TotalSales DESC, ArtistName ASC) AS SalesRankDesc,
              DENSE_RANK() OVER (
                                 ORDER BY TotalSales ASC, ArtistName ASC) AS SalesRankAsc
       FROM ArtistTotalSales)
- metric_name: TopSellingArtists
  sql_logic: |-
    WITH TopSellingArtists AS
      (SELECT ArtistId, ArtistName
       FROM RankedArtists
       WHERE SalesRankDesc = 1)
- metric_name: LowestSellingArtists
  sql_logic: |-
    WITH LowestSellingArtists AS
      (SELECT ArtistId, ArtistName
       FROM RankedArtists
       WHERE SalesRankAsc = 1)
- metric_name: CustomerArtistSpending
  sql_logic: |-
    WITH CustomerArtistSpending AS
      (SELECT C.CustomerId, A.ArtistId, A.Name AS ArtistName,
              SUM(II.UnitPrice * II.Quantity) AS CustomerTotalSpent
       FROM customers AS C
       INNER JOIN invoices AS I ON C.CustomerId = I.CustomerId
       INNER JOIN invoice_items AS II ON I.InvoiceId = II.InvoiceId
       INNER JOIN tracks AS T ON II.TrackId = T.TrackId
       INNER JOIN albums AS AL ON T.AlbumId = AL.AlbumId
       INNER JOIN artists AS A ON AL.ArtistId = A.ArtistId
       GROUP BY C.CustomerId, A.ArtistId, A.Name)
- metric_name: AverageSpendingTopArtists
  sql_logic: |-
    WITH AvgSpendingTopArtist AS
      (SELECT AVG(CustomerTotalSpent) AS AvgTopArtistSpending
       FROM CustomerArtistSpending
       WHERE ArtistId IN
           (SELECT ArtistId
            FROM TopSellingArtists))
- metric_name: AverageSpendingLowestArtists
  sql_logic: |-
    WITH AvgSpendingLowestArtist AS
      (SELECT AVG(CustomerTotalSpent) AS AvgLowestArtistSpending
       FROM CustomerArtistSpending
       WHERE ArtistId IN
           (SELECT ArtistId
            FROM LowestSellingArtists))
- metric_name: AbsoluteDifferenceAvgSpending
  sql_logic: |-
    SELECT
      (SELECT GROUP_CONCAT(ArtistName, ', ')
       FROM TopSellingArtists) AS TopSellingArtistNames,

      (SELECT GROUP_CONCAT(ArtistName, ', ')
       FROM LowestSellingArtists) AS LowestSellingArtistNames,

      (SELECT AvgTopArtistSpending
       FROM AvgSpendingTopArtist) AS AverageSpendingTopArtists,

      (SELECT AvgLowestArtistSpending
       FROM AvgSpendingLowestArtist) AS AverageSpendingLowestArtists,
           ABS(
                 (SELECT AvgTopArtistSpending
                  FROM AvgSpendingTopArtist) -
                 (SELECT AvgLowestArtistSpending
                  FROM AvgSpendingLowestArtist)) AS AbsoluteDifference
- metric_name: Regional Sales Representative Total Sales
  sql_logic: SUM(wo.total_amt_usd)
- metric_name: Sales Representative Rank within Region
  sql_logic: |-
    DENSE_RANK() OVER (PARTITION BY region_id
                       ORDER BY total_rep_sales DESC)
- metric_name: Top Sales Representatives Names (by Region)
  sql_logic: GROUP_CONCAT(sales_rep_name)
- metric_name: Top Sales Representatives Sales Amount (by Region)
  sql_logic: MAX(total_rep_sales)
- metric_name: Total Orders per Region
  sql_logic: COUNT(wo.id)
- metric_name: Total Sales Amount per Region
  sql_logic: SUM(wo.total_amt_usd)
- metric_name: Hub_Finished_Orders_Percentage_Increase_Feb_to_Mar
  sql_logic: |-
    WITH MonthlyOrders AS
      (SELECT h.hub_id, h.hub_name, o.order_created_month, COUNT(o.order_id) AS TotalOrders
       FROM orders AS o
       INNER JOIN stores AS s ON o.store_id = s.store_id
       INNER JOIN hubs AS h ON s.hub_id = h.hub_id
       WHERE o.order_status = 'FINISHED'
         AND o.order_created_month IN (2, 3)
       GROUP BY h.hub_id, h.hub_name, o.order_created_month),
         PivotedOrders AS
      (SELECT hub_id, hub_name,
              SUM(CASE WHEN order_created_month = 2 THEN TotalOrders ELSE 0
                  END) AS February_Orders,
              SUM(CASE WHEN order_created_month = 3 THEN TotalOrders ELSE 0
                  END) AS March_Orders
       FROM MonthlyOrders
       GROUP BY hub_id, hub_name),
         CalculatedIncrease AS
      (SELECT hub_id, hub_name, February_Orders, March_Orders,
              (CAST(March_Orders AS DECIMAL) - February_Orders) * 100.0 / February_Orders AS Percentage_Increase
       FROM PivotedOrders)
    SELECT hub_name, February_Orders, March_Orders, Percentage_Increase
    FROM CalculatedIncrease
    WHERE February_Orders > 0
      AND Percentage_Increase > 20
