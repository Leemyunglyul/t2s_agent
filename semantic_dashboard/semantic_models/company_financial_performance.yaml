biz_logic:
- metric_name: top_industry_identification
  sql_logic: |-
    SELECT T1.industry
    FROM companies_industries AS T1
    INNER JOIN companies_dates AS T2 ON T1.company_id = T2.company_id
    GROUP BY T1.industry
    ORDER BY COUNT(DISTINCT T1.company_id) DESC
    LIMIT 1
- metric_name: new_unicorn_count_in_top_industry_per_year
  sql_logic: |-
    SELECT STRFTIME('%Y', T2.date_joined) AS joined_year, COUNT(DISTINCT T1.company_id) AS new_unicorn_count
    FROM companies_funding AS T1
    INNER JOIN companies_dates AS T2 ON T1.company_id = T2.company_id
    INNER JOIN companies_industries AS T3 ON T1.company_id = T3.company_id
    WHERE T1.valuation >= 1000000000
      AND STRFTIME('%Y', T2.date_joined) BETWEEN '2019' AND '2021'
      AND T3.industry =
        (SELECT industry
         FROM TopIndustry)
    GROUP BY joined_year
- metric_name: average_new_unicorn_companies_per_year
  sql_logic: |-
    SELECT AVG(new_unicorn_count)
    FROM NewUnicornsInTopIndustryPerYear
- metric_name: annual_total_sales
  sql_logic: |-
    SELECT salespersonid, STRFTIME('%Y', orderdate) AS sales_year, SUM(totaldue)
    FROM salesorderheader
    WHERE salespersonid IS NOT NULL
    GROUP BY salespersonid, sales_year
- metric_name: annual_sales_quota
  sql_logic: |-
    SELECT BusinessEntityID, STRFTIME('%Y', QuotaDate) AS quota_year, SUM(SalesQuota)
    FROM SalesPersonQuotaHistory
    GROUP BY BusinessEntityID, quota_year
- metric_name: sales_quota_difference
  sql_logic: |-
    WITH AnnualSales AS
      (SELECT salespersonid, STRFTIME('%Y', orderdate) AS sales_year, SUM(totaldue) AS total_sales
       FROM salesorderheader
       WHERE salespersonid IS NOT NULL
       GROUP BY salespersonid, sales_year),
         AnnualQuotas AS
      (SELECT BusinessEntityID AS salesperson_id,
              STRFTIME('%Y', QuotaDate) AS quota_year, SUM(SalesQuota) AS annual_quota
       FROM SalesPersonQuotaHistory
       GROUP BY BusinessEntityID, quota_year)
    SELECT COALESCE(ASales.total_sales, 0) - COALESCE(AQuotas.annual_quota,
                                               0)
    FROM AnnualSales AS ASales
    FULL OUTER JOIN AnnualQuotas AS AQuotas ON ASales.salespersonid = AQuotas.salesperson_id
    AND ASales.sales_year = AQuotas.quota_year
- metric_name: france_sales_base
  sql_logic: |-
    SELECT s.prod_id, t.calendar_month_number, t.calendar_month_name, t.calendar_year,
           s.amount_sold
    FROM sales AS s
    INNER JOIN times AS t ON s.time_id = t.time_id
    INNER JOIN customers AS c ON s.cust_id = c.cust_id
    INNER JOIN countries AS co ON c.country_id = co.country_id
    INNER JOIN promotions AS p ON s.promo_id = p.promo_id
    INNER JOIN channels AS ch ON s.channel_id = ch.channel_id
    WHERE co.country_name = 'France'
      AND p.promo_total_id = 1
      AND ch.channel_total_id = 1
      AND t.calendar_year IN (2019, 2020)
- metric_name: monthly_sales_2019
  sql_logic: |-
    SELECT prod_id, calendar_month_number, calendar_month_name,
           SUM(amount_sold) AS monthly_sales_2019
    FROM france_sales_base
    WHERE calendar_year = 2019
    GROUP BY prod_id, calendar_month_number, calendar_month_name
- metric_name: monthly_sales_2020
  sql_logic: |-
    SELECT prod_id, calendar_month_number, calendar_month_name,
           SUM(amount_sold) AS monthly_sales_2020
    FROM france_sales_base
    WHERE calendar_year = 2020
    GROUP BY prod_id, calendar_month_number, calendar_month_name
- metric_name: projected_2021_sales_per_product_month
  sql_logic: |-
    SELECT s20.calendar_month_number, s20.calendar_month_name, s20.prod_id,
           s20.monthly_sales_2020 * (s20.monthly_sales_2020 * 1.0 / NULLIF(s19.monthly_sales_2019,
                                                                      0)) AS projected_2021_sales
    FROM monthly_sales_2020 AS s20
    LEFT JOIN monthly_sales_2019 AS s19 ON s20.prod_id = s19.prod_id
    AND s20.calendar_month_number = s19.calendar_month_number
- metric_name: france_2021_exchange_rate
  sql_logic: |-
    SELECT MONTH AS calendar_month_number, to_us
    FROM currency
    WHERE country = 'France'
      AND YEAR = 2021
- metric_name: projected_usd_sales_per_month_product
  sql_logic: |-
    SELECT proj.calendar_month_name, proj.calendar_month_number,
           proj.projected_2021_sales * exch.to_us AS projected_usd_sales
    FROM projected_2021_sales_per_product_month AS proj
    INNER JOIN france_2021_exchange_rate AS exch ON proj.calendar_month_number = exch.calendar_month_number
- metric_name: average_projected_monthly_sales_usd
  sql_logic: |-
    SELECT calendar_month_name, AVG(projected_usd_sales) AS average_projected_monthly_sales_usd
    FROM projected_usd_sales_per_month_product
    GROUP BY calendar_month_number, calendar_month_name
    ORDER BY calendar_month_number
