biz_logic:
- metric_name: Bowlers with Qualifying Wins Across All Specified Venues
  sql_logic: |-
    WITH QualifyingWins AS
      (SELECT BS.BowlerID, BS.MatchID, BS.GameNumber, BS.HandiCapScore, T.TourneyDate,
              T.TourneyLocation
       FROM Bowler_Scores AS BS
       INNER JOIN Tourney_Matches AS TM ON BS.MatchID = TM.MatchID
       INNER JOIN Tournaments AS T ON TM.TourneyID = T.TourneyID
       WHERE BS.WonGame = 1
         AND BS.HandiCapScore <= 190
         AND T.TourneyLocation IN ('Thunderbird Lanes', 'Totem Lanes', 'Bolero Lanes')),
         EligibleBowlers AS
      (SELECT BowlerID
       FROM QualifyingWins
       GROUP BY BowlerID
       HAVING COUNT(DISTINCT TourneyLocation) = 3)
    SELECT B.BowlerID, B.BowlerFirstName, B.BowlerLastName, QW.MatchID, QW.GameNumber,
           QW.HandiCapScore, QW.TourneyDate, QW.TourneyLocation
    FROM Bowlers AS B
    INNER JOIN QualifyingWins AS QW ON B.BowlerID = QW.BowlerID
    WHERE QW.BowlerID IN
        (SELECT BowlerID
         FROM EligibleBowlers)
