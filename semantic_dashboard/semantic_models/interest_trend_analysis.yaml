biz_logic:
- metric_name: Top 10 and Bottom 10 Interest Categories by Peak Composition
  sql_logic: |-
    WITH InterestPeakComposition AS
      (SELECT interest_id, month_year, composition
       FROM
         (SELECT interest_id, month_year, composition,
                 ROW_NUMBER() OVER (PARTITION BY interest_id
                                    ORDER BY composition DESC) AS rn
          FROM interest_metrics) AS subquery
       WHERE rn = 1),
         RankedInterests AS
      (SELECT T1.month_year, T2.interest_name, T1.composition,
              DENSE_RANK() OVER (
                                 ORDER BY T1.composition DESC) AS top_rank,
              DENSE_RANK() OVER (
                                 ORDER BY T1.composition ASC) AS bottom_rank
       FROM InterestPeakComposition AS T1
       INNER JOIN interest_map AS T2 ON T1.interest_id = T2.id)
    SELECT month_year, interest_name, composition
    FROM RankedInterests
    WHERE top_rank <= 10
      OR bottom_rank <= 10
    ORDER BY composition DESC
- metric_name: TotalWeightedScore
  sql_logic: |-
    SUM(CASE WHEN mp.PreferenceSeq = 1 THEN 3 WHEN mp.PreferenceSeq = 2 THEN 2 WHEN mp.PreferenceSeq = 3 THEN 1 ELSE 0
        END)
- metric_name: AverageTotalWeightedScore
  sql_logic: AVG(TotalWeightedScore)
- metric_name: AbsoluteDifference
  sql_logic: ABS(sws.TotalWeightedScore - oas.AverageTotalWeightedScore)
