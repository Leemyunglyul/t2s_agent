databases:
- modern_data
- city_legislation
descriptions:
- table: trees
  column: boroname
  meaning: The name of the borough where the tree is located.
- table: trees
  column: tree_id
  meaning: A unique identifier for each tree.
- table: trees
  column: zipcode
  meaning: The ZIP code where the tree is located.
- table: income_trees
  column: zipcode
  meaning: The ZIP code for which income data is available.
- table: income_trees
  column: Estimate_Mean_income
  meaning: The estimated mean income for a given ZIP code.
- table: income_trees
  column: Estimate_Median_income
  meaning: The estimated median income for a given ZIP code.
- table: trees
  column: health
  meaning: The health status of the tree, e.g., 'Good', 'Fair', 'Poor'.
- table: trees
  column: spc_common
  meaning: The common name of the tree species.
- table: cities
  column: city_id
  meaning: Unique identifier for a city.
- table: cities
  column: city_name
  meaning: The name of the city.
- table: cities
  column: latitude
  meaning: Geographical latitude coordinate of the city.
- table: cities
  column: longitude
  meaning: Geographical longitude coordinate of the city.
- table: cities
  column: country_code_2
  meaning: |-
    Two-letter ISO country code for the country the city is located in.
- table: cities
  column: capital
  meaning: Indicator if the city is a capital (1 for yes, 0 for no).
- table: cities
  column: population
  meaning: The population of the city.
- table: cities
  column: insert_date
  meaning: The date when the city record was inserted or last updated.
- table: cities_countries
  column: country_id
  meaning: Unique identifier for a country.
- table: cities_countries
  column: country_name
  meaning: The full name of the country.
- table: cities_countries
  column: country_code_2
  meaning: Two-letter ISO country code.
- table: cities_countries
  column: country_code_3
  meaning: Three-letter ISO country code.
- table: cities_countries
  column: region
  meaning: |-
    Geographical region the country belongs to (e.g., Asia, Europe).
- table: cities_countries
  column: sub_region
  meaning: Sub-region within the main geographical region.
- table: cities_currencies
  column: currency_id
  meaning: Unique identifier for a currency.
- table: cities_currencies
  column: currency_name
  meaning: The name of the currency.
- table: cities_currencies
  column: currency_code
  meaning: The ISO currency code (e.g., USD, EUR).
- table: cities_languages
  column: language_id
  meaning: Unique identifier for a language.
- table: cities_languages
  column: language
  meaning: The name of the language.
relations:
- table_1: trees
  column_1: zipcode
  table_2: income_trees
  column_2: zipcode
  meaning: |-
    Links tree data to income data based on geographical ZIP code.
- table_1: cities
  column_1: country_code_2
  table_2: cities_countries
  column_2: country_code_2
  meaning: Links cities to their respective country details.
- table_1: cities
  column_1: country_code_2
  table_2: cities_currencies
  column_2: country_code_2
  meaning: Links cities to the currencies used in their country.
- table_1: cities
  column_1: country_code_2
  table_2: cities_languages
  column_2: country_code_2
  meaning: Links cities to the languages spoken in their country.
