biz_logic:
- metric_name: Top 3 Constructor Combined Points
  sql_logic: |-
    WITH CTE_DriverPoints AS
      (SELECT r.year, res.constructor_id, res.driver_id, SUM(res.points) AS driver_total_points
       FROM results AS res
       INNER JOIN races AS r ON res.race_id = r.race_id
       GROUP BY r.year, res.constructor_id, res.driver_id),
         CTE_BestDriverPoints AS
      (SELECT YEAR, constructor_id, MAX(driver_total_points) AS best_driver_points
       FROM CTE_DriverPoints
       GROUP BY YEAR, constructor_id),
         CTE_TeamPoints AS
      (SELECT r.year, cr.constructor_id, SUM(cr.points) AS team_total_points
       FROM constructor_results AS cr
       INNER JOIN races AS r ON cr.race_id = r.race_id
       GROUP BY r.year, cr.constructor_id),
         CTE_CombinedPoints AS
      (SELECT bdp.year, bdp.constructor_id,
              bdp.best_driver_points + tp.team_total_points AS combined_points
       FROM CTE_BestDriverPoints AS bdp
       INNER JOIN CTE_TeamPoints AS tp ON bdp.year = tp.year
       AND bdp.constructor_id = tp.constructor_id),
         CTE_RankedConstructors AS
      (SELECT YEAR, constructor_id, combined_points,
              DENSE_RANK() OVER (
                                 ORDER BY combined_points DESC) AS rank
       FROM CTE_CombinedPoints)
    SELECT c.name AS "Constructor Name", rc.year AS "Year", rc.combined_points AS "Combined Points"
    FROM CTE_RankedConstructors AS rc
    INNER JOIN constructors AS c ON rc.constructor_id = c.constructor_id
    WHERE rc.rank <= 3
    ORDER BY rc.rank ASC, rc.year ASC;
- metric_name: Drivers with Consistent Constructor in a Season (1950s)
  sql_logic: |-
    WITH DriverSeasonRaces AS
      (SELECT res.driver_id, rac.year AS season_year, rac.round, res.constructor_id
       FROM results AS res
       INNER JOIN races AS rac ON res.race_id = rac.race_id
       WHERE rac.year BETWEEN 1950 AND 1959),
         DriverSeasonSummary AS
      (SELECT driver_id, season_year, MIN(round) AS first_round_in_season,
              MAX(round) AS last_round_in_season, COUNT(DISTINCT round) AS distinct_rounds_count
       FROM DriverSeasonRaces
       GROUP BY driver_id, season_year),
         DriverSeasonConstructors AS
      (SELECT dss.driver_id, dss.season_year, dss.distinct_rounds_count,
              frd.constructor_id AS first_race_constructor_id, lrd.constructor_id AS last_race_constructor_id
       FROM DriverSeasonSummary AS dss
       INNER JOIN DriverSeasonRaces AS frd ON dss.driver_id = frd.driver_id
       AND dss.season_year = frd.season_year
       AND dss.first_round_in_season = frd.round
       INNER JOIN DriverSeasonRaces AS lrd ON dss.driver_id = lrd.driver_id
       AND dss.season_year = lrd.season_year
       AND dss.last_round_in_season = lrd.round),
         EligibleDriverSeasons AS
      (SELECT driver_id
       FROM DriverSeasonConstructors
       WHERE first_race_constructor_id = last_race_constructor_id
         AND distinct_rounds_count >= 2)
    SELECT DISTINCT d.forename, d.surname
    FROM drivers AS d
    INNER JOIN EligibleDriverSeasons AS eds ON d.driver_id = eds.driver_id;
- metric_name: average_first_round_missed
  sql_logic: |-
    WITH CTE_DriverRaces AS
      (SELECT res.driver_id, res.constructor_id, r.year, r.round
       FROM results AS res
       JOIN races AS r ON res.race_id = r.race_id
       ORDER BY res.driver_id, r.year, r.round),
         CTE_HiatusDetails AS
      (SELECT driver_id, YEAR, round AS current_round, constructor_id AS current_constructor_id,
              LEAD(round, 1) OVER (PARTITION BY driver_id, YEAR
                                   ORDER BY round) AS next_round,
              LEAD(constructor_id, 1) OVER (PARTITION BY driver_id,
                                         YEAR
                                            ORDER BY round) AS next_constructor_id
       FROM CTE_DriverRaces),
         CTE_FilteredHiatuses AS
      (SELECT current_round + 1 AS first_missed_round, next_round - 1 AS last_missed_round
       FROM CTE_HiatusDetails
       WHERE (next_round - current_round - 1) > 0
         AND (next_round - current_round - 1) < 3
         AND current_constructor_id <> next_constructor_id)
    SELECT AVG(first_missed_round) AS average_first_round_missed, AVG(last_missed_round) AS average_last_round_missed
    FROM CTE_FilteredHiatuses;
- metric_name: average_last_round_missed
  sql_logic: |-
    WITH CTE_DriverRaces AS
      (SELECT res.driver_id, res.constructor_id, r.year, r.round
       FROM results AS res
       JOIN races AS r ON res.race_id = r.race_id
       ORDER BY res.driver_id, r.year, r.round),
         CTE_HiatusDetails AS
      (SELECT driver_id, YEAR, round AS current_round, constructor_id AS current_constructor_id,
              LEAD(round, 1) OVER (PARTITION BY driver_id, YEAR
                                   ORDER BY round) AS next_round,
              LEAD(constructor_id, 1) OVER (PARTITION BY driver_id,
                                         YEAR
                                            ORDER BY round) AS next_constructor_id
       FROM CTE_DriverRaces),
         CTE_FilteredHiatuses AS
      (SELECT current_round + 1 AS first_missed_round, next_round - 1 AS last_missed_round
       FROM CTE_HiatusDetails
       WHERE (next_round - current_round - 1) > 0
         AND (next_round - current_round - 1) < 3
         AND current_constructor_id <> next_constructor_id)
    SELECT AVG(first_missed_round) AS average_first_round_missed, AVG(last_missed_round) AS average_last_round_missed
    FROM CTE_FilteredHiatuses;
- metric_name: Combined Race Points
  sql_logic: |-
    WITH CTE_AllRacePoints AS
      (SELECT R.race_id, R.driver_id, R.constructor_id, R.points
       FROM results AS R
       UNION ALL SELECT SR.race_id, SR.driver_id, SR.constructor_id, SR.points
       FROM sprint_results AS SR)
- metric_name: Driver Race Constructor Points
  sql_logic: |-
    WITH CTE_DriverRaceConstructorPoints AS
      (SELECT arp.race_id, arp.driver_id, arp.constructor_id, SUM(arp.points) AS total_race_points
       FROM CTE_AllRacePoints AS arp
       GROUP BY arp.race_id, arp.driver_id, arp.constructor_id)
- metric_name: |-
    Driver Total Season Points (Point-Scoring Drivers since 2001)
  sql_logic: |-
    WITH CTE_DriverSeasonPoints AS
      (SELECT r.year, drcp.driver_id,
              SUM(drcp.total_race_points) AS driver_total_season_points
       FROM CTE_DriverRaceConstructorPoints AS drcp
       JOIN races AS r ON drcp.race_id = r.race_id
       WHERE r.year >= 2001
       GROUP BY r.year, drcp.driver_id
       HAVING SUM(drcp.total_race_points) > 0)
- metric_name: Minimum Season Points by Any Driver
  sql_logic: |-
    WITH CTE_MinSeasonPoints AS
      (SELECT YEAR, MIN(driver_total_season_points) AS min_points_in_season
       FROM CTE_DriverSeasonPoints
       GROUP BY YEAR)
- metric_name: Drivers with Fewest Points in a Season
  sql_logic: |-
    WITH CTE_DriversWithFewestPoints AS
      (SELECT dsp.year, dsp.driver_id, dsp.driver_total_season_points
       FROM CTE_DriverSeasonPoints AS dsp
       JOIN CTE_MinSeasonPoints AS msp ON dsp.year = msp.year
       AND dsp.driver_total_season_points = msp.min_points_in_season)
- metric_name: Constructors Associated with Fewest Point Drivers
  sql_logic: |-
    WITH CTE_ConstructorsForFewestPointDrivers AS
      (SELECT DISTINCT dfp.year, drcp.constructor_id
       FROM CTE_DriversWithFewestPoints AS dfp
       JOIN CTE_DriverRaceConstructorPoints AS drcp ON dfp.driver_id = drcp.driver_id
       JOIN races AS r ON drcp.race_id = r.race_id
       AND dfp.year = r.year)
- metric_name: Constructor Season Count for Fewest Points
  sql_logic: |-
    WITH CTE_ConstructorSeasonCounts AS
      (SELECT constructor_id, COUNT(DISTINCT YEAR) AS season_count
       FROM CTE_ConstructorsForFewestPointDrivers
       GROUP BY constructor_id)
- metric_name: Top 5 Constructors by Fewest Point Seasons
  sql_logic: |-
    SELECT c.name AS constructor_name, csc.season_count
    FROM CTE_ConstructorSeasonCounts AS csc
    JOIN constructors AS c ON csc.constructor_id = c.constructor_id
    ORDER BY csc.season_count DESC, c.name ASC
    LIMIT 5;
