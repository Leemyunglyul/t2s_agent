  sql_logic: |-
    ABS(SUM(CASE WHEN calendar_quarter_id = 1776 THEN product_share ELSE 0
            END) - SUM(CASE WHEN calendar_quarter_id = 1772 THEN product_share ELSE 0
                       END))
