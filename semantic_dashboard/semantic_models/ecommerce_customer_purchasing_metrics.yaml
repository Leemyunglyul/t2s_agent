biz_logic:
- metric_name: total_payment_per_order
  sql_logic: |-
    SELECT order_id, SUM(payment_value) AS total_payment_per_order
    FROM order_payments
    GROUP BY order_id
- metric_name: customer_aggregates
  sql_logic: |-
    SELECT c.customer_unique_id, COUNT(DISTINCT o.order_id) AS num_orders,
           SUM(op.total_payment_per_order) AS total_customer_payment, MIN(o.order_purchase_timestamp) AS min_purchase_date,
           MAX(o.order_purchase_timestamp) AS max_purchase_date
    FROM customers AS c
    INNER JOIN orders AS o ON c.customer_id = o.customer_id
    INNER JOIN CTE_OrderPayments AS op ON o.order_id = op.order_id
    GROUP BY c.customer_unique_id
- metric_name: avg_payment_per_order
  sql_logic: |-
    SELECT customer_unique_id, num_orders, total_customer_payment / num_orders AS avg_payment_per_order
    FROM CTE_CustomerAggregates
- metric_name: customer_lifespan_weeks
  sql_logic: |-
    SELECT customer_unique_id,
           CASE
               WHEN (JULIANDAY(max_purchase_date) - JULIANDAY(min_purchase_date)) < 7 THEN 1.0
               ELSE (JULIANDAY(max_purchase_date) - JULIANDAY(min_purchase_date)) / 7.0
           END AS customer_lifespan_weeks
    FROM CTE_CustomerAggregates
- metric_name: Monthly Delivered Orders by Year
  sql_logic: |-
    WITH DeliveredOrders AS
      (SELECT order_id, order_delivered_customer_date
       FROM olist_orders
       WHERE order_status = 'delivered'
         AND order_delivered_customer_date IS NOT NULL),
         MonthlyOrders AS
      (SELECT order_id, STRFTIME('%Y',
                          order_delivered_customer_date) AS YEAR,
              STRFTIME('%m', order_delivered_customer_date) AS month_number,
              CASE STRFTIME('%m', order_delivered_customer_date) WHEN '01' THEN 'January' WHEN '02' THEN 'February' WHEN '03' THEN 'March' WHEN '04' THEN 'April' WHEN '05' THEN 'May' WHEN '06' THEN 'June' WHEN '07' THEN 'July' WHEN '08' THEN 'August' WHEN '09' THEN 'September' WHEN '10' THEN 'October' WHEN '11' THEN 'November' WHEN '12' THEN 'December'
              END AS month_name
       FROM DeliveredOrders
       WHERE STRFTIME('%Y', order_delivered_customer_date) IN ('2016', '2017', '2018'))
    SELECT month_name,
           COUNT(CASE WHEN YEAR = '2016' THEN order_id ELSE NULL
                 END) AS "2016",
           COUNT(CASE WHEN YEAR = '2017' THEN order_id ELSE NULL
                 END) AS "2017",
           COUNT(CASE WHEN YEAR = '2018' THEN order_id ELSE NULL
                 END) AS "2018"
    FROM MonthlyOrders
    GROUP BY month_number, month_name
    ORDER BY month_number;
- metric_name: highest_monthly_delivered_orders_in_lowest_annual_year
  sql_logic: |-
    WITH DeliveredOrders AS
      (SELECT order_id,
              CAST(STRFTIME('%Y', order_delivered_customer_date) AS INTEGER) AS delivery_year, STRFTIME('%Y-%m',

                                                                                                 order_delivered_customer_date) AS delivery_month
       FROM olist_orders
       WHERE order_status = 'delivered'
         AND order_delivered_customer_date IS NOT NULL
         AND CAST(STRFTIME('%Y', order_delivered_customer_date) AS INTEGER) IN (2016, 2017,
                                                                                2018)),
         AnnualVolumes AS
      (SELECT delivery_year, COUNT(order_id) AS annual_volume
       FROM DeliveredOrders
       GROUP BY delivery_year),
         LowestVolumeYear AS
      (SELECT delivery_year
       FROM AnnualVolumes
       ORDER BY annual_volume ASC
       LIMIT 1),
         MonthlyVolumesInTargetYear AS
      (SELECT DO.delivery_month, COUNT(DO.order_id) AS monthly_volume
       FROM DeliveredOrders AS DO
       INNER JOIN LowestVolumeYear AS LVY ON DO.delivery_year = LVY.delivery_year
       GROUP BY DO.delivery_month)
    SELECT MAX(monthly_volume)
    FROM MonthlyVolumesInTargetYear;
- metric_name: average_most_preferred_payment_method_payments
  sql_logic: |-
    WITH OrderCategory AS
      (SELECT DISTINCT oi.order_id, p.product_category_name
       FROM olist_order_items AS oi
       INNER JOIN olist_products AS p ON oi.product_id = p.product_id
       WHERE p.product_category_name IS NOT NULL),
         CategoryPaymentData AS
      (SELECT oc.product_category_name, op.payment_type
       FROM OrderCategory AS oc
       INNER JOIN olist_order_payments AS op ON oc.order_id = op.order_id),
         CategoryPaymentCounts AS
      (SELECT product_category_name, payment_type, COUNT(*) AS payment_count
       FROM CategoryPaymentData
       GROUP BY product_category_name, payment_type),
         MaxPaymentCountsPerCategory AS
      (SELECT product_category_name, MAX(payment_count) AS max_payment_count
       FROM CategoryPaymentCounts
       GROUP BY product_category_name)
    SELECT AVG(max_payment_count)
    FROM MaxPaymentCountsPerCategory
- metric_name: Customers with Low Spending on Best Selling Artist
  sql_logic: |-
    WITH BestSellingArtist AS
      (SELECT T3.ArtistId
       FROM invoice_items AS T1
       JOIN tracks AS T2 ON T1.TrackId = T2.TrackId
       JOIN albums AS T3 ON T2.AlbumId = T3.AlbumId
       GROUP BY T3.ArtistId
       ORDER BY SUM(T1.UnitPrice * T1.Quantity) DESC
       LIMIT 1),
         CustomerSpending AS
      (SELECT T1.FirstName, SUM(T4.UnitPrice * T4.Quantity) AS AmountSpent
       FROM customers AS T1
       JOIN invoices AS T2 ON T1.CustomerId = T2.CustomerId
       JOIN invoice_items AS T4 ON T2.InvoiceId = T4.InvoiceId
       JOIN tracks AS T5 ON T4.TrackId = T5.TrackId
       JOIN albums AS T6 ON T5.AlbumId = T6.AlbumId
       JOIN artists AS T7 ON T6.ArtistId = T7.ArtistId
       WHERE T7.ArtistId =
           (SELECT ArtistId
            FROM BestSellingArtist)
       GROUP BY T1.CustomerId, T1.FirstName)
    SELECT FirstName, AmountSpent
    FROM CustomerSpending
    WHERE AmountSpent < 1;
- metric_name: median_total_sales_for_countries_with_many_customers
  sql_logic: |-
    WITH CountryCustomerCounts AS
      (SELECT Country
       FROM customers
       GROUP BY Country
       HAVING COUNT(DISTINCT CustomerId) > 4),
         CountryTotalSales AS
      (SELECT T2.Country, SUM(T1.Total) AS total_sales
       FROM invoices AS T1
       INNER JOIN customers AS T2 ON T1.CustomerId = T2.CustomerId
       GROUP BY T2.Country),
         FilteredCountrySales AS
      (SELECT T1.total_sales
       FROM CountryTotalSales AS T1
       INNER JOIN CountryCustomerCounts AS T2 ON T1.Country = T2.Country),
         RankedSales AS
      (SELECT total_sales,
              ROW_NUMBER() OVER (
                                 ORDER BY total_sales) AS rn, COUNT(*) OVER () AS total_count
       FROM FilteredCountrySales)
    SELECT AVG(total_sales) AS median_total_sales
    FROM RankedSales
    WHERE rn IN ((total_count + 1) / 2, (total_count + 2) / 2)
- metric_name: Monthly Total Payment Amount
  sql_logic: |-
    WITH monthly_payments AS
      (SELECT customer_id, STRFTIME('%Y-%m', payment_date) AS payment_month,
              SUM(amount) AS monthly_amount
       FROM payment
       GROUP BY customer_id, payment_month)
- metric_name: Monthly Payment Amount Change
  sql_logic: |-
    WITH monthly_changes AS
      (SELECT customer_id, payment_month,
              ABS(monthly_amount - LAG(monthly_amount) OVER (PARTITION BY customer_id
                                                             ORDER BY payment_month)) AS monthly_change
       FROM monthly_payments)
- metric_name: Average Monthly Payment Volatility
  sql_logic: |-
    WITH avg_monthly_volatility AS
      (SELECT customer_id, AVG(monthly_change) AS avg_change
       FROM monthly_changes
       GROUP BY customer_id)
- metric_name: Individual Sale Profit
  sql_logic: s.quantity_sold * (cst.unit_price - cst.unit_cost)
- metric_name: Customer Total Monthly Profit
  sql_logic: SUM(s.quantity_sold * (cst.unit_price - cst.unit_cost))
- metric_name: Profit Bucket Size
  sql_logic: |-
    CASE WHEN (MAX(total_monthly_profit) - MIN(total_monthly_profit)) = 0 THEN 1.0 ELSE (MAX(total_monthly_profit) - MIN(total_monthly_profit)) / 10.0
    END
- metric_name: Customer Profit Bucket Assignment
  sql_logic: |-
    CASE
        WHEN pri.bucket_size = 1.0
             AND (pri.max_overall_profit - pri.min_overall_profit) = 0 THEN 1 WHEN ctp.total_monthly_profit = pri.max_overall_profit THEN 10
        ELSE CAST((ctp.total_monthly_profit - pri.min_overall_profit) / pri.bucket_size AS INTEGER) + 1
    END
- metric_name: Number of Customers in Profit Bucket
  sql_logic: COUNT(DISTINCT cust_id)
- metric_name: Minimum Profit in Bucket
  sql_logic: MIN(total_monthly_profit)
- metric_name: Maximum Profit in Bucket
  sql_logic: MAX(total_monthly_profit)
- metric_name: average_unit_cost
  sql_logic: |-
    SELECT prod_id, time_id, promo_id, channel_id, AVG(unit_cost) AS avg_unit_cost
    FROM costs
    GROUP BY prod_id, time_id, promo_id, channel_id
- metric_name: filtered_sales_data_italy_dec_2021
  sql_logic: |-
    SELECT s.cust_id, s.prod_id, s.time_id, s.promo_id, s.channel_id, s.quantity_sold,
           s.amount_sold
    FROM sales AS s
    INNER JOIN customers AS c ON s.cust_id = c.cust_id
    INNER JOIN countries AS co ON c.country_id = co.country_id
    INNER JOIN times AS t ON s.time_id = t.time_id
    WHERE co.country_name = 'Italy'
      AND t.calendar_year = 2021
      AND t.calendar_month_number = 12
- metric_name: customer_sale_profit
  sql_logic: |-
    SELECT fsd.cust_id, (fsd.amount_sold - ac.avg_unit_cost * fsd.quantity_sold) AS sale_profit
    FROM FilteredSalesData AS fsd
    INNER JOIN AggregatedCosts AS ac ON fsd.prod_id = ac.prod_id
    AND fsd.time_id = ac.time_id
    AND fsd.promo_id = ac.promo_id
    AND fsd.channel_id = ac.channel_id
- metric_name: customer_total_profit
  sql_logic: |-
    SELECT cust_id, SUM(sale_profit) AS total_profit
    FROM CustomerSaleProfits
    GROUP BY cust_id
- metric_name: customer_profit_tier
  sql_logic: |-
    SELECT cust_id, total_profit,
           NTILE(10) OVER (
                           ORDER BY total_profit ASC) AS profit_tier
    FROM CustomerTotalProfits
- metric_name: tier_profit_summary
  sql_logic: |-
    SELECT profit_tier, MAX(total_profit) AS highest_profit_in_tier,
           MIN(total_profit) AS lowest_profit_in_tier
    FROM CustomerTiers
    GROUP BY profit_tier
    ORDER BY profit_tier
- metric_name: product_views
  sql_logic: |-
    COUNT(CASE WHEN event_type = 1 THEN 1
          END)
- metric_name: times_added_to_cart
  sql_logic: |-
    COUNT(CASE WHEN event_type = 2 THEN 1
          END)
- metric_name: actual_purchases
  sql_logic: |-
    WITH purchase_visits AS
      (SELECT DISTINCT visit_id
       FROM shopping_cart_events
       WHERE event_type = 3)
    SELECT COUNT(fpe.event_type)
    FROM filtered_product_events AS fpe
    INNER JOIN purchase_visits AS pv ON fpe.visit_id = pv.visit_id
    WHERE fpe.event_type = 2
- metric_name: left_in_cart
  sql_logic: times_added_to_cart - actual_purchases
- metric_name: customer_total_spending_1998
  sql_logic: |-
    WITH CustomerSpending1998 AS
      (SELECT o.customerid, SUM(od.unitprice * od.quantity) AS total_spending
       FROM orders AS o
       INNER JOIN order_details AS od ON o.orderid = od.orderid
       WHERE STRFTIME('%Y', o.orderdate) = '1998'
       GROUP BY o.customerid)
    SELECT customerid, total_spending
    FROM CustomerSpending1998
- metric_name: total_customers_1998
  sql_logic: |-
    WITH CustomerSpending1998 AS
      (SELECT o.customerid, SUM(od.unitprice * od.quantity) AS total_spending
       FROM orders AS o
       INNER JOIN order_details AS od ON o.orderid = od.orderid
       WHERE STRFTIME('%Y', o.orderdate) = '1998'
       GROUP BY o.customerid),
         TotalCustomers1998 AS
      (SELECT COUNT(DISTINCT customerid) AS total_customer_count
       FROM CustomerSpending1998)
    SELECT total_customer_count
    FROM TotalCustomers1998
- metric_name: customers_by_spending_group
  sql_logic: |-
    WITH CustomerSpending1998 AS
      (SELECT o.customerid, SUM(od.unitprice * od.quantity) AS total_spending
       FROM orders AS o
       INNER JOIN order_details AS od ON o.orderid = od.orderid
       WHERE STRFTIME('%Y', o.orderdate) = '1998'
       GROUP BY o.customerid),
         CustomersByGroup AS
      (SELECT cgt.groupname, cs.customerid
       FROM CustomerSpending1998 AS cs
       INNER JOIN customergroupthreshold AS cgt ON cs.total_spending BETWEEN cgt.rangebottom AND cgt.rangetop)
    SELECT groupname, customerid
    FROM CustomersByGroup
- metric_name: number_of_customers_per_group
  sql_logic: |-
    WITH CustomerSpending1998 AS
      (SELECT o.customerid, SUM(od.unitprice * od.quantity) AS total_spending
       FROM orders AS o
       INNER JOIN order_details AS od ON o.orderid = od.orderid
       WHERE STRFTIME('%Y', o.orderdate) = '1998'
       GROUP BY o.customerid),
         CustomersByGroup AS
      (SELECT cgt.groupname, cs.customerid
       FROM CustomerSpending1998 AS cs
       INNER JOIN customergroupthreshold AS cgt ON cs.total_spending BETWEEN cgt.rangebottom AND cgt.rangetop),
         GroupAggregates AS
      (SELECT groupname, COUNT(DISTINCT customerid) AS number_of_customers
       FROM CustomersByGroup
       GROUP BY groupname)
    SELECT groupname, number_of_customers
    FROM GroupAggregates
- metric_name: percentage_of_customers_per_group
  sql_logic: |-
    WITH CustomerSpending1998 AS
      (SELECT o.customerid, SUM(od.unitprice * od.quantity) AS total_spending
       FROM orders AS o
       INNER JOIN order_details AS od ON o.orderid = od.orderid
       WHERE STRFTIME('%Y', o.orderdate) = '1998'
       GROUP BY o.customerid),
         TotalCustomers1998 AS
      (SELECT COUNT(DISTINCT customerid) AS total_customer_count
       FROM CustomerSpending1998),
         CustomersByGroup AS
      (SELECT cgt.groupname, cs.customerid
       FROM CustomerSpending1998 AS cs
       INNER JOIN customergroupthreshold AS cgt ON cs.total_spending BETWEEN cgt.rangebottom AND cgt.rangetop),
         GroupAggregates AS
      (SELECT groupname, COUNT(DISTINCT customerid) AS number_of_customers
       FROM CustomersByGroup
       GROUP BY groupname)
    SELECT ga.groupname,
           (ga.number_of_customers * 1.0 / tc.total_customer_count) * 100.0 AS percentage_of_customers
    FROM GroupAggregates AS ga
    CROSS JOIN TotalCustomers1998 AS tc
- metric_name: customer_first_purchase_date
  sql_logic: |-
    WITH first_purchase_dates AS
      (SELECT customer_id, payment_date AS first_purchase_date,
              ROW_NUMBER() OVER (PARTITION BY customer_id
                                 ORDER BY payment_date ASC) AS rn
       FROM payment)
    SELECT customer_id, first_purchase_date
    FROM first_purchase_dates
    WHERE rn = 1
- metric_name: customer_lifetime_value_components
  sql_logic: |-
    WITH first_purchase_dates AS
      (SELECT customer_id, payment_date AS first_purchase_date,
              ROW_NUMBER() OVER (PARTITION BY customer_id
                                 ORDER BY payment_date ASC) AS rn
       FROM payment),
         customer_ltv_components AS
      (SELECT p.customer_id, SUM(p.amount) AS total_ltv,
              SUM(CASE
                      WHEN p.payment_date <= DATETIME(fp.first_purchase_date,
                                               '+7 day') THEN p.amount ELSE 0
                  END) AS ltv_7_days,
              SUM(CASE
                      WHEN p.payment_date <= DATETIME(fp.first_purchase_date,
                                               '+30 day') THEN p.amount ELSE 0
                  END) AS ltv_30_days
       FROM payment AS p
       INNER JOIN first_purchase_dates AS fp ON p.customer_id = fp.customer_id
       WHERE fp.rn = 1
       GROUP BY p.customer_id)
    SELECT customer_id, total_ltv, ltv_7_days, ltv_30_days
    FROM customer_ltv_components
- metric_name: customer_ltv_percentages
  sql_logic: |-
    WITH first_purchase_dates AS
      (SELECT customer_id, payment_date AS first_purchase_date,
              ROW_NUMBER() OVER (PARTITION BY customer_id
                                 ORDER BY payment_date ASC) AS rn
       FROM payment),
         customer_ltv_components AS
      (SELECT p.customer_id, SUM(p.amount) AS total_ltv,
              SUM(CASE
                      WHEN p.payment_date <= DATETIME(fp.first_purchase_date,
                                               '+7 day') THEN p.amount ELSE 0
                  END) AS ltv_7_days,
              SUM(CASE
                      WHEN p.payment_date <= DATETIME(fp.first_purchase_date,
                                               '+30 day') THEN p.amount ELSE 0
                  END) AS ltv_30_days
       FROM payment AS p
       INNER JOIN first_purchase_dates AS fp ON p.customer_id = fp.customer_id
       WHERE fp.rn = 1
       GROUP BY p.customer_id),
         customer_ltv_percentages AS
      (SELECT customer_id, total_ltv, (ltv_7_days * 100.0 / total_ltv) AS pct_ltv_7_days,
              (ltv_30_days * 100.0 / total_ltv) AS pct_ltv_30_days
       FROM customer_ltv_components
       WHERE total_ltv > 0)
    SELECT customer_id, total_ltv, pct_ltv_7_days, pct_ltv_30_days
    FROM customer_ltv_percentages
- metric_name: average_customer_ltv_metrics
  sql_logic: |-
    WITH first_purchase_dates AS
      (SELECT customer_id, payment_date AS first_purchase_date,
              ROW_NUMBER() OVER (PARTITION BY customer_id
                                 ORDER BY payment_date ASC) AS rn
       FROM payment),
         customer_ltv_components AS
      (SELECT p.customer_id, SUM(p.amount) AS total_ltv,
              SUM(CASE
                      WHEN p.payment_date <= DATETIME(fp.first_purchase_date,
                                               '+7 day') THEN p.amount ELSE 0
                  END) AS ltv_7_days,
              SUM(CASE
                      WHEN p.payment_date <= DATETIME(fp.first_purchase_date,
                                               '+30 day') THEN p.amount ELSE 0
                  END) AS ltv_30_days
       FROM payment AS p
       INNER JOIN first_purchase_dates AS fp ON p.customer_id = fp.customer_id
       WHERE fp.rn = 1
       GROUP BY p.customer_id),
         customer_ltv_percentages AS
      (SELECT customer_id, total_ltv, (ltv_7_days * 100.0 / total_ltv) AS pct_ltv_7_days,
              (ltv_30_days * 100.0 / total_ltv) AS pct_ltv_30_days
       FROM customer_ltv_components
       WHERE total_ltv > 0)
    SELECT AVG(total_ltv) AS average_total_ltv, AVG(pct_ltv_7_days) AS average_pct_ltv_7_days,
           AVG(pct_ltv_30_days) AS average_pct_ltv_30_days
    FROM customer_ltv_percentages
- metric_name: Customer Rental Film Rating Details
  sql_logic: |-
    WITH customer_first_rental_film_rating_cte AS
      (SELECT p.customer_id, p.payment_date, f.rating
       FROM payment AS p
       INNER JOIN rental AS r ON p.rental_id = r.rental_id
       INNER JOIN inventory AS i ON r.inventory_id = i.inventory_id
       INNER JOIN film AS f ON i.film_id = f.film_id)
- metric_name: Ranked Customer Payments by Date
  sql_logic: |-
    WITH ranked_customer_payments_cte AS
      (SELECT customer_id, payment_date, rating,
              ROW_NUMBER() OVER (PARTITION BY customer_id
                                 ORDER BY payment_date ASC) AS rn
       FROM customer_first_rental_film_rating_cte)
- metric_name: First Rental Rating for Each Customer
  sql_logic: |-
    WITH first_rental_rating_per_customer_cte AS
      (SELECT customer_id, rating AS first_rental_rating
       FROM ranked_customer_payments_cte
       WHERE rn = 1)
- metric_name: Total Amount Spent and Rental Count per Customer
  sql_logic: |-
    WITH customer_total_metrics_cte AS
      (SELECT customer_id, SUM(amount) AS total_amount_spent, COUNT(rental_id) AS total_rentals
       FROM payment
       GROUP BY customer_id)
- metric_name: Combined Customer Metrics with First Rental Rating
  sql_logic: |-
    WITH customer_final_metrics_cte AS
      (SELECT fr.first_rental_rating, ctm.total_amount_spent, ctm.total_rentals - 1 AS subsequent_rentals
       FROM first_rental_rating_per_customer_cte AS fr
       INNER JOIN customer_total_metrics_cte AS ctm ON fr.customer_id = ctm.customer_id)
- metric_name: Average Customer Metrics by First Rental Film Rating
  sql_logic: |-
    SELECT first_rental_rating, AVG(total_amount_spent) AS average_total_amount_spent_per_customer,
           AVG(subsequent_rentals) AS average_number_of_subsequent_rentals
    FROM customer_final_metrics_cte
    GROUP BY first_rental_rating
- metric_name: Total Customer Payment Amount
  sql_logic: |-
    SELECT customer_id, SUM(amount) AS total_payment_amount
    FROM payment
    GROUP BY customer_id
- metric_name: Top 10 Customers by Total Payment
  sql_logic: |-
    WITH CustomerTotalPayments AS
      (SELECT customer_id, SUM(amount) AS total_payment_amount
       FROM payment
       GROUP BY customer_id)
    SELECT customer_id
    FROM
      (SELECT customer_id, total_payment_amount,
              DENSE_RANK() OVER (
                                 ORDER BY total_payment_amount DESC) AS customer_rank
       FROM CustomerTotalPayments)
    WHERE customer_rank <= 10
- metric_name: Monthly Payment for Top Customers
  sql_logic: |-
    SELECT t10.customer_id,
           STRFTIME('%Y-%m-01', p.payment_date) AS payment_month, SUM(p.amount) AS total_monthly_payment
    FROM Top10Customers AS t10
    INNER JOIN payment AS p ON t10.customer_id = p.customer_id
    GROUP BY t10.customer_id, payment_month
- metric_name: Month-over-Month Payment Difference
  sql_logic: |-
    SELECT customer_id, payment_month, total_monthly_payment,
           LAG(total_monthly_payment, 1, 0) OVER (PARTITION BY customer_id
                                                  ORDER BY payment_month) AS previous_month_payment,
           ABS(total_monthly_payment - LAG(total_monthly_payment,
                                         1, 0) OVER (PARTITION BY customer_id
                                                     ORDER BY payment_month)) AS month_over_month_diff
    FROM MonthlyPaymentsForTopCustomers
- metric_name: Maximum Month-over-Month Difference
  sql_logic: |-
    SELECT MAX(month_over_month_diff)
    FROM MonthOverMonthDifferences
- metric_name: Customer and Month of Largest MoM Difference
  sql_logic: |-
    SELECT c.first_name, c.last_name,
           STRFTIME('%Y-%m', mod.payment_month) AS month_of_change, ROUND(mod.month_over_month_diff,
                                                                      2) AS largest_change
    FROM MonthOverMonthDifferences AS MOD
    INNER JOIN MaxDifference AS md ON mod.month_over_month_diff = md.max_diff
    INNER JOIN customer AS c ON mod.customer_id = c.customer_id
    ORDER BY largest_change DESC, month_of_change
    LIMIT 1
- metric_name: percentage_change_in_sales_around_mid_june
  sql_logic: |-
    WITH MidJuneWeek AS
      (SELECT DISTINCT calendar_year, week_number AS mid_june_week
       FROM cleaned_weekly_sales
       WHERE (calendar_year || '-06-15') BETWEEN week_date AND date(week_date,
                                                                 '+6 days')),
         SalesPeriods AS
      (SELECT cws.calendar_year, cws.sales,
              CASE
                  WHEN cws.week_number BETWEEN mjw.mid_june_week - 4 AND mjw.mid_june_week - 1 THEN 'Before'
                  WHEN cws.week_number BETWEEN mjw.mid_june_week + 1 AND mjw.mid_june_week + 4 THEN 'After'
              END AS period
       FROM cleaned_weekly_sales AS cws
       INNER JOIN MidJuneWeek AS mjw ON cws.calendar_year = mjw.calendar_year
       WHERE cws.calendar_year IN (2018, 2019, 2020)
         AND period IS NOT NULL),
         AggregatedSales AS
      (SELECT calendar_year,
              SUM(CASE WHEN period = 'Before' THEN sales ELSE 0
                  END) AS before_sales,
              SUM(CASE WHEN period = 'After' THEN sales ELSE 0
                  END) AS after_sales
       FROM SalesPeriods
       GROUP BY calendar_year)
    SELECT calendar_year, before_sales, after_sales,
           (CAST(after_sales AS REAL) - before_sales) * 100.0 / NULLIF(before_sales,
                                                                  0) AS percentage_change
    FROM AggregatedSales
    ORDER BY calendar_year;
- metric_name: average_sales_percentage_change_by_attribute_type
  sql_logic: |-
    WITH SalesByAttributeValue AS
      (SELECT 'region' AS attribute_type, region AS attribute_value,
              SUM(CASE
                      WHEN week_date >= DATE('2020-06-15',
                                          '-84 days')
                           AND week_date < '2020-06-15' THEN sales ELSE 0
                  END) AS sales_before,
              SUM(CASE
                      WHEN week_date >= '2020-06-15'
                           AND week_date < DATE('2020-06-15',
                                             '+84 days') THEN sales ELSE 0
                  END) AS sales_after
       FROM cleaned_weekly_sales
       GROUP BY region
       UNION ALL SELECT 'platform' AS attribute_type, platform AS attribute_value,
                        SUM(CASE
                                WHEN week_date >= DATE('2020-06-15',
                                                    '-84 days')
                                     AND week_date < '2020-06-15' THEN sales ELSE 0
                            END) AS sales_before,
                        SUM(CASE
                                WHEN week_date >= '2020-06-15'
                                     AND week_date < DATE('2020-06-15',
                                                       '+84 days') THEN sales ELSE 0
                            END) AS sales_after
       FROM cleaned_weekly_sales
       GROUP BY platform
       UNION ALL SELECT 'age_band' AS attribute_type, age_band AS attribute_value,
                        SUM(CASE
                                WHEN week_date >= DATE('2020-06-15',
                                                    '-84 days')
                                     AND week_date < '2020-06-15' THEN sales ELSE 0
                            END) AS sales_before,
                        SUM(CASE
                                WHEN week_date >= '2020-06-15'
                                     AND week_date < DATE('2020-06-15',
                                                       '+84 days') THEN sales ELSE 0
                            END) AS sales_after
       FROM cleaned_weekly_sales
       GROUP BY age_band
       UNION ALL SELECT 'demographic' AS attribute_type, demographic AS attribute_value,
                        SUM(CASE
                                WHEN week_date >= DATE('2020-06-15',
                                                    '-84 days')
                                     AND week_date < '2020-06-15' THEN sales ELSE 0
                            END) AS sales_before,
                        SUM(CASE
                                WHEN week_date >= '2020-06-15'
                                     AND week_date < DATE('2020-06-15',
                                                       '+84 days') THEN sales ELSE 0
                            END) AS sales_after
       FROM cleaned_weekly_sales
       GROUP BY demographic
       UNION ALL SELECT 'customer_type' AS attribute_type, customer_type AS attribute_value,
                        SUM(CASE
                                WHEN week_date >= DATE('2020-06-15',
                                                    '-84 days')
                                     AND week_date < '2020-06-15' THEN sales ELSE 0
                            END) AS sales_before,
                        SUM(CASE
                                WHEN week_date >= '2020-06-15'
                                     AND week_date < DATE('2020-06-15',
                                                       '+84 days') THEN sales ELSE 0
                            END) AS sales_after
       FROM cleaned_weekly_sales
       GROUP BY customer_type),
         PercentageChangeByAttributeValue AS
      (SELECT attribute_type, attribute_value,
              (sales_after - sales_before) * 100.0 / NULLIF(sales_before,
                                                       0) AS percentage_change
       FROM SalesByAttributeValue),
         AveragePercentageChangeByAttributeType AS
      (SELECT attribute_type, AVG(percentage_change) AS avg_percentage_change
       FROM PercentageChangeByAttributeValue
       GROUP BY attribute_type)
    SELECT attribute_type, avg_percentage_change
    FROM AveragePercentageChangeByAttributeType
    ORDER BY avg_percentage_change ASC
    LIMIT 1
- metric_name: total_unique_landing_exit_sessions_per_page
  sql_logic: |-
    WITH session_page_ranks AS
      (SELECT SESSION, PATH,
              ROW_NUMBER() OVER (PARTITION BY SESSION
                                 ORDER BY stamp ASC) AS rn_asc,
              ROW_NUMBER() OVER (PARTITION BY SESSION
                                 ORDER BY stamp DESC) AS rn_desc
       FROM activity_log),
         landing_exit_pages AS
      (SELECT DISTINCT SESSION, PATH
       FROM session_page_ranks
       WHERE rn_asc = 1
         OR rn_desc = 1)
    SELECT PATH, COUNT(DISTINCT SESSION) AS total_unique_sessions
    FROM landing_exit_pages
    GROUP BY PATH
    ORDER BY PATH
- metric_name: top_product_categories_by_most_common_payment_type
  sql_logic: |-
    WITH OrderCategory AS
      (SELECT DISTINCT oi.order_id, p.product_category_name
       FROM olist_order_items AS oi
       INNER JOIN olist_products AS p ON oi.product_id = p.product_id
       WHERE p.product_category_name IS NOT NULL),
         CategoryPaymentData AS
      (SELECT oc.product_category_name, op.payment_type
       FROM OrderCategory AS oc
       INNER JOIN olist_order_payments AS op ON oc.order_id = op.order_id),
         CategoryPaymentCounts AS
      (SELECT product_category_name, payment_type, COUNT(*) AS payments_count
       FROM CategoryPaymentData
       GROUP BY product_category_name, payment_type),
         RankedPaymentTypes AS
      (SELECT product_category_name, payments_count,
              ROW_NUMBER() OVER (PARTITION BY product_category_name
                                 ORDER BY payments_count DESC) AS rnk
       FROM CategoryPaymentCounts)
    SELECT product_category_name, payments_count AS payments_count_for_most_common_type
    FROM RankedPaymentTypes
    WHERE rnk = 1
    ORDER BY payments_count_for_most_common_type DESC
    LIMIT 3;
- metric_name: Total City Sales
  sql_logic: SUM(T1.amount_sold)
- metric_name: City Sales Growth Rate (Q4 2019 to Q4 2020)
  sql_logic: |-
    SUM(CASE WHEN calendar_quarter_id = 1776 THEN total_city_sales ELSE 0
        END) * 1.0 / NULLIF(SUM(CASE
                                    WHEN calendar_quarter_id = 1772 THEN total_city_sales ELSE 0
                                END), 0)
- metric_name: Total Product Sales (Filtered by Growing Cities)
  sql_logic: SUM(T1.amount_sold)
- metric_name: Product Sales Rank (Overall Filtered Sales)
  sql_logic: |-
    DENSE_RANK() OVER (
                       ORDER BY total_product_sales_overall DESC)
- metric_name: Product Quarterly Sales (Filtered by Growing Cities)
  sql_logic: SUM(T1.amount_sold)
- metric_name: Total Quarterly Sales (All Products, Filtered)
  sql_logic: |-
    SUM(SUM(T1.amount_sold)) OVER (PARTITION BY T1.calendar_quarter_id)
- metric_name: Product Share of Total Quarterly Sales
  sql_logic: |-
