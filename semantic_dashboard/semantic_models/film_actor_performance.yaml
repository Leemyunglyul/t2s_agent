biz_logic:
- metric_name: Most Frequent Actor in Specific Film Criteria
  sql_logic: |-
    WITH FilteredFilms AS
      (SELECT T1.film_id
       FROM film AS T1
       INNER JOIN LANGUAGE AS T2 ON T1.language_id = T2.language_id
       INNER JOIN film_category AS T3 ON T1.film_id = T3.film_id
       INNER JOIN category AS T4 ON T3.category_id = T4.category_id
       WHERE T2.name = 'English'
         AND T4.name = 'Children'
         AND T1.rating IN ('G', 'PG')
         AND T1.length <= 120
         AND T1.release_year BETWEEN '2000' AND '2010'),
         ActorFilmCounts AS
      (SELECT T1.actor_id, T1.first_name, T1.last_name, COUNT(DISTINCT T2.film_id) AS film_count
       FROM actor AS T1
       INNER JOIN film_actor AS T2 ON T1.actor_id = T2.actor_id
       INNER JOIN FilteredFilms AS T3 ON T2.film_id = T3.film_id
       GROUP BY T1.actor_id, T1.first_name, T1.last_name),
         RankedActors AS
      (SELECT actor_id, first_name, last_name, film_count,
              DENSE_RANK() OVER (
                                 ORDER BY film_count DESC) AS actor_rank
       FROM ActorFilmCounts)
    SELECT first_name || ' ' || last_name
    FROM RankedActors
    WHERE actor_rank = 1
- metric_name: |-
    Count of actors who made more films with Yash Chopra than with any other director
  sql_logic: |-
    WITH CTE_YashChopraPID AS
      (SELECT PID
       FROM Person
       WHERE Name = ' Yash Chopra'),
         CTE_ActorYashChopraFilms AS
      (SELECT MC.PID AS ActorPID, COUNT(DISTINCT MC.MID) AS FilmCount
       FROM M_Cast AS MC
       INNER JOIN M_Director AS MD ON MC.MID = MD.MID
       INNER JOIN CTE_YashChopraPID AS YC_PID ON MD.PID = YC_PID.PID
       GROUP BY MC.PID),
         CTE_ActorOtherDirectorFilms AS
      (SELECT MC.PID AS ActorPID, MD.PID AS OtherDirectorPID, COUNT(DISTINCT MC.MID) AS FilmCount
       FROM M_Cast AS MC
       INNER JOIN M_Director AS MD ON MC.MID = MD.MID
       INNER JOIN CTE_YashChopraPID AS YC_PID ON MD.PID <> YC_PID.PID
       GROUP BY MC.PID, MD.PID),
         CTE_ActorMaxOtherDirectorFilms AS
      (SELECT ActorPID, MAX(FilmCount) AS MaxOtherFilmCount
       FROM CTE_ActorOtherDirectorFilms
       GROUP BY ActorPID),
         CTE_ActorsMeetingCriteria AS
      (SELECT YC.ActorPID
       FROM CTE_ActorYashChopraFilms AS YC
       LEFT JOIN CTE_ActorMaxOtherDirectorFilms AS OM ON YC.ActorPID = OM.ActorPID
       WHERE YC.FilmCount > OM.MaxOtherFilmCount
         OR OM.MaxOtherFilmCount IS NULL)
    SELECT COUNT(DISTINCT ActorPID)
    FROM CTE_ActorsMeetingCriteria;
- metric_name: percentage_of_customers_renting_from_top_actors
  sql_logic: |-
    WITH ActorRentalCounts AS
      (SELECT a.actor_id, a.first_name, a.last_name, COUNT(r.rental_id) AS rental_count
       FROM actor AS a
       INNER JOIN film_actor AS fa ON a.actor_id = fa.actor_id
       INNER JOIN film AS f ON fa.film_id = f.film_id
       INNER JOIN inventory AS i ON f.film_id = i.film_id
       INNER JOIN rental AS r ON i.inventory_id = r.inventory_id
       GROUP BY a.actor_id, a.first_name, a.last_name),
         RankedActors AS
      (SELECT actor_id, first_name, last_name, rental_count,
              DENSE_RANK() OVER (
                                 ORDER BY rental_count DESC) AS actor_rank
       FROM ActorRentalCounts),
         Top5Actors AS
      (SELECT actor_id
       FROM RankedActors
       WHERE actor_rank <= 5),
         CustomersRentingFromTopActors AS
      (SELECT DISTINCT r.customer_id
       FROM rental AS r
       INNER JOIN inventory AS i ON r.inventory_id = i.inventory_id
       INNER JOIN film AS f ON i.film_id = f.film_id
       INNER JOIN film_actor AS fa ON f.film_id = fa.film_id
       WHERE fa.actor_id IN
           (SELECT actor_id
            FROM Top5Actors)),
         TotalCustomerCount AS
      (SELECT COUNT(DISTINCT customer_id) AS total_customers
       FROM customer)
    SELECT (CAST(COUNT(DISTINCT crfta.customer_id) AS DECIMAL) * 100.0) / tcc.total_customers AS percentage_of_customers_renting_from_top_actors
    FROM CustomersRentingFromTopActors AS crfta
    CROSS JOIN TotalCustomerCount AS tcc;
