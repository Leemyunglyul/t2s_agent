descriptions:
- table: pizza_names
  column: pizza_id
  meaning: Unique identifier for a type of pizza.
- table: pizza_names
  column: pizza_name
  meaning: The name of the pizza type.
- table: pizza_customer_orders
  column: order_id
  meaning: Unique identifier for a customer's order.
- table: pizza_customer_orders
  column: customer_id
  meaning: Unique identifier for the customer who placed the order.
- table: pizza_customer_orders
  column: pizza_id
  meaning: |-
    Identifier for the specific pizza type ordered by the customer.
- table: pizza_customer_orders
  column: exclusions
  meaning: |-
    A comma-separated string of topping IDs that the customer wishes to exclude from their pizza.
- table: pizza_customer_orders
  column: extras
  meaning: |-
    A comma-separated string of topping IDs that the customer wishes to add as extra toppings to their pizza.
- table: pizza_customer_orders
  column: order_time
  meaning: The timestamp when the customer's order was placed.
- table: pizza_toppings
  column: topping_id
  meaning: Unique identifier for a specific pizza topping.
- table: pizza_toppings
  column: topping_name
  meaning: The name of the pizza topping.
- table: pizza_recipes
  column: pizza_id
  meaning: |-
    Identifier for the pizza type, linking to its standard recipe.
- table: pizza_recipes
  column: toppings
  meaning: |-
    A comma-separated string of topping IDs that constitute the standard recipe for a pizza type.
- table: pizza_clean_runner_orders
  column: order_id
  meaning: |-
    Unique identifier for a customer's pizza order, as handled by a runner.
- table: pizza_clean_runner_orders
  column: runner_id
  meaning: |-
    Unique identifier for the delivery runner assigned to the order.
- table: pizza_clean_runner_orders
  column: pickup_time
  meaning: The timestamp when the runner picked up the order.
- table: pizza_clean_runner_orders
  column: distance
  meaning: The distance covered by the runner for the delivery.
- table: pizza_clean_runner_orders
  column: duration
  meaning: The duration of the delivery by the runner.
- table: pizza_clean_runner_orders
  column: cancellation
  meaning: |-
    Indicates if the order was cancelled by the runner or customer. NULL means the order was successfully delivered.
- table: pizza_clean_customer_orders
  column: order_id
  meaning: Cleaned unique identifier for a customer's pizza order.
- table: pizza_clean_customer_orders
  column: customer_id
  meaning: |-
    Cleaned unique identifier for the customer who placed the order.
- table: pizza_clean_customer_orders
  column: pizza_id
  meaning: |-
    Cleaned identifier for the pizza type ordered by the customer.
- table: pizza_clean_customer_orders
  column: exclusions
  meaning: |-
    Cleaned comma-separated string of topping IDs excluded by the customer.
- table: pizza_clean_customer_orders
  column: extras
  meaning: |-
    Cleaned comma-separated string of topping IDs added as extras by the customer.
- table: pizza_clean_customer_orders
  column: order_time
  meaning: Cleaned timestamp when the order was placed.
- table: pizza_runners
  column: runner_id
  meaning: Unique identifier for a pizza delivery runner.
- table: pizza_runners
  column: registration_date
  meaning: The date when the runner registered.
- table: pizza_get_extras
  column: order_id
  meaning: |-
    Foreign key linking to 'pizza_clean_customer_orders', identifying the order to which extras were added.
- table: pizza_get_extras
  column: extras_count
  meaning: The number of extra toppings added to a specific order item.
