domain: legislation
description:
  Semantic model for analyzing legislator personal details, terms, cohorts, and retention rates.
  [CRITICAL RULE FOR ALL QUERIES] ZERO-FILLING FOR CONTINUOUS RANGES.
  When a task asks to group results over a continuous sequence of years or elapsed times (e.g., "from 30 up to 50 years"),
  you MUST output EVERY single year in that range. If there are no legislators for a specific year, you MUST output a count of 0.
  To achieve this, generate a complete sequence of the requested years using a Recursive CTE, and then use a `LEFT JOIN` against your data.

tables:
  - name: legislators
    description: "Personal information of legislators"
    columns:
      - name: id_bioguide
        logical_name: "의원ID"
        primary_key: true
      - name: gender
        logical_name: "성별"
        sample_values: ["M", "F"]
      - name: full_name
        logical_name: "성명"

  - name: legislators_terms
    description: "Information about terms served by legislators (Core: Start/End Date)"
    columns:
      - name: id_bioguide
        logical_name: "의원ID"
      - name: term_start
        logical_name: "임기시작일"
        type: DATE
      - name: term_end
        logical_name: "임기종료일"
        type: DATE
      - name: state
        logical_name: "주(State)"
        description: "The state the legislator represents (e.g., LA, CA)"

metrics:
  - name: is_active_on_date
    table: legislators_terms
    description: "Logic to determine if a legislator is serving on a specific target_date"
    formula: "target_date BETWEEN term_start AND term_end"

  - name: first_term_start
    table: legislators_terms
    description: "The historical first term start date for a specific legislator (Used for cohort analysis)"
    formula: "MIN(term_start) OVER (PARTITION BY id_bioguide)"

  - name: retention_proportion
    description: >
      When a task asks for a "Proportion" or "Rate" (e.g., retention rate), 
      NEVER multiply the result by 100 to make it a percentage. 
      The result MUST ALWAYS be a decimal value between 0.0 and 1.0.

  - name: active_on_december_31
    description: >
      When checking if someone was actively serving on December 31st of a specific year, 
      DO NOT just extract and compare the Year. This will incorrectly include people whose term ended in the middle of that year.
      You MUST construct the exact 'YYYY-12-31' date string and compare full dates: 
      term_start <= 'YYYY-12-31' AND term_end >= 'YYYY-12-31'

relationships:
  - from: legislators
    to: legislators_terms
    join_condition: "legislators.id_bioguide = legislators_terms.id_bioguide"
    type: one_to_many
    description: "One legislator can have multiple terms."
