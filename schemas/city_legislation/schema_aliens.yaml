domain: aliens
description: >
  Semantic model for analyzing alien species, traits, and locations.

tables:
  - name: alien_data
    description: "Detailed information table for aliens (Integrated table)."
    columns:
      - name: id
        logical_name: "외계인ID"
        primary_key: true
      - name: type
        logical_name: "종족"
      - name: gender
        logical_name: "성별"
      - name: age
        logical_name: "나이"
      - name: aggressive
        logical_name: "공격성향"
        description: "1: Hostile, 0: Friendly"
      - name: state
        logical_name: "거주주"

metrics:
  - name: friendly_vs_hostile_ratio
    logical_name: "우호_적대_비율"
    table: alien_data
    description: "Calculates the ratio of friendly aliens to hostile aliens."
    formula: "SUM(CASE WHEN aggressive=0 THEN 1 END) / NULLIF(SUM(CASE WHEN aggressive=1 THEN 1 END), 0)"
