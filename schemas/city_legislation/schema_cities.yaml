domain: cities_geography
description: 
  Semantic model for city geography and data entry logs (used for Streak analysis).
  PROPORTION VS PERCENTAGE. If a task asks for a "proportion" or "ratio", 
  NEVER multiply the result by 100. The result MUST ALWAYS be a decimal value between 0.0 and 1.0.

tables:
  - name: cities
    description: "Global city data entry logs (used for analyzing consecutive date streaks)"
    columns:
      - name: city_id
        logical_name: "도시ID"
        primary_key: true
      - name: city_name
        logical_name: "도시명"
      - name: country_code_2
        logical_name: "국가코드"
      - name: capital
        logical_name: "수도여부"
        description: "1: Capital city, 0: Normal city"
      - name: insert_date
        logical_name: "입력일자"
        type: DATE
        description: >
          - name: insert_date
        logical_name: "입력일자"
        type: DATE
        description: >
          1. Streak Calculation Rule: When calculating the "Streak of consecutive dates", be aware that multiple cities in a specific country can be inserted on the exact same day. Therefore, you MUST NEVER use `PARTITION BY city_name` when writing the Gaps-and-Islands query to calculate the streak. You MUST group the streak purely based on the consecutive date differences of DISTINCT `insert_date` values.
          2. One City Per Date Rule: If the task asks to "return exactly one record per date" and there are multiple cities for the same date, you MUST use `ROW_NUMBER() OVER (PARTITION BY insert_date ORDER BY city_name)` and filter `WHERE rn = 1` to pick ONLY ONE city per date. Do not return multiple cities for a single date.

  - name: cities_countries
    description: "Detailed country information"
    columns:
      - name: country_code_2
        logical_name: "국가코드"
        primary_key: true
      - name: country_name
        logical_name: "국가명"
      - name: region
        logical_name: "대륙"

metrics:
  - name: streak_group_id
    logical_name: "연속날짜_그룹ID"
    table: cities
    description: "Grouping key to identify consecutive dates (Streak) using the Gaps-and-Islands approach."
    formula: "DATE(insert_date) - INTERVAL ROW_NUMBER() OVER (PARTITION BY country_code_2 ORDER BY insert_date) DAY"

  - name: running_total_cities
    logical_name: "도시_누적합계"
    table: cities
    formula: "SUM(COUNT(city_id)) OVER (PARTITION BY STRFTIME('%m', insert_date) ORDER BY STRFTIME('%Y', insert_date))"

relationships:
  - from: cities
    to: cities_countries
    join_condition: "cities.country_code_2 = cities_countries.country_code_2"
    type: many_to_one
    description: "Many cities belong to one country."
