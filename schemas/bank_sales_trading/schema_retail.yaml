domain: retail
description: >
  Semantic model for vegetable sales, wholesale costs, loss rates, and weekly sales performance.
  [GLOBAL CRITICAL RULE]: PROPORTION VS PERCENTAGE. If a task asks for a "proportion" or "ratio", 
  NEVER multiply the result by 100. The result MUST ALWAYS be a decimal value between 0.0 and 1.0.
  [CRITICAL SQL RULE]: COLUMN NAME QUOTING. Tables in this domain contain columns with special characters (e.g., `qty_sold(kg)`, `loss_rate_%`, `whsle_px_rmb-kg`, `unit_selling_px_rmb/kg`). You MUST ALWAYS enclose these specific column names in double quotes (`""`) in your SQL queries to prevent syntax errors.

tables:
  - name: veg_cat
    description: "Vegetable item category master."
    columns:
      - name: item_code
        logical_name: "품목코드"
        primary_key: true
      - name: category_name
        logical_name: "카테고리명"

  - name: veg_loss_rate_df
    description: "Loss rate information by item code."
    columns:
      - name: item_code
        logical_name: "품목코드"
      - name: "loss_rate_%"
        logical_name: "손실률"
        description: 'Loss percentage occurring during distribution (%). MUST use double quotes: "loss_rate_%"'

  - name: veg_whsle_df
    description: "Daily wholesale price (Cost)."
    columns:
      - name: whsle_date
        logical_name: "도매일자"
      - name: item_code
        logical_name: "품목코드"
      - name: "whsle_px_rmb-kg"
        logical_name: "도매단가_kg"
        description: 'Wholesale price per kg (Cost). MUST use double quotes: "whsle_px_rmb-kg"'

  - name: veg_txn_df
    description: "Daily sales transactions (Revenue)."
    columns:
      - name: txn_date
        logical_name: "판매일자"
      - name: item_code
        logical_name: "품목코드"
      - name: "qty_sold(kg)"
        logical_name: "판매량_kg"
        description: 'Quantity sold in kg. MUST use double quotes: "qty_sold(kg)"'
      - name: "unit_selling_px_rmb/kg"
        logical_name: "판매단가_kg"
        description: 'Consumer selling price per kg. MUST use double quotes: "unit_selling_px_rmb/kg"'

  - name: cleaned_weekly_sales
    description: "Cleaned weekly sales data."
    columns:
      - name: week_date
        logical_name: "주간날짜"
        type: DATE
      - name: region
        logical_name: "지역"
      - name: platform
        logical_name: "플랫폼"
      - name: segment
        logical_name: "세그먼트"
      - name: age_band
        logical_name: "연령대"
        description: "Customer age group (e.g., Young Adults, Retirees)"
      - name: demographic
        logical_name: "인구통계"
        description: "Household type demographic (e.g., Couples, Families)"
      - name: customer_type
        logical_name: "고객유형"
        description: "New / Existing / Guest"
      - name: sales
        logical_name: "매출액"
      - name: week_number
        logical_name: "주차"
        type: INTEGER
      - name: calendar_year
        logical_name: "연도"
        type: INTEGER

metrics:
  - name: profit
    logical_name: "이익"
    description: >
      Financial Profit Calculation: When calculating the total "profit", you MUST account for the loss. 
      The formula is: (Total Selling Price) - (Total Wholesale Cost) - (Total Loss Amount). 
      Do NOT just subtract the wholesale price from the selling price without subtracting the financial loss caused by the loss rate.

  - name: profit_per_kg
    logical_name: "kg당_이익"
    description: "Margin calculated by subtracting wholesale price from selling price."
    table: veg_txn_df
    formula: '"unit_selling_px_rmb/kg" - "whsle_px_rmb-kg"'

  - name: total_loss_amount
    logical_name: "총손실액"
    description: "Wholesale price * Quantity sold * Loss rate."
    table: veg_txn_df
    formula: '"whsle_px_rmb-kg" * "qty_sold(kg)" * ("loss_rate_%" / 100.0)'

  - name: sales_growth_rate
    logical_name: "매출성장률"
    description: "Revenue change rate compared to a specific period."
    table: cleaned_weekly_sales
    formula: "(current_sales - previous_sales) / previous_sales * 100"

relationships:
  - from: veg_txn_df
    to: veg_cat
    join_condition: "veg_txn_df.item_code = veg_cat.item_code"
    type: many_to_one
    description: "Map sales transactions to category information."

  - from: veg_whsle_df
    to: veg_cat
    join_condition: "veg_whsle_df.item_code = veg_cat.item_code"
    type: many_to_one

  - from: veg_loss_rate_df
    to: veg_cat
    join_condition: "veg_loss_rate_df.item_code = veg_cat.item_code"
    type: many_to_one
    description: "Map item codes to their loss rates."

  - from: veg_txn_df
    to: veg_whsle_df
    join_condition: "veg_txn_df.item_code = veg_whsle_df.item_code AND veg_txn_df.txn_date = veg_whsle_df.whsle_date"
    type: many_to_one
    description: "Map wholesale price (cost) by matching sale date and item code to calculate profit."
