domain: banking
description: >
  Semantic model for banking, including customer transactions, nodes, and regions.
  [GLOBAL CRITICAL RULE 1]: PROPORTION VS PERCENTAGE. If a task asks for a "proportion" or "ratio", NEVER multiply the result by 100. The result MUST ALWAYS be a decimal value between 0.0 and 1.0.
  [GLOBAL CRITICAL RULE 2]: "ACROSS ALL CUSTOMERS" AGGREGATION. When calculating an average or any metric "across all customers" or "across all users" for a specific period (e.g., a month), you MUST NOT just average the existing transaction records. Customers with NO transactions in that period effectively have a value of 0. You MUST create a complete base list of ALL distinct customers (e.g., using a CROSS JOIN of all distinct customer_ids and the targeted months) and `LEFT JOIN` the transactions to it, using `COALESCE(value, 0)` before applying the `AVG()` function.

tables:
  - name: customer_transactions
    description: "Customer deposit, withdrawal, and purchase transaction history."
    columns:
      - name: customer_id
        logical_name: "고객ID"
      - name: txn_date
        logical_name: "거래일자"
        type: DATE
      - name: txn_type
        logical_name: "거래유형"
        sample_values: ["deposit", "withdrawal", "purchase"]
      - name: txn_amount
        logical_name: "거래금액"
        description: "Absolute value of the transaction amount."

  - name: customer_nodes
    description: "Customer region and node history."
    columns:
      - name: customer_id
        logical_name: "고객ID"
      - name: region_id
        logical_name: "지역ID"
      - name: start_date
        logical_name: "시작일"
      - name: end_date
        logical_name: "종료일"

  - name: customer_regions
    description: "Region information."
    columns:
      - name: region_id
        logical_name: "지역ID"
        primary_key: true
      - name: region_name
        logical_name: "지역명"

metrics:
  - name: net_txn_amount
    logical_name: "순거래액"
    table: customer_transactions
    formula: "CASE WHEN txn_type = 'deposit' THEN txn_amount ELSE -txn_amount END"

  - name: monthly_balance
    logical_name: "월말잔액"
    table: customer_transactions
    formula: "SUM(net_txn_amount)"
    calculation_method: "cumulative"

relationships:
  - from: customer_transactions
    to: customer_nodes
    join_condition: "customer_transactions.customer_id = customer_nodes.customer_id"
    type: many_to_one
  - from: customer_nodes
    to: customer_regions
    join_condition: "customer_nodes.region_id = customer_regions.region_id"
    type: many_to_one
