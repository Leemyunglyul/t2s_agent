version: 1.0
domain: interests
description: >
  Semantic model for tracking user interest metrics, compositions, and index values.
  [CRITICAL SQL RULE]: DATE FORMATTING IN SQLITE. 
  When concatenating year and month columns (which are REAL or INTEGER types) to create a Date string for `strftime`, 
  you MUST pad single-digit months with a leading zero. 
  ALWAYS use `printf('%02d', CAST(_month AS INTEGER))` to ensure the format is strictly 'YYYY-MM-DD'. 
  Failure to do so will result in NULL dates and missing data for months 1 through 9.

tables:
  - name: interest_metrics
    description: "Monthly metrics of user interests."
    columns:
      - name: _month
        logical_name: "월"
        type: REAL
      - name: _year
        logical_name: "연도"
        type: REAL
      - name: month_year
        logical_name: "월_연도"
        type: TEXT
      - name: interest_id
        logical_name: "관심사ID"
      - name: composition
        logical_name: "구성비"
        description: >
          CATEGORY RANKING BY HIGHEST VALUE.
          If asked to rank categories "based on their highest values across all months", you MUST follow a two-step process:
          Step 1: For EACH category, find its all-time HIGHEST single value (e.g., using `MAX()` or `ROW_NUMBER() OVER(PARTITION BY category ORDER BY value DESC) = 1`).
          Step 2: Apply the final `RANK()` or `ORDER BY ... LIMIT 10` ONLY on these aggregated "highest values per category". 
          NEVER rank the raw un-grouped rows, as one category might dominate the top 10 spots.
      - name: index_value
        logical_name: "지수값"

  - name: interest_map
    description: "Mapping of interest IDs to names."
    columns:
      - name: id
        logical_name: "관심사ID"
        primary_key: true
      - name: interest_name
        logical_name: "관심사명"

relationships:
  - from: interest_metrics
    to: interest_map
    join_condition: "interest_metrics.interest_id = interest_map.id"
    type: many_to_one
